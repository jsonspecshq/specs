# Optional extractor input: upstream `main` plus the open PRs, merged in the
# order below. Rebuilt by the integration run of 2026-11-13, which replaced the
# run of 2026-11-07: 17 of the 31 heads had moved in the six days between them,
# #137 through #152 and #154. #137 rewrites the whole specification, and #138 to
# #154 stack on it, each re-applying onto the rewrite the older PRs it names. So
# the fourteen PRs the first run merged by hand are merged here through that
# stack, and the order below merges every PR after the PRs it already carries.
# Measured on this run: 15 of the 31 merges changed the tree and 16 changed
# nothing, which is the signal that the order still holds, and none conflicted.
# The result is #154's own head, and `base` is an ancestor of it, so that one
# branch now carries upstream `main` and every other open PR's content.
# The integration branch exists only in a local clone, so the lock carries a
# snapshot of the specification and examples/ at `commit`, which
# `npm run fetch -- --lock specs/openproposal/input/with-open-prs.lock.yaml
# --snapshot` writes from the clone; CI runs every gate from the snapshot. With
# no source reachable (`required: false`), CI checks the committed IR instead.
