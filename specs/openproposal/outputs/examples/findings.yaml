# The places where an example the specification gives fails against OpenProposal's emitted
# schemas, uses a key the model doesn't define, or breaks a rule that one payload decides,
# each with the decision records the failing location rests on. The lock pins thirteen
# example files and each of them shows a document.
#
# No refusal of a shipped payload is recorded here. The failures the examples stage reports
# are the ones no record answers: keys the examples carry that the model publishes nowhere,
# which are rows the mapping has yet to reach (ads-jz3).
#
# The gate fails on a recorded finding that no longer occurs, so this file cannot outlive a
# departure. Every entry below states what the examples stage reports at 3eef2cb, each
# checked against that tree entry by entry. Any change to what the schemas refuse stales
# every entry that describes a refusal, so a reader comparing that commit with the one in
# hand knows whether these are current without running the gate: the same commit means they
# are, an earlier one means re-derive before reading them as the tree's state.
format: 1
