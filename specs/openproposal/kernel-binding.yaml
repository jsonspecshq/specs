homonyms:
- member: id
  decision: D-095
  reason: An object option's `id` is "its REQUIRED `id`, unique in the field" (§ 3.1), which eleven options carry as the `MintedId` the seller mints; § 5.9's mechanism
    option types it as a `TransactionMechanism`, "The mechanism, which is the option id", so the term is the id and no UUID is minted for it; and an external
    reference's `id` is "The id" another system holds, which is neither.
- member: status
  decision: D-064
  reason: Four objects carry a `status` and each states its own values. A proposal's is a `ProposalStatus` "computed by § 4.3.3"; a line item's is a `LineItemStatus`,
    which is that plus `sold_out`, and "Independent of the proposal's status, so one line item may sell out while the rest of the shelf stays live"; a hold's
    is a `HoldStatus`; and a change request's is an `ApprovalStatus`, "in the spelling of OpenDirect 2.1's ChangeRequest `status`". One concept over the four
    would publish a line item's `sold_out` on a change request.
- member: time_zone
  decision: D-055
  reason: A line item's `time_zone` is the clock its daypart and calendar frequency cap are read on, which § 2.2 states as a `ZoneName` and which may be `viewer_local`, where the ad renders; a screen's
    and a billing period's `time_zone` is a zone the IANA database lists, which § 2.2 states as an `IanaZone` and which admits no stand-in, because a screen has a zone and an invoice period is cut on one.
- member: quantity
  decision: D-093
  reason: An addressable scale's `quantity` is "How many", a count of reachable things; an availability's is "How many. It can be fractional where the unit is, such as `rating_points` per `day`", which
    is a measure and not a count. One concept would let a scale be fractional, which no row of it admits.
- member: url
  decision: D-093
  reason: A document reference's `url` is an `HttpsUrl`, because § 2.2 makes the scheme part of the requirement for a document a counterparty fetches and stores; an asset's is a `Url`, "Where the asset
    is, such as a tag URL with its macros unexpanded", which admits `http` as D-079 read for the rows that state no scheme.
