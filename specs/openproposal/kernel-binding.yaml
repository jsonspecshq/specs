constructors:
- name: Selectable
  sources:
    spec:
    - ir: marker:3:selectable
      digest: 8a003787c373122f307a428826b4ca094f064f90fc1877096d8f8232946e3a51
      quote: '`selectable` | The buyer chooses from a seller-declared set. Each option MAY carry a price delta. Resolves without a round trip.'
  parameters:
  - name: K
    carries:
      member: id
      decision: D-095
  rules:
  - id: constructor:Selectable:options-named
    source:
      spec:
      - ir: rule:3.1:bfffacdf
        digest: 705cdabdb624bd15e1d51d39445a32e68b2d7c9c3364e2beedeca3da9ca4e77f
        quote: An object option's id is its REQUIRED `id`, unique in the field.
        locks:
        - with-open-prs
      decision: D-095
  - id: constructor:Selectable:priced-beyond-included
    source:
      spec:
      - ir: key:3.1:Selectable.deltas
        digest: 4700416237f4a50c06b55fc36d2f452b0e233bbc1df246421eb972e901716d8b
        quote: '`deltas` | OPTIONAL | The price of an option outside `included[]`, keyed by option id. An option with no entry has no delta'
      - ir: "key:3.1:Selectable.included[]"
        digest: 659488665861929f507b596c583a50b4c0791fbad4a7507e4ba39c31d939e769
        quote: '`included[]` | REQUIRED | The options in the base rate, by option id'
