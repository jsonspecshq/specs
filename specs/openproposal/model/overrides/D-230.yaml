format: 2
id: D-230
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 3.2's `Narrowing` states two MUST-level requirements in its Meaning cells --
  every `include[]` entry covered by an `allowed[]` entry, every `exclude[]`
  entry covered by an `include[]` entry -- and no rule claims either. Can a
  payload decide them, and if so what does "covered by" compare?
