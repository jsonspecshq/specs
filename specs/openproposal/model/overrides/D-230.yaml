options:
  - id: rules-of-the-line-item-reading-each-field-s-own-coverage
    summary: >-
      Both are rules a line item's payload decides, owned by `LineItem`,
      because the comparison needs the `allowed[]` of the same settable field
      and the coverage relation the field states -- in its own row, or in the
      type its row points at. The check reads equality always, and beyond
      equality only what the text states: a device code `1` covering `4` and
      `5`, a daypart window covering any window inside it, and a country code
      covering every subdivision code it prefixes.
  - id: a-constructor-rule-on-narrowing
    summary: >-
      Both belong to the `Narrowing` constructor, so every copy carries them
      and the check sees one `Narrowing` value.
  - id: rules-checked-by-equality-alone
    summary: >-
      Coverage is membership: an `include[]` entry is covered when `allowed[]`
      holds that same entry. One relation, no per-field reading.
chosen: rules-of-the-line-item-reading-each-field-s-own-coverage
rationale: >-
  **§ 3.2 says what coverage is and defers the rest to the field.** Between the
  `Narrowing` table and `SettableRange` the section states: "An entry covers
  itself and what the field says it contains. Nothing else is assumed." So
  coverage is reflexive everywhere, and anything wider is the field's to state.
  That sentence is quoted here from the pinned text and is covered by no IR
  element, because the extraction does not hold it, which is carried apart from
  this record, and it is the reason this record names the three field rows and
  the `GeoCode`
  definition instead: they are where each widening is written and they are
  extracted.


  **Three fields use the form and each states its own widening, which is what
  settles the reading.** § 5.5's `device` row states one outright --
  "Mobile/Tablet - General (1) covers Phone (4) and Tablet (5)". Its `daypart`
  row states another -- "A window covers any window inside it". Its `geo` row
  states none in the row itself and points at a type -- "`allowed[]` of
  `GeoCode` (below)" -- whose definition states it: "The country of an ISO
  3166-2 code is the part before the hyphen, and a country covers every
  subdivision code it prefixes. An extension term covers only itself." So the
  field says what it contains either in its row or in the type that row names,
  and one relation cannot serve all three.


  **Where the shipped payloads settled it.** Reading `geo` as equality alone
  was the first form of this record, and `examples-validate` refused it on two
  payloads the specification itself ships: § 5.5's own fenced block and
  `examples/proposal-issued.yaml`, both of which write `geo.allowed: ["US"]`
  with `value.include: ["US"]` and `value.exclude: ["US-TX"]`. That exclusion
  is covered only if `US` covers `US-TX`, which the `GeoCode` definition says it
  does. So the search for the widening has to follow the row's pointer into the
  type, and a reading that stops at the row is incomplete -- which is what those
  two payloads are for.


  **`rules-checked-by-equality-alone` refuses payloads the specification
  allows, and this is measured rather than argued.** On `geo` it refuses the
  two shipped payloads above. On `device` it would reject `allowed: [1]` with
  `include: [4]`, which the `device` row says is covered; on `daypart` it would
  reject an included window inside an allowed one, which the `daypart` row says
  is covered. A check that reports a violation the text permits is worse than no
  check, because the finding is then the check's and a reader has to discover
  that.


  **`a-constructor-rule-on-narrowing` cannot see what it has to compare.** A
  `Narrowing` value holds `include[]` and `exclude[]` and no `allowed[]`:
  `allowed[]` is the `Settable` envelope's key, one level up. And neither a
  `Narrowing` nor a `Settable` value carries the name of the field it is on, so
  a check at either level cannot reach the coverage relation the field's row
  states. The object that holds the settable fields does, as keys, which is how
  `rule:3.1:bfffacdf` already reads every field whose value states
  `available[]`. So the owner is `LineItem` and the field name is read from the
  key.


  **The second requirement has the same shape as the first and not a narrower
  one.** `exclude[]` against `include[]` is within one `Narrowing` value, so it
  needs no envelope -- but it needs the same coverage relation, because an
  excluded daypart window inside an included one is covered. So both are the
  line item's and both read the field.


  **What the check does not decide.** Where a field's row states a widening the
  check does not implement, coverage falls back to equality and the check can
  only report what no entry covers at all; it never reports a pair the text
  permits. The three relations above are every one § 5.5 states for a settable
  field, in a row or in a type a row points at. A fourth settable field, or a
  widening added to one of these, needs this record re-read, which a cover on
  that sentence would have caught and today nothing does.
evidence:
  - 'The shipped line-item-display.yaml carries all three settable fields with their
    `allowed[]` and `default.include[]`, and its `device` line annotates the widening
    in a comment of its own: "AdCOM 1.0 Device Types; 1 covers 4 and 5"'
  - 'A `Narrowing` value holds no `allowed[]` and no field name, so neither it nor the
    `Settable` envelope can reach the relation the field''s row states'
