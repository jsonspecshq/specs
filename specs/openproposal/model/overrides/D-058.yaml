question: § 2.2 states `RegistrableDomain`, "a `Domain` that is the Public Suffix List registrable domain,
  taken over the whole list, PRIVATE section included", whose Rules cell reads "It names a business",
  and nine rows name it. The kernel carries `Domain`, any host name. Is a business's domain the same value
  domain as a host's, or its own?
