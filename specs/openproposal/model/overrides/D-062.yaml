id: D-062
status: proposed
kind: reading
basis: gap
author: agent
question: 'With § 2.2''s `ApprovalStatus` and `CalendarUnit` declared, two member names resolve to two
  concepts each: `approval_status` to `ApprovalStatus` on an asset and to `AssetApprovalStatus` on the
  predecessor''s assets entry, and `granularity` to `CalendarUnit` on an availability and to the `duration`
  concept on the predecessor''s. Is each one member meaning two things, or one member the rewrite retyped?'
