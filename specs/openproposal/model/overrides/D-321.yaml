format: 2
id: D-321
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 4.3.4 closes its expiry table with a sentence capping a hold: `hold.valid_until` MUST NOT
  exceed `offer_window.end` or the earliest `pricing[].price_valid_until`. The window is the
  proposal's and the hold and the entries are a line item's, so which object owns the rule, and
  can one payload the specification ships decide it?
