question: >-
  Two rows state their core terms by naming another row's and adding to it: § 5.3's
  `AddressableScale.unit` is "the `frequency_cap.per` terms (§ 5.5), and `person`", and § 5.7.1's
  `ReportingOption.provided_metrics[]` is "the `unit` terms of § 5.6.5, and the Rate terms of the
  `metric` table (§ 5.7.1)". Neither carries a value list of its own, so each is published as the
  term grammar. Which vocabulary does each name?
