options:
- id: open-with-the-rows-as-terms
  summary: '`ErrorCode` is open: the ten rows of the `code` table are its core terms and an extension
    term is a code outside them. The `code` row takes it in place of the bare term type, and each row
    becomes one term.'
- id: closed-with-the-rows-as-terms
  summary: The same ten terms and the same entries, closed, so a code outside them is refused.
chosen: open-with-the-rows-as-terms
rationale: 'This narrows D-073 and leaves it standing. That record read eight lists a sentence states
  and made seven of them closed, "because each sentence lists what the member may carry and invites nothing
  further". For section 2.4''s codes the sentence is not the only place the text speaks, and the two others
  say the opposite.


  The row that holds the value reads "`code` | REQUIRED | A core code (below) or an extension code". And
  the section closes "An `ErrorObject` is open. A receiver that does not recognize a code, or a key of
  the object, acts on `retry`." A receiver is told what to do with a code it does not know, which is a
  statement that would mean nothing if an unknown code made the document invalid. The sentence D-073 read
  begins "Core codes:", which is the same word `MediaChannel` and `CostMethod` use for the listed half
  of an open vocabulary.


  So the published enum of ten refused every extension code the specification admits, which is narrower
  than the document -- the one direction a published type may not be. `closed-with-the-rows-as-terms`
  is that form, and it is refused on the row and the closing statement rather than on preference.


  The ten rows of the `code` table become the ten terms. Each gives one code the condition it is returned
  under -- `stale_version` is "An ask is stale (§ 4.1.3)" -- so the row is where that term''s meaning is
  stated and the sentence above is where the set is. The `code` row takes `ErrorCode`, where it took the
  bare term type that admits every term of every vocabulary and lists none of these.'
challenge:
- type: ErrorCode
  value: record_mismatch
  verdict: accept
  context: >-
    A receiver that recomputes a `record_digest` and finds it different from
    the one the request carried, which is the tenth row of the `code` table.
  reason: >-
    The ten rows are the vocabulary's core terms, so each is a value the
    published type takes.
- type: ErrorCode
  value: examplessp.example:quota_exceeded
  verdict: accept
  context: >-
    A seller that refuses a request for a reason this version lists no code
    for, and names the reason in its own domain.
  reason: >-
    Open is the whole of this record: the `code` row admits "an extension
    code" and the section tells a receiver what to do with a code it does not
    know. `closed-with-the-rows-as-terms`, the option not taken, is the enum
    of ten alone and refuses this value.
- type: ErrorCode
  value: quota_exceeded
  verdict: reject
  context: >-
    The same seller, writing its own reason as a bare word rather than in its
    domain.
  reason: >-
    An extension term carries the domain of the party that defines it, so a
    bare word outside the ten is neither a core code nor an extension one.
    Open admits a term the specification does not list; it does not admit a
    term nobody can trace to a definer.
