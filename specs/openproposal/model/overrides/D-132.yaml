question: >-
  Four rows state that a member of the type they reference is required at that
  row — "`line_item_id` is REQUIRED here", "`legal_name` is REQUIRED here".
  Which construct carries such a statement: a keyword in the carrier's own
  schema, or a rule in the rules output?
