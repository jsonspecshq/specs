question: >-
  Is a vocabulary open where the specification declares it a `VocabularyTerm` somewhere other than the
  cell that lists its terms -- in the field row's own Type cell, inside a constructor that cell applies,
  in the lead-in of a named type that holds a constructor's keys, or in the sentence that states the list?
