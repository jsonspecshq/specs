options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it. Where a named type's schema already
    states it, it is that schema's. Where a check of one payload, or of two versions and the acting party,
    can decide it, it is a rule on the smallest type that holds every field it names. Where it binds a
    party's act and no payload shows it, it is an obligation on that party. Where it describes the document
    itself or another standard's field, it carries no conformance content.
- id: every-keyword-is-a-rule
  summary: Every sentence with an RFC 2119 keyword becomes a rule, and the rules output carries all eighteen
    with a change pair each.
- id: leave-them-informative
  summary: None is read, as the restarted model left them, so the obligations reach no output and nothing
    records that the specification states them.
chosen: by-what-decides-it
rationale: 'The mapping has four roles for a statement because a specification states four kinds of thing,
  and which kind a sentence is is decided by what could show it broken. That question has one answer per
  sentence and this module''s eighteen split four ways.


  **Fourteen are duties on a party.** Twelve of them bind a receiver or an implementation: a receiver MUST
  ignore an `ext` entry it does not understand and MUST NOT reject a document because of it, MUST keep
  `ext` unchanged when it stores or forwards the document, MUST NOT keep a line item after removing fields
  from it, SHOULD NOT parse an error''s `detail`, MAY skip a whole line item it cannot read, and MUST NOT
  read a line item''s field as inherited from the proposal or from a sibling. An `ext` entry MUST NOT change
  the meaning of a field this specification defines, and a term the counterparty must understand to transact
  MUST NOT be an `ext` entry. A party that rejects a request MUST return `errors[]`. Signing is OPTIONAL in this
  specification, and a requester that can''t verify a response MAY refuse to write its own entry. Two bind a named side:
  a buyer MAY commit any subset of a proposal''s `line_items[]` and MAY refuse a sole or last `makegood`;
  a seller''s own `ext` entries MUST use its `seller.domain` as the key.


  That last one is the closest call and the reason the split is about evidence and not about grammar. A
  payload holds the seller''s domain and holds the `ext` keys, so the comparison looks mechanical -- but
  the statement is about the seller''s *own* entries, and nothing in the document says whose an entry is.
  A proposal whose `ext` carries the buyer''s domain breaks no rule. So no payload decides it and the duty
  is the seller''s.


  **Two are the schema''s.** The proposal, each line item and each `change_requests[]` entry MAY carry
  `ext`, an `Ext`; and each key of it MUST be a `Domain` that its owner controls, with each value an object
  the owner defines. The kernel''s `Ext` part is `Map[Domain, Object]`, so the form of the key, the form
  of the value and the optional presence on the three objects are all published. What the schema cannot
  state is the clause "that its owner controls", which is the same unprovable-from-the-payload shape as
  the seller''s own entries above; it travels with the statement rather than splitting it, because one
  element carries one role.


  **Two carry no conformance content.** Section 2.6 states the columns this specification''s own key tables
  have, which is about the document and not about a value in it. Section 1.1''s "OPTIONAL." is a cell of
  the table that maps an agreed line item onto the Deals API''s `Deal.ext.baseline`, a field another standard
  defines and this one does not.


  **None is a rule.** No sentence of this module constrains a value or a pair of versions in a way a check
  could run, which is why the rules output gains nothing here and no change pair is written. That is a
  property of the module -- it states how parties behave and how the document is laid out -- and not of
  the reading: the sections that state what a value may be are section 4 and section 5.


  `every-keyword-is-a-rule` would put fourteen duties into a document of rules that each need a valid and
  an invalid payload, and no payload exists for "a receiver MUST keep `ext` unchanged when it forwards
  the document": both versions are valid documents and the difference is an act outside them. The rules
  output would carry fourteen rules nothing can grade.


  `leave-them-informative` is what the restarted model published, and it loses the specification''s own
  words: a reader of the generated material would not learn that a receiver may not reject a document
  over an extension it does not know, which is the clause that makes extensions safe to send.'
