question: § 2.2 states two time-zone types — `IanaZone`, a name the IANA database lists, and `ZoneName`,
  an `IanaZone` or `viewer_local` — and the kernel carries one, `TimeZone`, whose pattern is the union
  of both. Three rows name one of the two. How many types does the model carry, and which does each row
  take?
