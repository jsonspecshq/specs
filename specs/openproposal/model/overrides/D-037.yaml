format: 2
id: D-037
status: proposed
kind: reading
basis: gap
author: agent
question: How is the ID of a record a party mints written, so that every party compares it the same way?
covers:
- ir: field:4.1:proposal_id
  digest: 505aadeb488fdbaba09c40fc494d450478648a7d6b81f20440e67d378fd6f4b6
  quote: '`proposal_id` | String | immutable | Identifies the proposal. Unique within `seller.domain`'
- ir: field:5.1:line_item_id
  digest: 54da51504430aebaa335ae5a20fefa939f005cca07dcafe4cdd3bb747baf021d
  quote: '`line_item_id` | String | immutable | Identity within the proposal'
options:
- id: as-the-text-types-it
  summary: >-
    A string on which the specification states no further form, which is what
    every such row's Type cell reads and what every shipped payload writes. A
    UUID is one such string.
- id: uuid
  summary: A UUID in the RFC 9562 string form, which JSON Schema's `uuid` format checks.
chosen: as-the-text-types-it
rationale: >-
  **The text types every one of these ids as `String` and states no further form.** `proposal_id` is
  "String | immutable | Identifies the proposal. Unique within `seller.domain`"; `line_item_id` is
  "String | immutable | Identity within the proposal"; and the same holds of the `id` of an option, a
  package, a screen, an asset and a pricing entry. Uniqueness is stated as a scope -- within a
  `seller.domain`, within the proposal -- and a scope is not a lexical form. Nothing in the document
  requires, recommends or mentions a UUID.


  **And every payload the specification ships writes a readable name.** Measured over the ten documents
  the lock pins: 245 locations, 71 distinct values, among them `business-daily-display`, `stepped-fee`
  and `seller-count`. A narrowing to `uuid` refused all 245, so **not one of the ten documents
  validated against its own published schema**, and the kernel's own fixture listed
  `business-daily-display` as an invalid value of the type.


  So the published type is the string the text types, and the schema checks what the specification
  states: that the value is a string. Two parties compare it for equality and read nothing from it,
  which is what each row asks of it. A party that wants an identity no coordination can collide still
  mints a UUID, and the schema accepts it, because a UUID is one such string; what the schema stops
  doing is refusing every other party's. An id another system keeps, such as a DSP seat or a registry
  entry, stays an `external-id` as before, and so does `proposal_template_id`, which links a proposal
  to the seller's own template and which the text calls opaque to buyers. A reference to a minted
  record, such as a commitment's `proposal_id` or a `VersionRef`'s, carries the same identity, so it is
  the same type.


  **`uuid` is refused on the test the owner's rules state.** A refused vector is a question about the
  schema: where the text states a payload and the published schema rejects it, the schema is the
  suspect. The text states these payloads -- they are the document's own examples, not fixtures this
  repository authored -- and no regex decides a `String` cell against a UUID the document never names.
  What `uuid` bought is collision-freedom across independently minting parties, which is a real
  property and is worth asking the working group for; what it cost is that the specification's own ten
  documents were invalid against the schemas published from it. The property belongs in `feedback`, as
  a change to request, and not in the schema as a requirement the text does not state.


  **Dropping the narrowing creates no contradiction and loses nothing the text states.** Measured on
  the tree: the 245 findings this record answered no longer occur and are removed with it;
  `examples-validate`'s unrecorded contradiction count is unmoved at 7, every one of them a
  `placement/ssai` or `requested_terms/properties` key the mapping has yet to reach and none of them
  an id; and no rule, constraint or presence the text states is given up, because the only thing given
  up is a form the text never stated. With the open PRs the text says an `idempotency_key` is opaque
  and that the seller MUST NOT interpret it, which this reading states exactly and the narrowing
  stated by checking a form instead.
evidence:
- examples/proposal.yaml, proposal-issued.yaml, proposal-agreed.yaml and the seven line-item documents
  (245 id locations, 71 distinct values, every one a readable name)
- https://www.rfc-editor.org/rfc/rfc9562
challenge:
- type: VersionRef
  value:
    proposal_id: business-daily-display
    version: 1
  verdict: accept
  context: >-
    A reference to the shipped proposal.yaml at its version, whose
    `proposal_id` is the value the specification's own document writes.
  reason: >-
    The cell types a minted id `String` and states no further form, so the
    readable name the document writes is a value of the row. `uuid`, the option
    not taken, refuses exactly this, and refused it in 245 places.
- type: VersionRef
  value:
    proposal_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    version: 1
  verdict: accept
  context: >-
    A reference minted by a seller that writes UUIDs, so that two parties
    minting independently cannot collide.
  reason: >-
    A UUID is a string, so this reading accepts it too. The two readings differ
    on what is refused and not on what is allowed, which is why the whole cost
    of the narrowing fell on the specification's own payloads.
- type: VersionRef
  value:
    proposal_id: 42
    version: 1
  verdict: reject
  context: A sender that writes the identity as a number.
  reason: >-
    The cell says `String`, so a number is refused. Dropping the form does not
    drop the type.
feedback: >-
  Say whether an id a party mints must be a UUID (RFC 9562). The specification types every one of them
  as `String` and states only a scope of uniqueness -- within a `seller.domain`, within the proposal --
  and all ten shipped documents write readable names such as `business-daily-display` and `stepped-fee`,
  which two sellers could mint alike. If the intent is that two independently minting parties cannot
  collide, say so in § 2.2 and in each row, and the published schemas will check it; the rows this
  covers are `proposal_id`, `line_item_id`, `package_id`, `pricing_id`, `asset_id`, `screen_id`,
  `correlation_id`, `idempotency_key`, and the `id` of a property, an audience option and every other
  object option. Until it is said, the schemas publish the string the text types, because a schema that
  requires a UUID refuses the specification's own examples in 245 places across all ten documents. A
  UUID would keep `idempotency_key` opaque either way: a seller checks how it is written and compares
  it, and still reads nothing from it.
