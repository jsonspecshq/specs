- ir: key:5.6.4:ImpressionMultiplier.source_type
  digest: 9e9656697e8c68a4311e3227a7fd8afa89006e88f658c6e4d89b1284e0e6f011
  quote: '`source_type` | REQUIRED | Who supplies the multiplier. A value from AdCOM 1.0 List: DOOH Multiplier
    Measurement Source Types other than Unknown (`0`), such as Publisher Provided (`2`). The value OpenRTB
