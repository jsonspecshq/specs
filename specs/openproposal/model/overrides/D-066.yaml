format: 2
id: D-066
status: proposed
kind: reading
basis: gap
author: agent
question: May an implementation add a marker of its own, beyond the ones section 3 defines?
covers:
- ir: marker:3:immutable
  digest: 36e4c2830d95e3c4ae4166cdaccae23edbe3bfa8a26898faea72ba1cb8e37586
  quote: '`immutable` | Set once at creation. Neither party may change it.'
- ir: marker:3:seller-set
  digest: 94e2c7f4738dab5dbf24aee02a582e7d10e43dd4f3aa76237063215e6867f186
  quote: '`seller-set` | The seller sets it and MAY revise it while the `status` of the object that carries it is `draft`, `published` or `under_review`. § 4.3.2 states what a revision does to a line item `under_review`. The buyer cannot change it directly.'
- ir: marker:3:selectable
  digest: 8a003787c373122f307a428826b4ca094f064f90fc1877096d8f8232946e3a51
  quote: '`selectable` | The buyer chooses from a seller-declared set. Each option MAY carry a price delta. Resolves without a round trip.'
- ir: marker:3:settable
  digest: aadea752f5c312037a97353c1e8c88c591c5b2db26ec4ae59963b9490f47507b
  quote: '`settable` | The buyer supplies a value within seller-declared bounds. Resolves without a round trip.'
- ir: marker:3:supplied
  digest: ef075b4b9dcb9458ccaa36725478dc9e802f29a2ecefe182844fc36f506f69c2
  quote: '`supplied` | The buyer provides data or an artifact. The seller does not pre-populate it.'
- ir: marker:3:requestable
  digest: 6848566b78555a6b35a505cd2a1f627422f6519b85d870dd3a1163f3a9756102
  quote: '`requestable` | The buyer MAY ask for a value outside the declared space. An ask changes the value only through a seller `grant` or `counter` (§ 4.3.1). A change on the seller''s own initiative follows § 4.1.3.'
- ir: marker:3:derived
  digest: b6358d1160fc01ac4b4be0f9f0ecd7ddc19b6045c1ea4392f00449af12513592
  quote: '`derived` | Computed by a rule this specification states. Neither party sets it directly.'
- ir: marker:3:lifecycle
  digest: 524814444ede737ab3ed5b2ece11b389b9daa7f0be9b8f98dbd2f3ebd083f218
  quote: '`lifecycle` | Live state of the object. The party its section names moves it between the stated
    values. Not a term.'
- ir: marker:3:recorded
  digest: 5cb60abe2aa69153b9cf499b61dd6e5c83b2fed00f14493272d0d80f71978ea0
  quote: '`recorded` | Written by the party that acted. Append-only: an entry is never edited or removed.
    Not a term.'
- ir: marker:3:asserted
  digest: adac5c0cbcb93033b5776a28f4fb27bd8ccc72bdd570f075d9626cba443664cd
  quote: '`asserted` | The seller states it from data the buyer can''t recompute. Not a term, and it changes
    without a new version.'
- ir: marker:3:mixed
  digest: 7c5eab99d5a8d933cf681a1e8b30c1c5840aacfb4dd49681e2ac6f563b2d2bc4
  quote: '`mixed` | The keys of the object carry different markers: in the Mutability column of its key
    table, in its lead-in for composed keys, or on its rows for `pricing[]`.'
options:
- id: closed-markers
  summary: The markers are the ones section 3 defines, a closed vocabulary, and the rules each marker
    states belong to it.
- id: open-markers
  summary: The markers are an open vocabulary an implementation may extend with namespaced terms.
chosen: closed-markers
rationale: 'Section 3 says every field carries exactly one marker and then defines each one, so the rows
  are the list and nothing in the text invites another. A marker is a mutability rule that a generated
  library enforces between two versions of a document, and a library cannot enforce a rule it has never
  been told, so a marker nobody defined would be carried and ignored -- which is worse than refused, because
  the sender is told nothing.


  So the model holds them as the vocabulary `Marker`, whose terms the marker rows define and whose rules
  belong to it.


  The text now answers what an earlier reading of this specification had to ask. `mixed` was once a value
  two field rows carried and section 3 did not define, so whether it was a marker at all was open and
  the reading had to settle that its members carried their markers instead. Section 3 now gives `mixed`
  a row of its own, beside ten others, so it is a marker because the specification says it is, and this
  record asks only whether the list is closed.'
