format: 2
id: D-123
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  `Range`'s parameter takes a type whose values are ordered. Does a length of
  time written as an ISO 8601 duration order, and if it does, what settles a
  pair of bounds the written forms alone do not?
covers:
- ir: def:2.2:Duration
  digest: b8964f62205468b2e358f311497bf7bac3b639dddf0eeead1ce15f5526490b06
  quote: "`Duration` | String: the ISO 8601 grammar of RFC 3339 Appendix A without its week form (`P14D`,\
    \ not `P2W`) | A length of time. A comparison names its anchor. A length within the playback of an ad\
    \ or a placement, such as a play, view, read, loop, slot, or refresh, is instead an Integer whose key\
    \ ends `_s` or `_ms`, except a key imported from another standard, which keeps its spelling (§ 2.6)"
- ir: def:2.2:Range
  digest: a5f2fef3bebd5d423fa2851e2932f39cd399076f17968466789fa94ff4895d96
  quote: "`Range` | bounds a value of type `T`, written `Range[T]`. At least one bound is present, and\
    \ `min` is no greater than `max`."
- ir: field:5.9:retention
  digest: 3e9712ff57aa7e91db5c73fb72e61fc7410635c243b103bf5d83e779eb5d66de
  quote: "`retention` | Range[Duration] | requestable | From release or air. The ad stays in every copy of the content the seller distributes for at least `min` and is removed by `max`. No `max`: indefinitely. When `placement.feed` is present, only copies in that feed count toward delivery"
options:
- id: the-length-orders
  summary: >-
    A written duration orders, on the length of time the form denotes and not
    on the string that writes it, so `Duration` fills `Range`'s parameter as a
    number and a timestamp do. A pair whose order is the same under every
    anchor is decided; a pair the anchor settles is decided by no payload.
- id: the-string-does-not-order
  summary: >-
    A written duration does not order, so § 5.9's cell applies `Range` to a
    type the constructor cannot carry, and the row is a departure stating the
    cost.
- id: ordered-only-where-the-row-says-so
  summary: >-
    The parameter is satisfied by the words of each row that applies it, so
    § 5.9's `retention` orders because its own cell orders the bounds, and
    every such row needs a record to say so.
chosen: the-length-orders
rationale: '§ 2.2 states the ordering for every `T` it bounds: "`Range` bounds a value of type `T`, written
  `Range[T]`. At least one bound is present, and `min` is no greater than `max`." It names no restriction
  to numbers and timestamps, and § 5.9 applies `Range` to a `Duration`. So the text asserts an order over
  a pair of written durations, and what orders is the length each form denotes: a string comparison puts
  `P1Y` below `P90D`, which is the opposite of what the row states.


  `Duration`''s own row says what that order needs: "A length of time. A comparison names its anchor."
  A day, an hour, a minute and a second are each one length, but a calendar month runs 28 to 31 days and
  a calendar year 365 or 366, so a form naming one denotes a span and the anchor picks the length within
  it. § 5.9 names the anchor the comparison is measured from -- "From release or air" -- and that anchor
  is a fact about the content, which no payload of this specification carries.


  Three outcomes follow, and `constructor:Range:ordered` reaches each on the written forms alone. A pair
  in order under every anchor holds: the shipped `retention` is `{ min: "P90D", max: "P1Y" }`, and a calendar
  year is 365 or 366 days, so it is at least ninety under every anchor. A pair out of order under every
  anchor violates: `{ min: "P1Y", max: "P90D" }` does. A pair the anchor settles, `{ min: "P1M", max: "P30D" }`,
  is decided by the anchor and not by the payload, so the check decides nothing of it. The example the
  specification ships falls in the first, so it is checked and not excused.


  `the-string-does-not-order` has to read § 2.2''s sentence as not holding of the one application the text
  makes of it, and would publish a departure against a cell the text states plainly.


  `ordered-only-where-the-row-says-so` is what D-123 supersedes. It reads the same order off each row''s
  prose rather than off the type, so every `Range[Duration]` row needs a record, and it gives up the two
  pairs the forms do decide: under it the shipped pair stands undecided though every anchor agrees on it.
  The order is a property of the length a duration names, so it belongs to `Duration` and the mapping rule
  reads it from the type''s declared form, `format: duration`.'
evidence:
- examples/line-item-podcast-embedded.yaml (retention { min "P90D", max "P1Y" })
- '`field:5.9:retention` parses as `Range[Duration]` (`type_states.parsed`), so the application is the
  cell''s own form and no reading of the row''s prose is needed to resolve it.'
- 'RFC 3339 Appendix A''s duration grammar carries no sign and no fractional part, so every written duration
  names a non-negative length.'
- AdCOM and the Deals API apply `Range` and `SettableRange` nowhere, so no row of either resolves differently
  under this reading.
challenge:
- type: RetentionRange
  value:
    min: P90D
    max: P1Y
  verdict: accept
  context: >-
    An embedded podcast read the seller keeps in every copy for ninety days
    and removes within a year, which is what the shipped example writes.
  reason: >-
    The bounds are the `Duration` the cell names, and ninety days is at most a
    calendar year under every anchor, so the pair is a value of the row and
    `constructor:Range:ordered` holds of it.
- type: RetentionRange
  value:
    min: P1Y
    max: P90D
  verdict: accept
  context: >-
    The shipped pair with its bounds exchanged, which no seller could honour:
    the ad would be removed before the term it is kept for ends.
  reason: >-
    The schema publishes the two bounds at their type, so the pair is a value
    of the row and the schema accepts it. `constructor:Range:ordered` is what
    refuses it, and it is the rule and not the schema that carries an order.
- type: RetentionRange
  value:
    min: 7776000
    max: 31536000
  verdict: reject
  context: >-
    A sender that reads "a length of time" as a count of seconds and writes
    the two bounds as numbers.
  reason: >-
    The bounds are `Duration`, a string in one written form, so a number is
    refused however plainly it states the same length. The order being on the
    length the form denotes does not make a count of seconds one of its forms.
feedback: >-
  State in § 2.2 that `Range`'s `T` may be a length of time, and that a pair of
  durations compares by the length each form denotes. Say which anchor
  `retention` is measured from when the content has both a release and an air
  time, since § 5.9 names the two together. Say what a receiver does with a
  pair whose order the anchor settles, such as `{ min: "P1M", max: "P30D" }`:
  this reading leaves it to the anchor, and a sender cannot tell from the text
  whether the pair is well formed.
