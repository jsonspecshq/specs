question: '`D-050` reads § 2.2''s glossary against the kernel and refuses `one-primitive-per-spelling`,
  on the ground that fourteen of the 24 spellings are concepts the kernel already represents, so minting
  a primitive per spelling would put two types on one concept. Where a spelling names not the kernel''s
  concept but a *narrowing* of it, which of the two does the row take?'
