options:
- id: concept-names
  summary: Each list is named for what its values are. Where the row's name states one concept, the list
    takes that name, capitalized and singular. Where the row's name is generic or shared, the name adds
    the object's, as a fee's `calculation` and an exclusivity option's `scope` do. A row whose values
    are not instances of its own name takes the name of what they are.
- id: row-names
  summary: The row's name in PascalCase, as type rules section 7 names a copy, with a number on a collision,
    such as `Type` and `Type2`.
- id: object-and-row
  summary: Always the object's name and the row's name, such as `ProposalType` and `BillingInvoicePeriod`.
chosen: concept-names
rationale: 'A generated library names a type once and every reader of that type sees the name, so the
  name has to say what the value is without the row it came from beside it. `row-names` fails on the rows
  a specification repeats: `type`, `method`, `basis`, `scope` and `unit` each name several unrelated lists,
  and a numbered copy says which list only by accident of order. `object-and-row` is unambiguous and unreadable:
  it gives `BillingInvoicePeriod` and `AvailabilityUnit` alike, so a name that already states its concept
  is made longer for no gain.


  So the object''s name is added where the row''s name alone is ambiguous and not otherwise, and a row
  whose values are not instances of its own name is named for the values: `episodes` selects episodes
  rather than being one, and `settles_on` is a verb where the value is a basis.


  Where the current text states a concept the earlier reading of this specification already named, that
  name is kept, so a reader of either tree sees one name for one thing: `ProposalType`, `NegotiationAction`,
  `StorePlatform`, `CreativeDeliveryMethod`, `FrequencyCapBasis` and `AvailabilityType` are those six.
  Section 2.2 of the current text names `Side`, `ProposalStatus`, `ApprovalStatus` and `CalendarUnit`
  itself, so this record does not name them: where the specification names its own type, no reading is
  needed.


  The lists a prose block holds are not covered here. Whether a list in a sentence states a type of its
  own or restates one the tables already define is a reading of the sentence, and the statements are read
  together.


  One name this record gave was the text''s own for something else. The value list of a line item''s `shortfall_remedy`
  holds `makegood`, `credit` and `none`, and the row''s name gave it `ShortfallRemedy` -- which is the
  name section 5.7.1 heads a key table with, so the object the text declares had its name taken by a vocabulary.
  The values are kinds of remedy rather than remedies, so the list is `RemedyKind` and `ShortfallRemedy`
  is the object.'
