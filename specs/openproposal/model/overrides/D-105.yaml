options:
- id: the-registry-s-titles
  summary: >-
    Each row reuses the registry's list, and its terms are the registry's own titles for the codes,
    written as terms, with a map from each term to the code it stands for. A negative code is the
    integer that map gives.
- id: leave-the-three-unmapped
  summary: >-
    A vocabulary's terms cannot spell a negative code, so the three rows stay untyped until the term
    grammar admits one.
chosen: the-registry-s-titles
rationale: 'D-071 chose to reuse the registry rather than copy its codes, and set these three aside in
  its own words: "A start delay mode, a pod sequence and a slot position in a pod each hold a negative
  code, and a term of a vocabulary is a name rather than a number ... so each of those three states its
  terms as the registry''s titles with a `codes` map from the term to the number." This record is that
  reading taken, and the terms are the titles AdCOM''s own schema gives each code at the commit the
  profile pins: `pre_roll` for 0, `generic_mid_roll` for −1 and `generic_post_roll` for −2; the three
  pod-sequence titles; and the four slot positions, `first_or_last_ad_in_the_pod` among them.


  The map is what carries the sign. A term is letters, digits and underscores, so `-1` is a code no term
  can spell, and the mapping format''s `codes` admitted only letters and digits on the other side of the
  map as well. It now admits a signed decimal, which is read as the integer code, so the one thing a
  term could not say is said by the map and not by the term.


  None of the three lists reserves codes for vendors, so each vocabulary is closed. Start Delay Modes
  holds one row that is no code, `>0`, which the registry publishes as a media offset -- the delay in
  seconds of a mid-roll at a given second -- and the kernel''s `media-offset` concept cites that row.
  The published type is a reference to the registry''s own vocabulary, so that branch arrives with it
  and this specification states it no second time.


  `leave-the-three-unmapped` is what the model published, and it costs three rows of a table the
  examples fill: the CTV line item declares three break positions and every one of them writes a
  `delay` and a `slotinpod`, so twelve values of the ten examples were keys the model defined nowhere.
  The grammar it waits on is this repository''s, not the specification''s, which makes it a thing to
  change rather than a thing to wait for.'
