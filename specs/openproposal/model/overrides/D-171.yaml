  - ir: rule:4.1.4:d0dd8213
    digest: e9e7b958ad6cff756d28ad747ed60d26a1559c8547d1dc53403346aa3df18d50
    quote: A `commit` that names a line item in a package's `line_items[]` MUST name all of them.
  - ir: rule:4.1.4:24987106
