    digest: 43392f1f110005df6198890fcbf269c68790233cb10cf726a8fa9b9a22e8500b
    quote: A line item that appears in a frozen version MUST NOT be removed from the proposal or moved to another package; it leaves the shelf by its `status` (§ 5.1), which is a lifecycle change.
  - ir: rule:4.1.2:0006fe1d
    digest: 7793fc15e0fefb0ec9b39dbf9f8ce7f705c8da81769688db5a06f7ec7acdcf48
