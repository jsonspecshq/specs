id: D-171
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  §§ 4.1 to 4.1.4 state seven MUST-level requirements in prose that no rule
  claims. Type rules § 2a gives three carriers -- a keyword of the schema, an
  entry of the rules output, an obligation on a party -- and the form of a
  prose statement says which for none of them. Which carries each?
covers:
  - ir: rule:4.1:ce1d9648
    digest: 78b338bdf7b4bee50907bdfe614694ced549764abc13dc72cead247ddc252886
    quote: The offered terms of a frozen version MUST NOT change; a change to them creates version `n+1`.
  - ir: rule:4.1.2:a855dcd7
    digest: a3ce6e90057cbfbbf92b9791066100075feed6a32cb62ee997cfcff3388b6cab
