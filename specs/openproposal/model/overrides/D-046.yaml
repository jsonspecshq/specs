format: 2
id: D-046
status: proposed
kind: reading
basis: gap
author: agent
question: What names an object option in `included[]` and the `pricing` keys, and must a property's or
  an audience option's `id` be present?
covers:
- ir: field:5.6:cancellation_policy
  digest: 8530cd4daec72654adaccffccd20e7b4fdc26e7f5707fe6eda9b411cff1601cb
  quote: '`cancellation_policy` | Selectable[CancellationOption] | selectable | See § 5.6.6. Absent: this
    field states no right to cancel, and `terms_refs[]` (§ 5.8) may state one'
- ir: field:5.6:exclusivity
  digest: e0eab91e5d11a3d377570b950a95a1b06aedd05004e2b9d3028a13ddcefd7a5a
  quote: '`exclusivity` | Selectable[ExclusivityOption] | selectable | See § 5.6.7. Nothing in effect:
    no exclusivity'
options:
- id: required-id
  summary: 'An object option is named by its `id`. Every object option carries one, required: the identity
    the seller mints for it.'
- id: own-member
  summary: Each option is named by a member of its own that sets it apart, such as a measurement source's
    `vendor` or a report's `feed_type`.
- id: optional-id
  summary: An object option may carry `id`, and one without it can't be named in `included[]` or `pricing`.
chosen: required-id
rationale: '§ 3.1 keys `pricing` by `option_id`, and `included[]` lists which options are in the base
  rate, so every option that can be included or priced needs a name. A string option is its own name.
  The text doesn''t say what names an object option, and the property and audience options write `id`
  with no presence. A member of an option''s own, such as `vendor` or `feed_type`, isn''t unique: a seller
  can offer one vendor with two attribution windows, or one feed type at two cadences. An optional `id`
  leaves an option that `included[]` and `pricing` can''t name. So an object option is named by its `id`,
  which it carries, required: the constructor gives it, as a rule of the selectable template, to each
  object type that is an option, and the mapping keeps the members the text writes. The property and audience
  options keep the `id` they write and make it required, and the cancellation and exclusivity options,
  whose members the text doesn''t state, carry it too. An option given as a `catalog_ref` has no `id`. The `id` is a UUID, as every ID a party mints is (D-037). Giving an `id` to the production,
  measurement source, and reporting options, whose members the text listed without one, changed what the
  text settled, so that part was a change we proposed; the open PRs this lock pins took it up and every
  option type now states the `id` row, which D-141 measures.'
evidence:
- examples/line-item-display.yaml (properties and audiences)
feedback: Say that `included[]` and the `pricing` keys name an object option by its `id`. Mark the `id`
  of a property and an audience option REQUIRED. Give the cancellation and exclusivity options an `id`
  once their members are defined.
