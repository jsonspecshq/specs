options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it, as D-082 and D-083 read the overview
    and kernel modules. Twenty-six are read here and the fifteen a payload decides are named and left,
    because each needs a change pair and a pair is written against the type it grades.
- id: all-forty-one-now
  summary: Every statement is read in one record, with fifteen rules whose change pairs are written in
    the same step.
chosen: by-what-decides-it
rationale: 'Twenty-two of the twenty-six are duties, and the module is section 4, which states how a
  proposal is negotiated, so almost every sentence binds a party rather than a value. The seller keeps
  every version a `negotiation_history[]` or `assent[]` entry names retrievable by `(proposal_id, version)`;
  edits a proposal in place only while its current version is not frozen; rejects a `commit` that breaks
  a package rule with `not_committable`, by a check that MUST be deterministic; answers a resolved `commit`
  that arrives while a firm entry holds, before that entry stops holding, because silence works as a
  decline on no ground; releases or re-offers a `held` hold a revision makes stale; and names no domain
  it does not control. A consumer recomputes `record_digest` and compares it byte for byte before relying
  on a live `commitment` entry. A party writing a digest input trims, normalizes and reformats nothing
  it did not write, and writes no Number this serialization does not reproduce.


  **Two are the recorded marker''s words.** "Entries MUST NOT be edited or removed" appears twice in section
  4.1, on `assent[]` and on `negotiation_history[]`, and both are the Meaning of `marker:3:recorded`,
  which the model holds as a rule with a change pair. The sentence and the rule are the same words read
  twice, which is the reading D-083 made of section 3''s four.


  **One is a published type''s.** A history entry''s `paths[]` MAY be empty, which is an array with no
  lower bound, so `HistoryEntry` states it.


  **Two carry nothing a check reads.** Section 4.1.3 enumerates the fields that are not offered terms
  and so may change without a new version -- a long list, from `status` through every value the buyer
  writes -- which is the definition the frozen-version rule reads rather than a requirement of its own.
  And section 4.1.2''s "The evidence is OPTIONAL. An entry is complete without it. No check in this
  specification requires or verifies a signature" is a statement about this specification''s own checks,
  which is the shape D-082 read in section 2.6''s columns.


  **Fifteen are rules a payload decides, and they are not read here.** Each needs a valid and an invalid
  payload against the type it grades, and a pair is the work of writing one: the offered terms of a frozen
  version and the `version` that must move with them (§ 4.1); `legal_name` required on a proposal''s `seller`
  and on its `buyer` (§ 4.1); an assent entry''s `line_item_ids[]` non-empty, naming line items whose
  `commitment` is populated, with no line item named by two live `commitment` entries nor by two
  `acceptance` entries, and every `seller-set`, `selectable`, `settable` and `requestable` value of it
  unchanged from the version `assent[]` names (§ 4.1.2); each change to a frozen version creating `n+1`
  and appending exactly one history entry, and a line item of a frozen version never removed (§ 4.1.3);
  a `commit` naming one line item of a package naming all of them, and an add-on''s `commit` meeting every
  `min_commitments[]` (§ 4.1.4); a firm entry unchanged while it holds (§ 4.3.2); a `commit` carrying no
  `requestable` ask (§ 4.3.2); `hold.valid_until` no later than `offer_window.end` or the earliest
  `price_valid_until` (§ 4.3.4); and a change request''s `line_item_id` required (§ 4.4).


  `all-forty-one-now` is the same reading with fifteen change pairs in one step. Splitting it is not a
  smaller answer: a pair is a payload the schema accepts and one it refuses, and writing fifteen of them
  against six types is where the next record''s work is. Naming them here is what makes the remainder
  countable rather than a residue.'
