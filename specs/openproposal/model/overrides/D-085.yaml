options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it, as D-082, D-083 and D-084 read the
    other modules. Twenty-four are read here and the eleven a payload decides are named and left, because
    each needs a change pair written against the type it grades.
- id: all-thirty-five-now
  summary: Every statement is read in one record, with eleven change pairs written in the same step.
chosen: by-what-decides-it
rationale: 'Section 5.6.1 is a protocol and it dominates this module: eleven of its sentences bind the
  seller in sequence, and none of them is about a value. The seller may decline a resolved `commitment`
  with a `decline` entry; a decline for lack of availability states the `availability` of each line item
  it covers, recomputed against the buyer''s composition; while a buyer''s hold runs the seller does not
  decline that buyer''s `commitment` for lack of availability; the seller rejects a `commit` whose
  `record_digest` differs from the recomputed value, that is stale, whose proposal is past
  `offer_window.end`, or whose committed entry is past its `price_valid_until`, and the rejection carries
  `expired`, `stale_version`, `not_committable` or `record_mismatch` as the ground requires; these checks
  are deterministic, depending only on the stored proposal, the `commit`, and the time the seller receives
  it; a replay with the same `idempotency_key` and an otherwise equal `Commit` returns the result as it
  now stands and writes no second `commitment` entry; reusing that key with a different `Commit` returns
  `idempotency_conflict` and writes nothing; and a rejection whose `retry` is not `same` is kept at least
  until `offer_window.end`. Seven more bind the seller elsewhere in the module, and one binds a receiver:
  an extension entry that breaks section 5.6.5''s rules is unavailable, not a line item that is invalid.


  **One is a published type''s.** "`agreed_rate` MUST NOT be negative" is the kernel''s `Amount`, "A sum
  of money or a price per unit of a cost method, never negative", whose schema carries `minimum: 0`. The
  statement is the bound and the type publishes it.


  **Three are the requestable marker''s words.** "A buyer MAY request another value, and a granted value
  is the `list_rate` of the next `version`", and two more of the same form on `unit_bounds` and on the
  commit envelope, are `marker:3:requestable`, which the model holds as a rule with a change pair. The
  sentence and the rule are the same words read twice, which is the reading D-083 made of section 3''s
  four and D-084 of section 4.1''s two.


  **One looks like the seller''s own `ext` key and is read the same way.** "A seller''s own extension terms
  MUST use its `seller.domain` as the `<domain>`" is the duty D-082 read for `ext`: a payload holds the
  seller''s domain and the term''s domain, but nothing says whose a term is, and a pricing entry whose
  `cost_method` carries a measurement house''s domain breaks no rule.


  **Eleven are rules a payload decides, and they are not read here.** A revision does not reuse a
  `pricing_id` for a different `cost_method`, `cost_parameters`, `currency` or
  `transaction_mechanisms[]`, and two entries do not share all four (§ 5.6); for a core term the
  vocabulary sets `rate_per` and a present value matches the table of § 5.6.5; the buyer commits under
  exactly one entry, which covers the mechanism in effect; an availability is `forecast` when the line
  item''s `delivery_type` is `non_guaranteed`; `hold_terms.available` is `true` where a hold is asked
  for (§ 5.6.2); the host of `cost_definition.url` is the term''s domain or a subdomain of it; `agreed_rate`
  is greater than 0 on a spend basis outside `FLAT` and `TIME`, and the charges in effect do not exceed
  `amount`; a `FLAT` entry commits on a spend basis with no `derived_units`; and a cancellation option''s
  `fees[]` is non-empty (§ 5.6.6).


  `all-thirty-five-now` is the same reading with eleven change pairs in one step. The pairs are the work:
  each is a payload the schema accepts and one it refuses, against `PricingEntry`, `LineItem`,
  `Commitment` and `CancellationOption`, and three of them -- the `pricing_id` rules and the committed
  entry -- rest on more than one entry of `pricing[]`, so their payloads are the largest this
  specification has needed.'
