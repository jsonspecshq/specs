format: 2
id: D-122
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  `TaxonomyCodes` names no list of its own, and § 2.2 says each field that holds it names the one
  `taxonomy` comes from. What type does the shared object publish?
covers:
- ir: def:2.2:TaxonomyCodes
  digest: 2ee8d6885b0983b6f0dc485033f2421fd544ee31e06f4680eb4ecec8a308db30
  quote: '`TaxonomyCodes` | holds codes in one taxonomy. Each field that holds it names the list `taxonomy` comes from and whether an id covers its descendants.'
- ir: key:2.2:TaxonomyCodes.taxonomy
