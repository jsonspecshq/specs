question: >-
  Three statements of § 5 constrain a member by reading others: § 5.8's two rules of who may
  commit, and § 5.7.1's rule of who counts a `dooh` line item's impressions. Which object owns
  each, and can each pair be derived from a payload the specification ships? § 5.7.1's cell now
  states three conditions on `counted_by` and orders them, so the rule also asks when the `dooh`
  condition binds at all.
