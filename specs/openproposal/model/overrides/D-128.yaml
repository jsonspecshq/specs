format: 2
id: D-128
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 3.4 states `BuyerWrites` as a strict path subset of the line item and lists its paths in a
  block whose first two lines are `<selectable>.selected[]` and `<settable>.value`. What type does
  the model publish, under what name, and what are those two lines?
