format: 2
id: D-320
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 4.4's `providerdata` is typed `Object` and its Meaning names no member, no other
  standard's object and no definition that sets them: "Structured references a buyer uses to
  identify its order in the seller's system". What does the model publish for the row?
covers:
- ir: key:4.4:ChangeRequest.providerdata
  digest: 577d6443c9f823525ea30ce80f1aff5417f5d973217b0dbf0718be879cb3e385
  quote: "`providerdata` | OPTIONAL | Structured references a buyer uses to identify its order in the seller's system"
- ir: "field:4.4:change_requests[]"
  digest: 37848c071eae8107ce3bb5fda622133aae3661efcab5aa4b527dd5583bf9fb93
  quote: "`change_requests[]` | Array[ChangeRequest] | recorded | Ordered post-`agreed` history. Each entry carries the fields of the OpenDirect 2.1 ChangeRequest, except its `webhook`, plus `baseline`, `actor`, `at`, and `cancellation`. Outside the binding record (§ 4.1.1) and the offered terms (§ 4.1.3), like `negotiation_history[]`, so an entry changes neither `record_digest` nor `version`"
options:
- id: the-opendirect-field-the-lead-in-names
  summary: >-
    The row holds an object of any members, `ProviderData`, whose members OpenDirect 2.1's
    ChangeRequest states: § 4.4's lead-in says each entry carries that object's fields, so the
    definition the row's own Meaning does not name is named one table above it. It is an open
    object and `set_by` carries the citation, as `contacts[]` does for OpenDirect's Contact.
- id: an-object-this-specification-leaves-open
  summary: >-
    The Meaning names no definition, so the model publishes an object of any members with
    nothing said about whose they are, and a reader learns only that it is a JSON object.
chosen: the-opendirect-field-the-lead-in-names
rationale: >-
  THE LEAD-IN NAMES THE DEFINITION AND THE ROW DOES NOT, WHICH IS WHY THE ROW ALONE READS AS
  UNDECIDED. § 4.4's field row says each `change_requests[]` entry "carries the fields of the
  OpenDirect 2.1 ChangeRequest, except its `webhook`, plus `baseline`, `actor`, `at`, and
  `cancellation`". `providerdata` is one of those fields: it is not among the four this
  specification adds, and § 4.4 states no member of it, so the object it holds is
  OpenDirect's. Reading the row without the sentence above its table is what makes it look
  like a gap, and it is the same sentence `D-137` read for `contacts[]`, whose own Meaning
  does name OpenDirect because that row happens to.

  SO IT IS THE SHAPE THIS SPECIFICATION ALREADY HAS FOR A CITED OBJECT. `Contact` under
  `D-137`, and `Channel` and `Network` under `D-160`, are open objects whose `set_by` names
  the definition that states their members, which type rules § 2.5 distinguishes from an
  object the mapping has not finished -- that one states no members and names nothing.
  `ProviderData` joins them, named for the row under `D-065`'s `concept-names` rule.

  `an-object-this-specification-leaves-open` is what the model would publish if the lead-in
  were not there, and it would lose the one thing a consumer needs: which document states
  the members it is about to receive. It would also be indistinguishable from a row the
  mapping has not reached, which is the distinction `set_by` exists to draw.

  NO MEMBER IS PUBLISHED AND NONE IS REFUSED. This specification writes none of OpenDirect's
  keys for the object and § 2.1's summary projects no path through the row, so the type is
  open with no members, exactly as `Contact` is.
challenge:
- type: ProviderData
  value:
    order_id: "SO-2026-00417"
    line_number: "7"
  verdict: accept
  context: >-
    A buyer identifying the seller's own sales order and line for a change it requests after
    the line item is agreed, which is what the row says the value is for.
  reason: >-
    `the-opendirect-field-the-lead-in-names` publishes an object of any members, so every key
    OpenDirect's ChangeRequest defines for `providerdata` is taken without this specification
    restating one of them.
- type: ProviderData
  value: "SO-2026-00417"
  verdict: reject
  context: >-
    The same reference written as the bare string a buyer would send if the row's "Structured"
    were read as free text.
  reason: >-
    The row states a structure -- "Structured references a buyer uses to identify its order in
    the seller's system" -- and § 4.4's lead-in names OpenDirect's object, so the published
    type is an object and a string is refused. That is the cost the reading accepts, stated as
    a value: a buyer that has only one identifier writes it under a key rather than alone.

