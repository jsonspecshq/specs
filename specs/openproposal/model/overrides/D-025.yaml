options:
- id: as-listed
  summary: Each member takes the schema type or value list its meaning names. Each exclusion type is a
    key of `exclusions`.
- id: open-objects
  summary: Each object accepts any members.
chosen: as-listed
rationale: 'In `creative_delivery`, `protocol` is a term of the open vocabulary `CreativeDeliveryProtocol`
  (D-089), such as `vast_4_2`, `secure_required` a boolean, and `endpoint` a `Url`. In `assets[]`, `asset_id`
  names an asset the buyer mints, a `MintedId` (D-037), `format_ref` is a format ID, a `FormatId` (D-019),
  `url_or_tag` is `Text` because it may hold tag markup, `submitted_at` is a `Timestamp`, and `approval_status`
  a term of the open vocabulary `AssetApprovalStatus` (D-089). A production option''s `build_owner` is
  a `Party`, `lead_time` a `Duration` (D-070), and `cost` an `Amount` (D-036). In `frequency_cap`, `max`
  is the range `{ min, max }` of `Count`, `period` a calendar period of `FrequencyCapPeriod` (D-064),
  and `basis` its vocabulary. With the open PRs, an exclusion type is a key of `exclusions`: § 5.5 says
  a buyer must not supply a type absent from `exclusions_accepted.types`, and the example lists `domain`,
  `app_bundle`, `iab_content_category`, and `keyword`, the keys of `exclusions` other than `list_ref`.
  So `ExclusionType` is that closed list, and `max_entries` and `enforcement` are maps from it. Enforcement
  is "`pre_serve` or `best_effort`", the closed list `Enforcement`. The verification vendors are `ExternalId`,
  the content categories `ExternalId`, as § 5.5 says they are IAB Content Taxonomy ids, the blocked domains
  `Domain`, and the keywords `Text`. An `app_bundle[]` entry has the two keys of an app, both required,
  as the App identity table makes `platform` and `bundle`; a bundle is the app store''s ID, an `ExternalId`.
  A `list_ref` is `{ url, sha256 }`, as the example writes it. Neither member is required: no statement
  requires either one, and "`list_ref` MUST be hash-pinned" is a rule of its own.'
evidence:
- examples/line-item-display.yaml (creative_delivery, frequency_cap)
- examples/line-item-audio.yaml (production)
feedback: Type the members of each inline object. Define `list_ref` and the exclusion types as lists the
  schema can check, and say which members of `frequency_cap`, `creative_delivery`, and `list_ref` are
  required.
