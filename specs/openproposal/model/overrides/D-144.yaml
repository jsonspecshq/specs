options:
- id: three-rules-of-the-line-item
  summary: >-
    Each is a rule of `LineItem`, the object that holds every field it reads, and each pair is a
    shipped line item with one mutation: a `geo` added to the embedded one, a `format_specs` entry
    removed, and an exclusion type added to what the buyer supplies.
- id: the-buyer-s-is-an-obligation
  summary: >-
    § 5.5's names the buyer, so it is an obligation of the buyer and no payload decides it.
- id: the-format-rule-waits-on-the-proposal
  summary: >-
    § 5.4's reads the proposal's `status`, so it is a rule of `Proposal` and a line item cannot
    decide it.
chosen: three-rules-of-the-line-item
rationale: >-
  A rule is owned by the type whose payload decides it (type rules § 9), and all three read fields
  of one line item.


  § 5.9's IS DECIDED WHERE `serving_mode` IS. The bullet sits under "On an `embedded` line item",
  so the condition is the line item's own `serving_mode`, and the requirement is the absence of
  four of its fields. That is the reading `D-088` already gives the three sibling bullets of the
  same block -- `episodes`, `time_zone` and `retention` -- so this one is read the same way and
  decided by the same member.


  § 5.4's IS DECIDED BY THE LINE ITEM, NOT BY THE PROPOSAL. The requirement is over
  `formats.available[]` and `format_specs`, which are the line item's two fields; only the
  condition reads the proposal's `status`. `rule:5.4:3a677601` already reads that condition from a
  line item: the vector gives the proposal's `status` as context, and failing that § 4.3.3's first
  clause makes a proposal `draft` only while every line item is, so a line item that has left
  `draft` is in a proposal that has. A line item still `draft` says nothing, because a sibling may
  have left it. `the-format-rule-waits-on-the-proposal` would move the rule to the object that
  holds the condition rather than the requirement, and a shared line item (§ 4.3) travels without
  its proposal, so the rule would go unchecked exactly where it is read.


  § 5.5's IS A RULE AND NOT AN OBLIGATION, BECAUSE THE BUYER'S WRITE IS IN THE PAYLOAD. The
  `exclusions` row is marked `supplied`: the field is what the buyer supplies, and
  `accepted_exclusions` beside it is what the seller accepts. So a line item carrying both shows
  whether the buyer supplied a type the seller did not accept, which is what a rule is.
  `the-buyer-s-is-an-obligation` reads the named party and not the sentence: `D-087`'s consumer
  obligations ask something of a consumer's behaviour, which no payload records, while this asks
  what a field holds.


  THE PAIRS ARE THE SOURCE'S OWN BYTES. `line-item-podcast-embedded.yaml` is the embedded line
  item this specification ships, and it writes none of the four fields -- its own comment says "no
  geo, device, or frequency_cap: everyone who downloads gets the read". The valid half is that line
  item trimmed to the keys a `LineItem` requires plus the `placement`, `episodes`, `serving_mode`
  and `retention` the published schema requires of it. The invalid half is that payload with the
  `geo` of `proposal-issued.yaml`, whole, added beside them: one addition, and a shipped value.


  `proposal-issued.yaml`'s first line item is `agreed`, so it has left `draft`, and it offers two
  format ids with a `format_specs` entry for each. The valid half is that line item trimmed to the
  keys it requires plus its `formats` and `format_specs`. The invalid half is that payload with
  the `display/970x250` entry removed from `format_specs`, which leaves an offered id with no
  entry: one removal, no value invented.


  That same line item carries `accepted_exclusions.types` for `domains` and `keywords` and
  supplies exactly those two. The valid half is it trimmed to the keys it requires plus those two
  fields. The invalid half is that payload with the `categories` list of § 5.5's own exclusions
  block added to `exclusions`, a type the seller's `accepted_exclusions.types` does not name: one
  addition, and the value the document writes.


  WHAT THIS COSTS, counted rather than described: a rule conditioned on `serving_mode` is one the
  four part-payloads of § 5.5 cannot decide, because none of them writes that member, so each
  leaves it undecided under `D-135`, as it does for the three sibling bullets already. The other
  two rules read fields those blocks either write or leave out entirely, so they add nothing.
feedback: >-
  § 5.4's condition is the proposal's `status` and its requirement is the line item's two fields,
  so a shared line item (§ 4.3) carries the requirement and not what triggers it. Saying the
  requirement on the line item alone -- that an offered format id has a `format_specs` entry once
  the line item itself has left `draft` -- would let a receiver check what it holds. § 5.5's
  states the rule of the buyer's write in the seller's voice; saying it of the field, as the
  `exclusions` row's own type already does, would put it where a validator reads it.
