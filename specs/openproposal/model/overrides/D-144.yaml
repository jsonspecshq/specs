question: >-
  Three more statements of § 5 constrain a line item's own fields: what an `embedded` line item
  must leave absent, what every offered format id must have once the proposal leaves `draft`, and
  what exclusion types a buyer may supply. Is each a rule the line item's payload decides, and can
  each pair be derived from a payload the specification ships?
