format: 2
id: D-125
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  `ExclusionList` is "an array of entries, or a `DocumentRef`", and an entry's form comes from
  the Entry cell of an exclusion type's row. What type does the model publish for it, and what
  types the four Entry rows?
