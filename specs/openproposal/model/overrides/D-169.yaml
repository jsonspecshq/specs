question: >-
  Four statements of §§ 5.6.5 and 5.7.1 are rules one payload decides, and no payload this
  specification ships makes any of their conditions true: a `CPP` entry, a `CPA` entry, a
  `delta_flat` charge in effect under a spend commitment, and a `shortfall_remedy` offering
  `none`. Where do a pair's values come from when the examples have none?
