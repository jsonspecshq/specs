options:
- id: the-condition-is-built-from-the-rows-that-state-it
  summary: >-
    Each is a rule of the object whose payload decides it, and its pair is a shipped payload in
    which the condition is made true using the values the rows that state the condition write:
    a term from a table, an example a row gives, a value another row of the same file states. The
    halves then differ by the one value the rule forbids, and every byte of both is one the
    document or an example writes.
- id: left-unclaimed-until-an-example-ships-the-condition
  summary: >-
    A pair's valid half is an example the specification ships, so a rule whose condition no
    example makes true has no pair and stays unclaimed until the working group ships one.
- id: an-obligation-of-the-party-that-writes-the-member
  summary: >-
    Each names a value a seller or a buyer writes, so each is an obligation and needs no pair.
chosen: the-condition-is-built-from-the-rows-that-state-it
rationale: >-
  WHAT THE DERIVED-FIXTURE RULE FORBIDS, AND WHAT IT DOES NOT. It forbids authoring a payload
  "where the source has one": a rule whose condition a shipped example makes true takes its pair
  from that example, and writing a fresh payload beside it would be inventing a second source of
  truth for bytes the specification already states. These four conditions are the other case. No
  example prices a line item at `CPP` or at `CPA`, none puts a `delta_flat` charge in effect, and
  none offers `none` as a remedy -- measured over all 19 line items of the 17 shipped examples, by
  reading every `pricing[].cost_method`, every `deltas` entry against the `included[]` and
  `selected[]` of the field that holds it, and every `shortfall_remedy`. So there is no payload to
  take and no payload to displace, and the question is only where each value comes from.


  EVERY VALUE COMES FROM A ROW THAT STATES IT, WHICH IS WHAT MAKES THE PAIR DERIVED. `CPP` and
  `CPA` are two of the ten core terms § 5.6.5's table lists. The members each requires are the ones
  its own rows require, filled from those rows' own words: `demographic` takes
  `ratings.example:adults_25_54`, which its row writes as its example; `action_type` takes
  `purchase`, which its row names from IAB Tech Lab ECAPI 1.0's event types; `attribution_window`
  takes `P30D`, the duration § 5.7.1's `final_after` row writes as its own example; and
  `rating_source` and `action_source` take `seller`, which § 2.2 states is what a seller writes as
  a `Measurer`. `none` is one of the three core terms the `shortfall_remedy` row lists. The
  `delta_flat` charge is `line-item-audio.yaml`'s own `production` field, grafted whole into
  `line-item-dooh.yaml`'s line item, which is the one shipped line item that commits spend; the
  amount the charge exceeds is `10000.00`, which `line-item-rewarded-video.yaml` writes as its
  `commitment_bounds.spend.min`.


  SO EACH PAIR TURNS ON ONE VALUE, AND THAT VALUE IS SHIPPED. For the two `counted_by` rules the
  halves differ only in `counted_by`: `seller`, which equals the entry's `rating_source` or
  `action_source` byte for byte as § 2.2 requires, against `audience-vendor.example`, which the
  same file writes for that very member. For `none` the halves differ by which terms `included[]`
  names, out of an `available[]` the shipped field states plus the row's own third term. For the
  `delta_flat` bound the halves differ only in `commitment.amount`, and both numbers are shipped.


  `left-unclaimed-until-an-example-ships-the-condition` is the reading this record replaces, and it
  was this branch's own: it treats "no example makes the condition true" as the end of the matter,
  which leaves four requirements of the specification carried by nothing while the document states
  them plainly. An element nothing reaches is the absence of a reading, and the absence is what a
  consumer inherits: a validator built from these artifacts would accept a `CPP` line item counted
  by anyone.


  `an-obligation-of-the-party-that-writes-the-member` is refused by what each sentence reads. An
  obligation asks something of a party's behaviour that no payload records (`D-087`). These four
  compare two values of one payload: a `counted_by` against a `cost_parameters` member of the
  committed entry, a sum of charges against an amount, and the terms of one selectable field's
  `included[]`. Each is decided by reading the payload and nothing else.


  THE OWNERS, each the smallest object the model names that holds what its sentence reads.
  `LineItem` for the two `counted_by` rules, which read the committed `pricing[]` entry and an
  option of `controlling_measurement`; `LineItem` for the `delta_flat` bound, which reads the
  commitment and the `deltas` of every selectable field; and `ShortfallRemedy` for the `none` rule,
  whose `available[]`, `included[]` and `selected[]` are its own.


  WHAT THIS COSTS, stated rather than hidden. The valid half of each of the first three is not a
  payload a reader will find in `examples/`, so a reader checking the vectors against the shipped
  files finds the condition nowhere and the record is the only account of where the bytes came
  from. That is the cost of carrying a requirement whose case the specification states and does not
  illustrate, and the feedback below asks for the examples that would remove it.
feedback: >-
  § 5.6.5 defines `CPP` and `CPA` with the `cost_parameters` each requires, § 5.6.5 bounds the
  `delta_flat` charges a spend commitment carries, and § 5.7.1 defines a `none` remedy that makes
  committed levels targets -- and § 6's examples illustrate none of the four. A reader who wants to
  see what a rating-point line item looks like, or what a seller writes when it offers no remedy,
  has only the prose. One example priced at `CPP` with its `rating_source`, one at `CPA`, one with
  a `delta_flat` charge in effect under a spend commitment, and one offering `none` would make four
  requirements checkable against the specification's own bytes rather than against a reading of its
  rows.
