question: >-
  Two statements of § 5 forbid a change rather than a value: a revision may not reuse a
  `pricing_id` for a different `cost_method`, `cost_parameters`, `currency` or
  `transaction_mechanisms[]`, and a request may not change a tuple's `direction`. No single
  payload decides either. Does the vectors format carry them, and which object's two versions
  decide each?
