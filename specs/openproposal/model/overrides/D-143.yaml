options:
  - id: any-the-field-offers
    summary: >-
      An indefinite subject denotes any entry the field offers, so the
      condition holds where the list holds one such entry, and "has" asserts
      the key is present and the array holds an entry.
  - id: the-one-in-effect
    summary: >-
      An indefinite subject denotes the entry in effect, so the condition holds
      only of the option `selected[]` or `included[]` puts in effect.
chosen: any-the-field-offers
rationale: >-
  **The document has a phrase for the one in effect, defines it, and uses it of this very field.**
  § 3.1 states it: "`selected[]` is the complete set in effect and replaces `included[]`. With no
  `selected[]`, `included[]` is in effect." And § 1.1's mapping table writes it of the
  `transaction_mechanism` the `sov_basis` condition reads — "`1` when the mechanism **in effect** is
  `programmatic_guaranteed`, `0` otherwise". So when this specification means the entry in effect it
  says so, about this field, in those words. § 5.9's `sov_basis` row says "an option's
  `delivery_type`" and not "the option in effect", and the difference between the two spellings is
  the document's own.


  **§ 5.9 gives the reason the requirement binds on the offer and not on the choice.**
  "`share_of_voice`: the seller reserves a fixed share of the inventory, up to all of it, for the
  flight", and `sov_basis` is the only statement of what that share is a share of — impressions, or
  each named screen's loop time. A seller that offers `share_of_voice` among its options and states
  no `sov_basis` has offered a share of nothing, and the buyer is asked to select it without being
  told what it is. The requirement is on what the seller publishes, which is before any `selected[]`
  exists, so the entry it reads is any the field offers.


  **And `the-one-in-effect` cannot be stated by a keyword at all.** `selected[]` and `included[]`
  hold option ids and `available[]` holds the options, so finding the option in effect is a join from
  an id to an entry, which JSON Schema states nowhere. Under that reading the condition returns to
  the rules output, which is where it was, so the reading is not only unsupported by the text but
  would undo what stating it buys.


  **"Has" asserts an entry, not a key.** § 5.6.4's row says what `partial_play_credit` is for: "What
  a display on fewer than `min_screens_per_play` screens counts", and `min_screens_per_play` is a
  REQUIRED member of a `SyncGroup` — one per group. A property whose `sync_groups[]` holds no group
  has no `min_screens_per_play` anywhere, so a `partial_play_credit` stated of it would say what a
  display on fewer than nothing counts, which says nothing. So the condition fires where the array
  holds an entry, and the schema states that floor as `minItems: 1` beside the member's presence.


  **§ 5.2.8 states no other floor**, and the document's own idiom confirms the reading is not about
  the array's validity: where it requires an array to be non-empty it says so, at
  `AssentEntry.line_item_ids[]` — "MUST be non-empty" — and at § 5.6.7's `fees[]`. `sync_groups[]` is
  "Array[SyncGroup] | OPTIONAL" with no such clause, so an empty array is a valid value of the row
  and simply carries no group for the condition to read. The floor is the condition's and not the
  row's, which is why it is stated in the `if` and not in the array's own schema.
evidence:
- '§ 1.1 writes "the mechanism in effect" of the `transaction_mechanism` this condition reads, so the
  phrase for the one in effect exists and is used of this field'
- '"MUST be non-empty" occurs twice in the pinned text, at `AssentEntry.line_item_ids[]` and § 5.6.7''s
  `fees[]`, and at neither `sync_groups[]` nor any row this record reads'
challenge:
- type: LineItem
  value:
    line_item_id: business-daily-display
    status: published
    channel: display
    visibility: public
    transaction_mechanism:
      available:
      - id: programmatic_guaranteed
        delivery_type: share_of_voice
      included: [ programmatic_guaranteed ]
    pricing:
    - pricing_id: entry-one
      cost_method: CPM
      currency: USD
      list_rate: 12000
  verdict: reject
  context: >-
    A line item offering one option at `share_of_voice` and stating no
    `sov_basis`, which is a share of nothing.
  reason: >-
    The option the field offers carries `delivery_type: share_of_voice`, so the
    condition holds and `sov_basis` is required. `the-one-in-effect`, the
    option not taken, would accept this wherever the option is offered and not
    selected, which is every published proposal before a buyer answers.
- type: LineItem
  value:
    line_item_id: business-daily-display
    status: published
    channel: display
    visibility: public
    sov_basis: impressions
    sov_share: 0.25
    transaction_mechanism:
      available:
      - id: programmatic_guaranteed
        delivery_type: share_of_voice
      included: [ programmatic_guaranteed ]
    pricing:
    - pricing_id: entry-one
      cost_method: CPM
      currency: USD
      list_rate: 12000
  verdict: accept
  context: >-
    The same line item stating what the share is a share of, with the share
    § 5.9's own `sov_share` row then asks for.
  reason: >-
    The condition holds of the offered option and the member it requires is
    there, so the pair turns on that one value: a `share_of_voice` offer with
    `sov_basis` is accepted and the same offer without it is not.
feedback: >-
  § 5.9's `sov_basis` row reads "REQUIRED when an option's `delivery_type` is `share_of_voice`", and
  § 3.1 defines "in effect" for the entry a buyer puts in effect. Saying "when an option the field
  offers has `delivery_type` `share_of_voice`" would put the quantifier on the page, where a reader
  now takes it from the article against § 3.1's definition. § 5.6.4's `partial_play_credit` row reads
  "REQUIRED when a property has `sync_groups[]`"; saying "has at least one `sync_groups[]` entry"
  would state the floor the row's own purpose implies, since `min_screens_per_play` lives on a group
  and a property with no group has none.
