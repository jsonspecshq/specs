id: D-143
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  A Required cell whose subject is indefinite — "when an option's
  `delivery_type` is `share_of_voice`", "when a property has `sync_groups[]`" —
  denotes which of the things its list holds, and what does "has" assert of an
  array?
