options:
- id: the-cell-says-open
  summary: >-
    A row whose Type cell names `VocabularyTerm` holds an open vocabulary -- the listed values are
    its core terms and an extension term is one outside them. A row whose cell names `Enum`, or states
    the values as the whole type, holds a closed one.
- id: the-list-says-closed
  summary: A row that lists its values holds a closed vocabulary whatever its cell names, as D-065 read
    them, so a value outside the list is refused.
chosen: the-cell-says-open
rationale: 'Section 2.2 states what a `VocabularyTerm` is -- "String: a bare core term, or `<domain>:<term>`
  with `<domain>` a `Domain` the definer controls" -- and states in the same section that "Anyone MAY define
  an extension term". A row whose cell names that type therefore admits a term the specification does
  not list, and twenty rows name it while listing their core terms in their own prose.


  D-065 read those lists and declared twenty vocabularies closed. While each row was published at the
  bare term grammar the reading cost nothing, because no row referenced the vocabulary: the published
  type admitted every term of every vocabulary and listed none. Once a row resolves to the vocabulary
  its own prose lists, the closed form is what it publishes, and a closed enum of two refuses every
  extension term the cell admits. That is narrower than the document, which is the one direction a
  published type may not be, and it is this record''s departure to name.


  The rows say so themselves, over and over, in the clause that follows the list. A `match_method` is
  "How its members match users. Core terms: `hashed_email` | `device_id`. A receiver that doesn''t know
  a term reads the method as unstated." An `agreement_type` has "Core terms: `upfront` | `annual` |
  `master_services`. A receiver that doesn''t know the term still reads the `agreement`." A
  `disclosure_method` is one of four and "A receiver that doesn''t know a term reads that method as
  unstated." Each tells a receiver what to do with a term it does not know, which is a statement that
  would mean nothing if an unknown term made the document invalid. That is the same evidence D-081 read
  for section 2.4''s error codes, and this record is that reading taken over every row of the same shape
  rather than one.


  **The cell is the discriminator and not the list.** `Retry` stays closed, because section 2.4''s `retry`
  cell names `Enum` and its three values are the whole of the type: "`same` | `refetch` | `none`" with
  no extension half and no receiver clause. So does `EpisodeSelection`, and so does every vocabulary a
  row states as its own alternation. `the-list-says-closed` cannot tell the two apart, because both kinds
  of row list their values; only the cell says whether the list is the type or the core of it.


  Twenty declarations gain `open: true` and cite this record beside the one that read their terms. No term
  moves and no name moves: the core half of each is the list D-065 read, and the extension half is the
  kernel''s `NamespacedTerm`, which is what `VocabularyTerm` already means.'
challenge:
- type: Metric
  value: examplepub.example:attention_seconds
  verdict: accept
  context: >-
    A seller that commits to a metric this version lists no term for, named in
    its own domain.
  reason: >-
    `the-cell-says-open` publishes the vocabulary as the row's cell states it,
    a `VocabularyTerm`, whose extension half is a term in the definer's
    domain, and section 2.2 states that anyone may define one.
- type: Metric
  value: attention_seconds
  verdict: reject
  context: >-
    The same seller writing its own metric as a bare word rather than in its
    domain.
  reason: >-
    `the-list-says-closed`, the option this record refuses, refuses both of
    these values; open refuses only this one. An extension term carries the
    domain of the party that defines it, so a bare word outside the listed
    terms is neither a core term nor an extension one -- which is what makes
    open a wider type and not an unchecked one.
