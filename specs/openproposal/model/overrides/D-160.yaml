format: 2
id: D-160
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 5.7.1's `counted_by` clause turns on "the source of the line item's
  `delivery_counting.impression_multiplier`", and § 5.6.4 names that source `seller` where
  `source_type` is Publisher Provided (`2`) or the `vendor` is the proposal's `seller.domain`, and
  the `vendor` otherwise. A line item carries no proposal. The multiplier now also states the
  standing of its source in the market. Does `accreditation` decide which of the two sources a
  line item states?
covers:
- ir: key:5.6.4:ImpressionMultiplier.accreditation
