- ir: field:5.6:renewal_right
  digest: 48cf3d5378abf2c639e318431e2e929dc54b0cf7110d14a958166cf6bb6eff52
  quote: "`renewal_right` | VocabularyTerm | seller-set | The current advertiser's right to the next cycle. Core term: `first_refusal`, the right to buy the next cycle before it opens up. Absent: no such right. It is not a place in a hold queue (`hold.position`)"
- ir: key:5.4:CreativeDelivery.other_protocols[]
  digest: e056eb0c6535a4c59aae2838b7ce0b9a7677e8c93f83a4a83d3d6b095969134f
  quote: "`other_protocols[]` | OPTIONAL | How a creative that list has no code for is delivered. Core term: `javascript_tag`, a tag whose script renders the ad. A receiver that doesn't know a term treats only that term as unavailable"
- ir: key:5.6.5:CostParameters.viewability_standard
  digest: d213f91f3a635104e410c38f8b7a3a30e570fc1ba329d6b54df2766a43926bcc
  quote: "`viewability_standard` | REQUIRED when `cost_method` is `CPMV` | The viewability standard that counts a unit. Core term: `mrc`, the MRC guidelines that `viewable_rate` cites (§ 5.7.1)"
