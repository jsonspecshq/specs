format: 2
id: D-140
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  Seven rows type their values at the bare term grammar and state what those values are
  in a form no value list carries: five name one core term, and two say this version lists
  none. The published type lists nothing any of them states. What is each list called?
