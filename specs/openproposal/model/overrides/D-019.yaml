    See `remedy_terms` in § 5.7.1. Nothing in effect: this line item states no remedy. Its committed levels
    stay guaranteed, because only `none` makes them targets'
options:
- id: as-listed
  summary: '- A format ID is written `<channel>/<format>`, as the row namespaces it by channel, with neither
    part empty.

    - Geo codes and device categories are codes that other lists define, carried as written. Each field''s
    description names its list.

    - A daypart option is a time window `{ days[], start, end }`, as Google Ad Manager writes a day part.

    - Cancellation rights and exclusivity terms are open objects.

    - `production`''s inline object is its option.

    - `shortfall_remedy` takes its listed remedies.'
- id: ids
  summary: Format IDs, geo codes, and device categories are opaque IDs, and daypart time windows are open
    objects.
- id: open-options
  summary: Every such option is an open object.
chosen: as-listed
rationale: '`Selectable` and `Settable` can''t be copied without their option type. The row states a format
  ID''s form: "registry format ids namespaced by channel", written `display/300x250` and `audio/host-read-30s`.
  A namespace is a prefix, so a format ID holds a channel and a format, joined by the `/` the row writes,
  and `300x250` alone isn''t one. That constraint comes from the row''s text, not from the example files,
  and it validates differently from any other ID, so a format ID is a `FormatId`, with the pattern `<channel>/<format>`.
  The text says nothing about what each part holds, so the schema takes the least it can: neither part
  is empty or holds a `/`, a space, or a control character. Every format ID the text or an example writes
  has that form: `available[]`, a property''s `supported_formats`, and an asset''s `format_ref`. Geo codes
  and device categories are codes from lists that other systems keep, and a receiver compares each as
  written, the way it compares any ID another system defines, so each is an `ExternalId`, and the field''s
  description says which list it comes from. They come from lists the specification doesn''t name: the
  examples write ISO 3166-1 alpha-3 codes and ISO 3166-2 codes for `geo`, so no one code list fits, and
  the text states no form for either. A geo bound and a device bound are then copies of one application,
  `Settable<ExternalId>`, each named after its field. A daypart option is a time window, which follows
  the ad server convention (D-096). Cancellation rights and exclusivity terms have no members anywhere
  in the specification, so each is an open object (D-106), named as type rules § 7 names an option: `CancellationPolicyOption`
  and `ExclusivityOption`. `production`''s object `{ custom_unit, build_owner, lead_time, cost }` follows
  "`available[]` of build options", so it is the option, named `ProductionOption`. `shortfall_remedy`
  takes `makegood`, `credit`, and `none`; the prose adds `remedy_terms` beside them, which has no type
  and no place in the selectable structure, so the model leaves it out.'
evidence:
- examples/line-item-display.yaml (geo)
- examples/line-item-audio.yaml (geo and production)
feedback: 'Give each selectable and settable field its option type:

  - The `formats` row namespaces a format ID by channel, as `display/300x250`. State that grammar as `<channel>/<format>`,
  and say what a channel and a format may hold. Then `300x250` alone is rejected everywhere a format ID
  appears: `formats`, a property''s `supported_formats`, and an asset''s `format_ref`.

  - Name the code lists for `geo` and `device`, and define a cancellation right and an exclusivity term.

  - Say where `remedy_terms` goes and what it holds.'
