options:
- id: table-is-the-list
  summary: Section 2.2 is the specification's list of the value types it states. A kernel primitive the
    table names is the same type, sourced at that row. A kernel primitive the table does not name, and
    no row of the text carries, is absent here.
- id: publish-all
  summary: Every kernel primitive stays published, sourced at whichever row comes closest.
- id: spec-defines-its-own
  summary: The specification's own types are declared from section 2.2 and no kernel primitive is reused,
    so each specification states its value types independently.
chosen: table-is-the-list
rationale: 'Section 2.2 states what each of its types accepts, in the specification''s own words, so it
  is the text''s answer to which value types the specification has. `publish-all` would publish a primitive
  this text never mentions and source it at a row that carries something else, which states a claim the
  text does not make. `spec-defines-its-own` would define a type the kernel already defines, under a second
  name, which is the redundancy a shared kernel exists to remove: one concept would have two names and
  a library would offer both.


  So a primitive section 2.2 names is sourced at its row, and `VocabularyTerm` is the kernel''s `NamespacedTerm`:
  the table states a bare core term or `<domain>:<term>` with the domain''s owner controlling it, which
  is that primitive and not a type of its own.


  Four primitives the table does not name and no row carries are absent here, with the two constructors
  built on them. Two stay because a row carries each: `ExternalId`, which a proposal''s `proposal_template_id`
  names as an identifier another system minted, and `VendorCode`, which a placement''s `api[]` carries
  by citing AdCOM''s List: API Frameworks, a list open to vendors'' codes from 500 up. `Timestamp` is
  the one worth stating plainly: a point in time in this specification is the `Instant` section 2.2 defines,
  so publishing `Timestamp` beside it would give one concept two spellings inside one specification, and
  a payload would have no single written form.


  `EntryRef` and `Ext` are covered here because they are the two types of the table that are neither a
  kernel primitive nor an alternation, so a reader checking which rows this record disposed of finds them
  named rather than missing.


  Five rows of the table are read by a record of their own -- `IanaZone` and `ZoneName` by D-055, `Instant`
  by D-057, `RegistrableDomain` by D-058, `FieldPointer` by D-060 and `FractionDelta` by D-061 -- so this
  record does not cover them: one cover quotes one element once, and the record that reads a row is the
  one that owns it.'
