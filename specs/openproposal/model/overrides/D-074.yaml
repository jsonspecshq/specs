options:
- id: a-subset-states-no-type
  summary: A sentence naming some of a vocabulary's terms states no type of its own. The vocabulary already
    defines the terms, and the sentence states when they apply, which is a rule about the sentence rather
    than a type about the list.
- id: each-subset-is-a-type
  summary: Each subset is a vocabulary of its own, so a hold that may be released carries a different
    type from a hold that may be held.
chosen: a-subset-states-no-type
rationale: 'Five sentences name some of the terms a vocabulary already defines: two name the proposal
  statuses a line item may be published under, one adds `sold_out` to them, and two name the hold states
  a hold ends in and rests in. Each is a sentence about when those terms apply, not about what a value
  is.


  `each-subset-is-a-type` would publish a type per sentence, so one member would carry several types according
  to which sentence a reader had in mind, and a library would offer `HoldStatus` beside two narrower copies
  of it with no member taking either. Type rules section 5 holds a named type to one definition, and a
  subset is not a definition.


  So each of the five restates terms the vocabulary carries, and what the sentence requires belongs to
  the statement that holds it.


  One further sentence does state a list of its own, and it is named for what its values are.
  `ChargeableUnit` is what a cost method charges per -- impressions, viewable impressions, clicks,
  completed views, views, rating points, actions, plays, hours, days or weeks -- which no other list
  of this specification holds.


  § 5.3''s `any` | `all` is not such a sentence. The specification names that type itself, in the
  lead-in "**`CombineOperator`** is `any` | `all`." (§ 5.3), so the sentence restates a vocabulary the
  text already defines, as the five above do, and a name of this repository''s own would be a second
  name for one list.'
