- ir: rule:5.9:01b1b76d
  digest: d48ca108f96d5e2be948893a78afb9695911088a512987932f6802b25b5b74e3
  quote: "`transaction_mechanism.available[]` MUST hold only the `direct_io` option."
- ir: rule:5.6.2:3c2ac6dd
