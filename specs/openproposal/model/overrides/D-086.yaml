options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it, as D-082 through D-085 read the other
    modules. Twenty-seven are read here and the nine a payload decides are named and left.
- id: all-thirty-six-now
  summary: Every statement is read in one record, with nine change pairs written in the same step.
chosen: by-what-decides-it
rationale: 'Twenty-two of the twenty-seven are duties, four carry nothing a check reads, and one is a
  rule a payload decides. What the duties bind splits by section.


  **Ten bind the seller or a consumer over inventory.** The seller serves the line item only into
  impressions that match a key that is present, and only into impressions that match an option in effect,
  for a placement as for a programme; it declares `slotinpod` 1, 2 or -1 only where it can guarantee that
  slot; each `seller_accounts[]` entry is a record in the governing file, and no
  relationship is stated that the file does not support; and over OpenRTB 2.6 the matched programme
  option''s `content` values are sent under that standard''s key names. Where a property''s app store bars
  behavioural advertising, the line item carries no `audiences` and both buyer-supplied flags are false
  -- a duty and not a rule, because which store bars it is the store''s policy and not a value in the
  document. A buyer names or excludes no individual screen under `seller_allocated`. And a consumer that
  checks a seller account uses section 5.2.6''s table and confirms sellers.json at `asi` lists `sid`.


  **Eight bind an implementation that inspects a creative, and they are the most emphatic in the
  specification.** An inspection sends no production notification and requests no destination or redirect
  that would; it may retrieve creative documents, follow wrappers and inspect referenced media; a preview
  that executes creative or verification code prevents that code from notifying production; synthetic
  events go to test endpoints or through a documented test mode; a preview served through server-side ad
  insertion uses a session the insertion service sends no production notifications in, and where it
  cannot provide one the creative is inspected outside the stitched stream; failures are reported through
  diagnostics without firing a production error or verification URL; and no check that was skipped or
  could not finish is reported as passed. Every one is about an act with an effect outside the document,
  which is what makes them duties rather than rules.


  **Re-read against the re-pinned lock, and the reading is unchanged.** § 5.4.1 gained one paragraph --
  the server-side ad insertion one, whose two sentences this record now covers -- and that paragraph sits
  above the two statements about reporting, so their host block moved from the sixth of the section to
  the seventh and their digests moved with it. Their own bytes are identical to the byte: "Inspection
  failures MUST be reported through diagnostics, without firing a production VAST `<Error>` or
  `verificationNotExecuted` URL" and "An implementation MUST NOT report a check that was skipped or could
  not finish as passed" are what they were. The two new sentences are the same kind as the seven already
  read here: each binds the implementation doing the inspecting, and whether an insertion service sent a
  notification is an act outside the document, so no payload decides it.


  **Four more bind a party.** A seller''s `spec` equals the content of the version its `spec_ref` names,
  which is a document elsewhere. A makegood does not run past `commitment.flight.end` without the buyer''s
  consent, which the seller may offer upfront in `remedy_terms`; the buyer may refuse a makegood; and an
  agent presents a target as a target where `none` is the remedy in effect.


  **One is a rule a payload decides: section 5.2.1''s.** "Each `environments.available[]` value MUST
  match at least one impression to which 5.1.1 gives the line item''s `channel`" has a value of the
  document as its subject and constrains what the document may say, not what the seller may do. Both
  operands are `LineItem` properties, `channel` and `environments.available[]`, and both tables that
  decide the question are in the text: section 5.1.1 gives each channel its condition over an
  impression''s distribution channel, media and device type, and reads an impression''s channel as the
  first row it matches; section 5.2.1 gives each environment its (distribution channel, device type)
  pairs. Crossing the two is arithmetic over the two tables, so one payload decides it. The
  predecessor holds the working check, and that check is the port, keyed to this id, which the
  statement text still matches byte for byte.


  The duty that reads like it is a different sentence, in a different section: section 5.1.1''s "The
  seller MUST serve a line item only on impressions of its `channel`", `rule:5.1.1:4c696214`, which is
  mapped `role: obligation, party: seller`. One binds the act of serving and the other binds what the
  document may claim, and reading the second as the first is what this record did before. The check
  now runs on all ten shipped examples and finds no violation in any of them, which is the evidence
  that the reading is decidable and that the examples agree with it.


  What it costs until the reading is complete: `rules-emit` reports that the rule has no change pair.
  A pair''s valid half is a shipped example''s own bytes, and every example line item carries
  `environments`, a key the model publishes nowhere, so the schema refuses the payload for a reason no
  record answers. That row is one of the example contradictions, and correcting the reading is
  what answers it. The gate naming the missing pair is the gate doing its work, and it names the
  one thing that blocks it.


  **Four carry nothing a check reads.** Two are the `requestable` marker''s words -- a buyer may request
  a later materials date, and a stricter committed level one further in `direction` -- which
  `marker:3:requestable` grades with a change pair, the reading D-083 made of section 3''s four. The other
  two name keys an open object may hold: a format `spec` MAY hold `asset`, and MAY hold `voice`. The object
  is open and the specification defines no property for either, so the sentence says what a key means
  rather than what a value must be.


  **Nine are rules a payload decides, and they are not read here.** A line item whose
  `environments.available[]` reaches an app or a CTV environment and whose `committed_metrics[]` includes
  `viewable_rate` offers no seller-measured `measurement_source` option unless `api[]` includes OMID 1.0
  (§ 5.2.2); a line item with a `directed` property carries no `audiences` and sets both buyer-supplied
  flags false (§ 5.2.7); a tentative programme option is not in `included[]` and its delta is `delta_flat`
  (§ 5.2.9); every id in `formats.available[]` has a `format_specs` entry once the proposal leaves `draft`
  (§ 5.4); a request does not change a committed tuple''s `direction` and `included[]` names exactly one
  option (§ 5.7); `counted_by` is the impression multiplier''s source on a `dooh` line item that counts
  impressions, and the committed entry''s `cost_parameters.rating_source` under `CPP` (§ 5.7.1); and
  `none`, where it is in effect, is the only remedy option (§ 5.7.1). Three of the nine are
  SHOULD-level, which the rules output carries at a lower severity rather than as an error, and that is
  the one thing the pair has to get right: a vector that fails a SHOULD is a warning and not a refusal.'
