options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it, as D-082 through D-086 read the other
    modules. Twenty are read here and the eleven a payload decides are named and left.
- id: all-thirty-one-now
  summary: Every statement is read in one record, with eleven change pairs written in the same step.
chosen: by-what-decides-it
rationale: 'Nineteen of the twenty are duties and one carries nothing a check reads, which makes these
  eight modules the opposite of section 5.9''s: every sentence here is about an act, and five of section
  5.9''s six are about a value.


  **Five bind the seller over publication.** It may publish a `ProposalManifest` at
  `https://<seller.domain>/.well-known/openproposal.json`; at least one of `ETag` and `Last-Modified`
  is required so buyers can poll cheaply, which is a header of the response and not a field of the document;
  manifest entries match the current version of each proposal; a seller that limits concurrent holds
  declares the limit in `hold_limits`; and one that declares `per_advertiser` may decline a hold request
  naming no advertiser.


  **Four bind the seller over exclusions.** It rejects an entry whose `store` it does not know with
  `validation` rather than applying it across stores; it rejects an unaccepted exclusion type
  deterministically with `not_offered` rather than ignoring it; it presents `best_effort` enforcement as
  what it is and not as a guarantee; and it discloses a buyer''s exclusion lists to nobody but that buyer
  and the systems that enforce or verify them for the line item. The last is the only confidentiality
  duty in the specification.


  **Three are recomputations and one is delivery.** `addressable_scale` and `availability` are recomputed
  against the buyer''s actual selection, values and exclusions, and against the `break_position` and
  `programs` options in effect, and against the audience conditions of section 5.3. The seller serves a
  line item only on impressions of its `channel`. A recomputation is an act on figures the seller asserts,
  so no payload shows it undone: two documents with different figures are both valid.


  **Two bind a consumer, and they are the pair that makes a credential type safe to add.** A consumer that
  does not know a `credential_type` does not treat the proposal or line item as invalid for that reason,
  and treats that entry as unsatisfiable. Without the second the first would make an unknown credential
  a thing to ignore rather than a thing to fail on.


  **Two bind the seller over representation and one over settlement.** A full fetch returns the full
  representation, except for line items and packages the requester may not read; a manifest entry holds
  the summary and a response over the message binding may carry it; and once the deal exists in
  `deal_origin` the seller records its id as one `deal` entry on the line item.


  **One carries nothing a check reads.** "An entry is not a term and MAY be added after `agreed`" is an
  external reference, and both halves are stated where they are graded: section 4.1.3 lists
  `external_references[]` among the fields that are not offered terms, and `marker:3:recorded` holds the
  rule that an entry is appended and never edited.


  **Eleven are rules a payload decides, and they are not read here.** A line item declares `geo` or
  `markets` and not both, and a buyer supplies no exclusion type absent from `accepted_exclusions.types`
  (§ 5.5); a mechanism option''s `delivery_type` is one its row allows, `episodes` where present is `new`,
  `geo`, `markets`, `device` and `frequency_cap` are absent, `time_zone` is not `viewer_local` because
  `daypart` bounds air time, and `transaction_mechanism.available[]` holds only `direct_io` -- five of
  section 5.9''s six; a section 3.3 summary''s `line_item_id` is required; `buyer.domain` is in
  `eligible_buyers[]` or `buyer_requirements.seats` names a seat in an `eligible_seats[]` entry for its
  `dsp`, and that `dsp` is in `allowed_dsps[]` (§ 5.8); and an audience `included[]` names exactly one
  option (§ 5.3).


  Section 5.9''s five are one group and they are the clearest case in the specification for writing the
  pairs together: each is a clause of the same paragraph, each constrains a line item that offers one
  mechanism, and one payload shape serves all five.'
