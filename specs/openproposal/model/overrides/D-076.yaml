question: What is a line item's `channel`, where its lead-in says the type is a vocabulary term whose
  core terms are a table's rows?
covers:
- ir: def:5.1.1:MediaChannel
  digest: f68a85afce8842b9809b82419452751408f6907c1ca8e650919a88a84325ec74
  quote: '`MediaChannel` | is a `VocabularyTerm` (§ 2.2) whose core terms are the rows of this table.
    An impression a row matches has that row''s channel, so an extension term covers only impressions
    no row matches.'
- ir: field:5.1:channel
  digest: f238dcbb62a5413240de2a29f590622682d582f8f8309999fe8b5b7abf5dc8b7
  quote: '`channel` | MediaChannel | immutable | Core terms in § 5.1.1. The discriminator for how the
    rest of the line item is read'
