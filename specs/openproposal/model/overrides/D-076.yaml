  digest: 88a6c85592a38c9d19edb0df59c3e68ee0db38380e3dbdf7aeaced3a035ee092
  quote: '`audio` | Audio ad (`AudioPlacement`)'
- ir: def:5.1.1:channel.ctv
  digest: 97dad39d5f32820b0162f83d2572c56f385a00632e1603638a41c7bfab11bcf3
  quote: '`ctv` | A TV device type'
