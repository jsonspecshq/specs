options:
- id: open-over-the-rows
  summary: '`MediaChannel` is an open vocabulary whose core terms are the six rows of the section 5.1.1
    table, and an extension term covers an impression no row matches.'
- id: closed-over-the-rows
  summary: The six rows are the whole list and a sender may carry nothing else.
- id: a-bare-term
  summary: The member carries a vocabulary term with no core terms stated, so any term is accepted and
    the table is prose.
chosen: open-over-the-rows
rationale: 'The lead-in states both halves: "`MediaChannel` is a `VocabularyTerm` (§ 2.2) whose core terms
  are the rows of this table", and then "an impression a row matches has that row''s channel, so an extension
  term covers only impressions no row matches". So the six rows are the core terms and a term outside
  them is admitted, for an impression none of the six describes.


  `closed-over-the-rows` would refuse the extension term the sentence invites, which is narrower than
  the text in the one direction a published type may not be. `a-bare-term` would accept any term and publish
  none of the six, so a buyer would learn the channels only by reading the specification and a library
  would offer no names at all.


  So the vocabulary is declared at the lead-in that states it, open, with `dooh`, `audio`, `ctv`, `native`,
  `video` and `display` as its terms, each from the row that defines it.'
