format: 2
id: D-134
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  The specification states a message's keys row by row and ships no payload of it. Is a payload
  whose every value is a byte of a shipped payload, assembled into the envelope those rows state,
  a derived fixture or an authored one?
