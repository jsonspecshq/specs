question: >-
  Section 5.6's `availability.unit` states its core terms as "the `unit` terms of § 5.6.5, and
  `slots_per_loop` ... | `unit_periods`", and § 5.6.5's unit terms are the vocabulary `ChargeableUnit`.
  What does the row hold?
