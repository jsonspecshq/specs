    (as the § 5.2.4 key) | `unit_periods` (one unit for one period, such as a board for a 4-week cycle).
    A receiver that doesn't know a term can't compare the figure, and still reads the line item"
- ir: key:5.6:Availability.unit#meaning/values:1
