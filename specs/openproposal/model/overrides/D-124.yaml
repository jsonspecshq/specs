question: >-
  Type rules § 9 makes a requirement no payload can show an obligation on a party.
  `VersionRef.seller_domain` is REQUIRED when the reference is outside its proposal, which the
  reference on its own cannot show and which `context` cannot supply. Is it an obligation?
