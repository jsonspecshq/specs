options:
  - id: rule-paired-at-the-carrier
    summary: >-
      It is a rule. A payload of the object that carries the reference shows the condition, because
      the carrier's own identity decides it, and a vectors entry names that carrier as its `type`.
      Its pair waits on a shipped carrier in which the condition is true.
  - id: obligation-on-a-party
    summary: >-
      It is an obligation. No payload shows it, so it names its party and goes to the obligations
      list, with no schema keyword and no vector.
  - id: presence-stated-by-each-carrier
    summary: >-
      Each carrier's schema requires the member inside the reference it holds, so § 2a's clause 1
      carries it and neither a rule nor an obligation does.
chosen: rule-paired-at-the-carrier
rationale: >-
  **The condition reads what the carrier is, not whether one exists.** § 2.2's lead-in states its
  sense -- a reference inside a proposal resolves against that proposal's `seller`, and one outside
  a proposal carries `seller_domain` -- and § 1.2 makes this specification normative for "what a
  section of this document says a request or response carries, such as ... an `AvailabilityRead`
  (§ 3.3)", so a payload of one is a payload this specification decides. § 3.3's `offer` is a
  REQUIRED `VersionRef`, and § 3.3 says a buyer sends the message to read a line item's figures, so
  an `AvailabilityRead` is not a proposal and every reference it carries is outside its proposal. A
  reader holding that payload decides the requirement from it alone: nothing is keyed by a property,
  and no absence has to be supplied. § 4.1's `issued_from` and § 4.4's `baseline` show the condition
  false, both sitting inside a proposal. So payloads show it on both sides and § 9's test does not
  reach the row.


  What `D-120` observed is true of a different vector. A vector whose value is the reference cannot
  carry its carrier, because § 9 keys `context` by "the property that holds it elsewhere" and no
  property holds which object carries a reference. The step that does not follow is from there to
  "no payload can show it", because a vector's value need not be the member's own object.


  **The mechanism the pair needs already exists, and this repository already rests on it twice.**
  `src/rules.ts` reads a vectors entry's type as `v.type ?? r.owner`, so the entry names the type
  its payloads are instances of and the rule's owner need not be it. § 4.1's two "`legal_name` is
  REQUIRED here" statements are requirements on a member of `Party`, a referenced type whose own
  object cannot show them, and `D-088` maps both as `{role: rule, object: Proposal}` with vectors at
  `type: Proposal`: the carrier is the payload. Measured over the eight vectors files: 43 entries,
  0 paired at a type other than the rule's owner, and 7 paired with a `context` their own payload
  does not hold, carrying 14 vectors between them. A test that asked the member's own object to show
  the condition would withdraw those 7 pairs and their 14 vectors.


  So the pair wants a vectors entry whose `type` is the carrier, and nothing in the mapping has to
  change: the rule's owner stays `VersionRef`, which `presence-statement` derives. The rule's check
  leaves a bare `VersionRef` undecided, which is what § 11 asks of a check that turns on what a
  payload leaves out, and the alternative was measured: a check reading an absent carrier as
  "outside" reports all four shipped references as breaking the rule, taking `examples-validate`
  from 41 to 45 (`D-119` carries that figure).


  **An obligation would publish the requirement nowhere.** `RulesDoc` holds `format`, `input`,
  `rules` and `expressed`, and no obligations list, so `rules.json` carries no obligation.
  `model.obligations` reaches two places and neither is an artifact a consumer installs: a count in
  a gate's note, and a count and a comparison line in `src/compare.ts`. The site publishes a count
  and no statement -- `site/data/dealsapi/spec.json` holds `obligations` under `counts` and holds no
  obligations list. So moving the role takes the requirement out of the schema's keywords, out of
  the rules output and out of the conformance vectors, and puts it in no published byte. The report
  would stop too rather than fail, because `src/rules.ts` passes a condition the schema leaves where
  an obligation is stated in its row.


  **And the party cannot be named.** § 9 asks each obligation to name one of `seller`, `buyer`,
  `consumer` or `implementation`. Two carriers hold a reference outside its proposal and different
  parties write them: § 3.3 gives the `AvailabilityRead` to the buyer, and § 1.1's `ext.baseline`
  sits on a Deals API `Deal` that the system named by `deal_origin` pushes, which § 5.9 gives as
  "the advertising system domain whose namespace holds the deal ID and that pushes the deal:
  typically an SSP, or the ad server for a deal it books itself" -- none of § 9's four parties. An
  obligation naming the buyer would state the requirement for one carrier and deny it for the other,
  which is narrower than what § 2.2's row states.


  `presence-stated-by-each-carrier` is refused on the row's subject. A keyword could state one
  carrier's share -- `AvailabilityRead` requiring `seller_domain` inside `offer` -- and that is not
  the rule. § 2.2 states a property of the `VersionRef`, which § 1.1's `ext.baseline` row states of
  a Deals API `Deal` as well, so a schema stating only `AvailabilityRead`'s share would publish the
  requirement for the one carrier this specification defines and leave every other carrier's reader
  nothing. The rule carries it once, for every carrier.
feedback: >-
  A conditional member has no example in which its condition is true. `VersionRef.seller_domain` is
  REQUIRED "when the `VersionRef` is outside its proposal", and § 3.3's `AvailabilityRead.offer` is
  where that happens, yet none of the thirteen examples holds an `AvailabilityRead` and
  `seller_domain` appears in no payload. Ship an `AvailabilityRead` whose `offer` names a line item
  and a `version` and carries the `seller_domain` of the proposal's seller, beside its REQUIRED
  `flight` (§ 3.3); its invalid counterpart is the same message without the domain. No shipped
  payload can stand in for it, because the four references the source ships are one
  `Proposal.issued_from` and three `ChangeRequest.baseline`, every one inside a proposal, and no
  mutation of a proposal or a change request puts the reference it carries outside itself.


  Separately, the row's condition names no sibling, so a reader of the row alone cannot tell which
  carriers owe the member: § 2.2's lead-in says it in prose and the three carriers sit in three other
  sections. Naming the carriers in the row, or stating the member's presence per carrier, would put
  on the page what a reader now assembles from four places.
