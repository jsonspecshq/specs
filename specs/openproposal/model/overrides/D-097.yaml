options:
- id: the-sibling-s-term-decides
  summary: >-
    Each member's concept is the one its sibling's term names: a commitment's `amount` is money under
    `spend` and a count under `units`, and a committed metric's `level` is a fraction under a rate term,
    a count under the count term, and a measure under any other.
- id: one-concept-each
  summary: >-
    Each member takes one concept for every term, whichever is wider, so a commitment's `amount` is a
    number and a committed metric's `level` is a number.
chosen: the-sibling-s-term-decides
rationale: 'Both rows state the dependence in their own words, and both name the sibling that decides
  it. A commitment''s `amount` is "The figure committed: an `Amount` when `basis` is `spend`, otherwise
  a whole number of the entry''s units (§ 5.6.5)", and `basis` is "`spend` | `units`". A committed metric''s
  `level` is "The offered level: a `Fraction` under a rate term, a count under a count term", and `metric`
  is what is measured, whose core terms § 5.7.1 lists.


  So the concept of each is its sibling''s term''s, which is what a basis states: `spend` gives the amount
  concept and `units` the count. § 5.7.1''s metric table gives each term its Kind, and the Kind is the
  concept: `viewable_rate`, `completion_rate` and `ivt_rate` are Rates and give the fraction,
  `impressions` is a Count and gives the count, and every other term gives the measure. The "any other"
  half is the open vocabulary''s: a term the specification does not list is still a metric, and its level
  is a measure and not a fraction, because nothing bounds it at 1.


  `one-concept-each` publishes a number for both and loses every bound either row states: a commitment
  on a spend basis would accept a negative sum, and a viewable rate would accept 4. The domain model
  exists to hold those, which is why the basis mechanism is in it.


  **The member a basis names is the row''s and not the predecessor''s.** The `Metric` basis named `value`,
  which is what the earlier text called this member, and `domains-properties` reported it in its own
  words: "basis `Metric`: no object holds it beside `value`". § 5.7.1 now writes `level`, so the basis
  names `level`. Both bases also cited `D-036`, a record the restart deleted.'
