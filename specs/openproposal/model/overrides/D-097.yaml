- ir: key:5.7.1:CommittedMetric.metric
  digest: 3ff5f55cf9dd210bdb9a2a1f05b4d2d10d45fcffce624b26a2d22ae1562d9f7c
  quote: '`metric` | REQUIRED | What is measured. Core terms below. A receiver that doesn''t know the
