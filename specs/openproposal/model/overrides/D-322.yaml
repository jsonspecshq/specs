format: 2
id: D-322
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 4.3.2's second rule ends with a sentence nothing reached: a `commit` MUST NOT carry a
  `requestable` ask. A `commit` carries a `Commit`, and an ask is a `HistoryPath` with a
  `requested_value`. Which output carries the requirement -- is it a rule a payload decides, an
  obligation on the buyer, or something the published schema already refuses?
