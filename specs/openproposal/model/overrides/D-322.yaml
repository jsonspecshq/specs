options:
- id: a-statement-the-commit-schema-already-refuses
  summary: >-
    `role: schema, in: Commit`. The published `Commit` is closed over `entry` and `writes`, and
    no object below either admits a `requested_value`, a `pointer` or any key `RequestedValue`
    holds, so a payload carrying an ask is already refused by a keyword and the requirement is
    carried once.
- id: a-rule-of-the-commit-with-its-own-check
  summary: >-
    `role: rule, object: Commit`, with a check that walks a commit for a requestable path and a
    vector pair derived from a shipped commit.
- id: an-obligation-on-the-buyer
  summary: >-
    An obligation on the buyer, since the sentence tells the buyer to send a separate `request`
    instead, and no artifact need carry the prohibition.
chosen: a-statement-the-commit-schema-already-refuses
rationale: >-
  ONE REQUIREMENT IS CARRIED ONCE (type rules § 2a), AND THE KEYWORD ALREADY CARRIES THIS ONE.
  § 3.4 makes `BuyerWrites` "a strict path subset of the line item: a listed path has the type it
  has there, and no other path appears", and the eight paths it lists are the `selected[]` of a
  `selectable` field, the `value` of a `settable` field other than `frequency_cap`, two
  `audiences` paths, `frequency_cap.count.value`, `exclusions`, and two
  `buyer_requirements` members. A `requestable` field is none of those, and `LineItemWrites`
  adds only `commitment`. So the type is closed against the ask before any check runs.


  MEASURED RATHER THAN ASSERTED, at every depth a commit has. `Commit` publishes
  `additionalProperties: false` over `entry` and `writes`. `AssentEntry` publishes it over seven
  keys -- `at`, `ground`, `idempotency_key`, `line_item_ids`, `record_digest`, `role`, `version`
  -- and `LineItemWrites` over twenty-three, of which the deepest commercial one is `commitment`,
  itself closed over `advertisers`, `amount`, `basis`, `derived_units`, `flight` and
  `pricing_id`. `RequestedValue` holds the six keys that are the six `requestable` fields of this
  text -- `commitment_bounds`, `committed_metrics`, `list_rate`, `materials_due`, `retention`,
  `unit_bounds` -- and not one of the six is a property of any object a `Commit` reaches, nor is
  `pointer` or `requested_value`. A payload that states an ask inside a commit is refused by the
  published schema wherever it puts it.


  `a-rule-of-the-commit-with-its-own-check` would put the same requirement in the rules output
  beside the keyword that already states it, which is what `reaches-outputs` reports as two
  artifacts that can disagree. It would also need a vector pair whose invalid half is a payload
  the published schema refuses, and the rule-vectors gate requires the schema of each vector's
  type to accept every payload, so the pair could not be written without loosening the type that
  makes the rule true.


  `an-obligation-on-the-buyer` is refused by the sentence's own grammar. An obligation is the
  role for a statement no payload settles, and one `Commit` settles this: the ask is in the bytes
  or it is not. The clause after the colon -- "`accept` makes no new `version`, so another value
  takes a separate `request`" -- is the reason for the prohibition and not a second requirement;
  § 4.3.1's `request` row already carries the route it points at.


  WHAT THIS COSTS, counted rather than described. No pair is derived for this statement, so no
  payload of the source grades it directly; what grades it is the schema's own keyword, and
  `schemas-ajv` holds that the keyword is published. A reader who wants the prohibition stated as
  a sentence finds it in the document and in this record, and not in the rules output.
feedback: >-
  § 4.3.2 states the prohibition in prose, in a numbered rule about seller revisions, while the
  thing that makes it true is § 3.4's "no other path appears". A reader of § 5.6.1's `Commit`
  table learns neither. Saying in § 3.4 that the listed paths exclude every `requestable` field,
  or in § 5.6.1 that a `Commit` carries writes and no asks, would put the rule where the object
  is defined. The sentence also uses "ask" for two different things across § 4.3: a `request` and
  a hold are both asks in § 4.3.1's lead-in, and here only the first is meant.
