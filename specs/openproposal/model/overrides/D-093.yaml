options:
- id: the-text-tells-them-apart
  summary: >-
    Each of the four is two concepts and the rows say which, so the member is listed as a homonym with
    the reason. Nothing is retyped to make one name carry one concept.
- id: one-concept-each
  summary: >-
    Each pair is folded onto whichever concept is wider, so the member carries one concept and no
    homonym is listed.
chosen: the-text-tells-them-apart
rationale: 'A member name that resolves to two concepts is either a name used for two things or a reading
  that got one of them wrong, and the only way to tell is to read the two rows. All four here are the
  first, and each pair''s rows differ in the clause that follows "How many" or "The first".


  **`quantity`.** An addressable scale''s is "How many", a count of reachable things. An availability''s
  is "How many. It can be fractional where the unit is, such as `rating_points` per `day`" -- a measure
  and not a count, because a rating point is not a thing you can have three and a half of by counting.
  Folding them would let a scale be fractional, which no row of it admits.


  **`start`.** An interval''s is "The first second", a point in time with a date. A clock window''s is
  "The first minute. Not `24:00`", a time of day with none: the window repeats on the days its `days[]`
  names, so the same `start` is a different second on each of them. One concept would make a daypart''s
  start a dated instant, which is the one thing a repeating window cannot carry.


  **`unit`.** Both read "What `quantity` counts", and each then names a different list. An availability''s
  core terms are "the `unit` terms of § 5.6.5, and `slots_per_loop` ... `unit_periods`", which this
  specification lists, so it is a vocabulary. An addressable scale''s are "the `frequency_cap.per` terms
  (§ 5.5), and `person`", stated by reference to another row rather than listed, so no rule reads the set
  and the row stays at the bare term grammar. The two are two lists under one member name, and the second
  is among the ten rows still waiting for a reading of its terms.


  **`url`.** A document reference''s is an `HttpsUrl`, because § 2.2 makes the scheme part of the
  requirement for a document a counterparty fetches and stores. An asset''s is a `Url` -- "Where the
  asset is, such as a tag URL with its macros unexpanded" -- which admits `http`, as D-079 read for the
  three rows that state no scheme. Folding them onto the narrower concept would refuse a tag URL the
  text admits, and onto the wider one would drop the TLS requirement from a binding document.


  `one-concept-each` is the option that would remove the listings, and in each of the four it publishes
  a type one of the two rows refuses. So the model keeps two concepts and names the member once, with
  the reason, which is what a homonym listing is for.'
