options:
- id: a-rule-of-the-line-item-on-the-entry-the-commitment-names
  summary: >-
    `role: rule, object: LineItem`. "Any other entry" is the `pricing[]` entry the commitment
    names, since that is the entry a resolution prices against, and an option resolves where a
    delta is in effect and outside `included[]`. A line item holds the fields, the entries and
    the commitment, so one decides it.
- id: a-rule-of-every-entry-the-line-item-offers
  summary: >-
    The same owner, reading "any other entry" as every entry of `pricing[]`: a seller that
    prices an option by `delta_cpm` alone offers it on a line item whose entries are all `CPM`
    or `CPMV`, or the option can never resolve.
- id: a-statement-the-delta-row-already-carries
  summary: >-
    `role: schema, in: PriceDelta`, since `delta_cpm`'s own row says it is added "to the rate of
    a `CPM` or `CPMV` entry (§ 5.6.5), and to no other", and the sentence restates that.
chosen: a-rule-of-the-line-item-on-the-entry-the-commitment-names
rationale: >-
  THE SENTENCE FORBIDS A RESOLUTION, NOT AN OFFER, AND § 3 SAYS WHAT A RESOLUTION IS:
  "Resolution is validation and pricing, not acceptance." So what the rule reaches is the
  pricing a payload actually states, and § 5.6 puts that against one entry -- the one
  `commitment.pricing_id` names, or the only entry where it names none. A line item holds the
  selectable fields, their `deltas`, the `pricing[]` and the `commitment` at once, so one line
  item decides the rule and `LineItem` is the owner (type rules § 9), as it is for § 3.1's other
  rule under `D-103`.


  WHAT PUTS AN OPTION IN EFFECT IS THE DOCUMENT'S OWN ANSWER, in two sentences of § 3.1:
  "`selected[]` is the complete set in effect and replaces `included[]`", and "With no
  `selected[]`, `included[]` is in effect." A delta prices "an option outside `included[]`", so
  the option that resolves against the entry is one the set in effect holds and `included[]`
  does not. That is the same reading `rule:5.6.5`'s `delta_flat` check already rests on, and the
  walk is now one helper both use rather than two.


  `a-rule-of-every-entry-the-line-item-offers` reads a prohibition on resolving as a prohibition
  on offering, and the row it would rest on says the opposite: `delta_cpm` is added to a `CPM`
  or `CPMV` entry "and to no other", which tells a seller what the key does against each entry
  rather than which entries it may sit beside. A line item may price one entry `CPM` and
  another `CPC` -- `proposal-issued.yaml` prices two currencies and § 5.6 allows a mechanism per
  entry -- and under that reading the seller could offer no `delta_cpm` option at all, which no
  sentence of the text says.


  `a-statement-the-delta-row-already-carries` is refused by what the published type can express.
  `PriceDelta` is three optional amounts, and no keyword of it can see a `pricing[]` entry's
  `cost_method`: the entry is not a member of the delta, nor of the field that holds it, nor of
  any object `PriceDelta` reaches. The row and the sentence are also not the same statement --
  the row says where the amount is added, and the sentence says the option must not resolve
  where it is not -- so roling this one `schema` would leave the second uncarried while claiming
  it was carried.


  THE PAIR IS THE SOURCE'S OWN BYTES. `proposal-issued.yaml`'s `business-daily-display` is the
  one shipped payload where a delta is in effect: the buyer's `formats.selected` holds
  `display/970x250`, which `included[]` does not, and `deltas` prices it at `delta_cpm: 3.00`
  and nothing else, while `commitment.pricing_id` names `bd-cpm-usd`, a `CPM` entry -- the file
  even writes the arithmetic, "(24.00 + 3.00) x (1 + 0.02) = 27.54". The valid half is that line
  item trimmed to the six keys a `LineItem` requires plus the `formats`, the `pricing` and the
  `commitment` the rule reads. The invalid half reads the committed entry's `cost_method` as
  `CPC`, a core term of § 5.6.5's own table that requires no `cost_parameters`, and changes
  nothing else: one value, and one the vocabulary states.


  WHAT THIS COSTS, counted rather than described. A line item that does not say which entry the
  buyer commits under -- several entries and no `pricing_id` -- is left undecided, which is the
  same discipline `rule:5.7.1`'s checks keep under `D-151`, and the four part-payloads of § 5.5
  decide it for neither reason: none writes a `pricing[]`. No shipped payload puts a
  `delta_fraction`-only or `delta_flat`-only option in effect against a non-`CPM` entry either,
  so the rule's quiet cases rest on the one payload that has a delta in effect at all.
feedback: >-
  § 3.1 states the prohibition after the `Delta` table while the thing that makes it decidable
  -- which entry a resolution prices against -- is in § 5.6, and what puts an option in effect
  is three paragraphs above. A reader has to hold three places at once to know whether a line
  item breaks it. Saying in the `delta_cpm` row that the entry meant is the committed one, or
  giving the sentence the words "the entry the commitment names", would make the rule readable
  where it is written. "Any other entry" is also the only place in § 3 that calls a `pricing[]`
  entry simply an entry, while § 2.2 has an `EntryRef` for something else.
