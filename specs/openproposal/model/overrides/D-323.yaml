format: 2
id: D-323
status: proposed
kind: reading
basis: gap
author: agent
question: >-
  § 3.1 ends its `Delta` table with a sentence nothing reached: an option priced only by
  `delta_cpm` MUST NOT resolve against any other entry. Which object decides it, what is "any
  other entry", and what makes an option resolve at all?
covers:
- ir: rule:3.1:99ddc11e
  digest: 12b91f33953a643a5ea560c72f0b6025855b7adb72aea37ba0eb1b97b8975e21
  quote: An option priced only by `delta_cpm` MUST NOT resolve against any other entry.
- ir: key:3.1:Delta.delta_cpm
  digest: 60e3140cbf8caa8ce10c19f0a23b13a7f0d40dc4fc36b058d8981464e4d6a48c
  quote: "`delta_cpm` | OPTIONAL | Added to the rate of a `CPM` or `CPMV` entry (§ 5.6.5), and to no other"
- ir: key:3.1:Selectable.deltas
