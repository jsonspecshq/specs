options:
- id: by-what-decides-it
  summary: Each statement takes the role of whatever can decide it, as D-082 reads the overview module's.
    A sentence whose content a marker rule already grades carries no conformance content of its own,
    because the rule and the sentence are the same words and one of them is where the change pair sits.
- id: a-second-rule-per-marker-sentence
  summary: Each of section 3's sentences becomes a rule of its own beside the marker row it was extracted
    from, so the rules output holds both and each needs its own change pair.
chosen: by-what-decides-it
rationale: 'Four of the fourteen are the sentences section 3''s marker table states inside its own cells:
  the seller sets a `seller-set` field and may revise it while the status allows, each `selectable` option
  may carry a price delta, the buyer may ask for a value outside the declared space, and every path of
  section 3.4 is OPTIONAL. The first three are the Meaning cells of `marker:3:seller-set`,
  `marker:3:selectable` and `marker:3:requestable`, which are rules the model already holds and which
  carry a change pair each. The sentence and the rule are the same words read twice, so the rule is where
  the statement is graded and the sentence carries nothing of its own. Section 3.4''s is the same shape
  against the presence each path''s row already states.


  `a-second-rule-per-marker-sentence` is what the other reading costs: eleven marker rules become fifteen,
  four of them needing a change pair that would be a copy of a pair already written, and a reader of the
  rules output would see one statement twice with no way to tell which is the specification''s.


  **Two are a published type''s.** A `Domain` is "String: lowercase ASCII, internationalized labels in
  A-label form (RFC 5890), with no scheme, port, path, or trailing dot", and "Producers MUST write this
  form" is that pattern. "Consumers MUST compare byte for byte and MUST NOT normalize a value before comparing
  it" is not: it binds what a consumer does after reading a valid value, so it is the consumer''s duty.
  The two clauses sit in one cell and are two statements, which is why one is the schema''s and the other
  an obligation.


  **Six are duties.** A consumer compares domains byte for byte and normalizes nothing; a consumer ignores
  a resolved `registry_id` entry whose verified domain is not the `domain` beside it, and an absent or
  unresolvable one never makes a document malformed. Anyone may define an extension term, and for a `channel`
  or a `cost_method` term the effects its definition states are a MUST. A binding document''s URL may
  need authentication. The seller declares everything a `selectable`, `settable` or `supplied` field needs
  to be validated and priced, so those fields resolve without a round trip. And the buyer does not alter
  the keys the seller declares beside its own write -- the `allowed[]`, `max_select` and `deltas` that
  section 3 marks `seller-set`, whose change `marker:3:seller-set` grades from the seller''s side; this
  is the same bound stated as the buyer''s duty.


  **Two carry no conformance content.** Section 2.2 states that a field''s row may narrow a shared type
  and says so, and that a field may state another effect of an extension term. Both are about how this
  document is written rather than about a value in it, which is the same reading D-082 made of section
  2.6''s columns.


  **Four of the module''s eighteen are not read here**, and they are the four that rest on types the kernel
  does not yet hold: section 3.1''s "An object option''s id is its REQUIRED `id`, unique in the field"
  and "An option priced only by `delta_cpm` MUST NOT resolve against any other entry", and section 3.2''s
  two "Each entry MUST be covered by an `allowed[]` entry" and "... by an `include[]` entry". Each is a
  rule a payload decides and each is about the shape a `Selectable` or a narrowing takes, which is
  the parameterised form section 3.2''s nine rows are waiting on. Reading them before that shape exists
  would name an owner the model has not got.'
