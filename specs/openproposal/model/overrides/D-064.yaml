options:
- id: by-what-the-arms-are
  summary: Each takes the shape its arms have. Where both arms are terms, the type is one vocabulary holding
    the union of them — `LineItemStatus` over `ProposalStatus`'s six terms and `sold_out`, `TimeUnit`
    over `CalendarUnit`'s four and `flight`. Where the arms are a vocabulary and a value domain, the type
    is a union of the two, so `Measurer` is `Side` or `RegistrableDomain`.
- id: all-three-unions
  summary: All three are unions over their named arms, so `LineItemStatus` is `ProposalStatus` or a constant
    `sold_out` and `TimeUnit` is `CalendarUnit` or a constant `flight`.
- id: all-three-vocabularies
  summary: All three are vocabularies, and `Measurer`'s domain arm is admitted as an open vocabulary's
    extension term.
chosen: by-what-the-arms-are
rationale: '**A union of a term list and one more term is a longer term list.** Nothing a payload can
  carry distinguishes `LineItemStatus` as "`ProposalStatus` or `sold_out`" from `LineItemStatus` as the
  seven terms, and the second is one type where the first is three. So `all-three-unions` publishes a
  `oneOf` over a constant for no gain, and every SDK then exposes a union where an enumeration is what
  the document describes. `LineItemStatus` and `TimeUnit` are vocabularies, declared with their terms
  and resting on their own § 2.2 rows.

  **`Measurer`''s arms are not both terms, and that is the whole difference.** `Side` is two words, `buyer`
  and `seller`; a `RegistrableDomain` is any business''s domain. No term list can hold the second arm,
  so the type is a union — and `all-three-vocabularies` is refused because admitting a domain as an **extension
  term** of an open vocabulary would state that a domain is a term outside a core list, which is what
  `namespaced-term` means and a domain is not. It would also let `examplepub.example` and `ep:examplepub`
  both through, where the row''s own words are that two values name one party only when they are equal
  byte for byte.

  **`Measurer` is declarable because `RegistrableDomain` now exists.** `D-058` added it as the kernel
  type for the domain that names a business, with the comparison that makes it its own concept; before
  that, `Measurer`''s second arm had no type and the union could not be written. The two records are one
  reading taken in two steps.

  **Why these three need an entry each rather than resolving by rule.** `src/mapping-rules.ts`''s `namedValueKind`
  resolves a Type cell against a kernel primitive, a kernel part, or a mapping **entry** declaring a vocabulary
  of that name — and not against a `types:` declaration. A vocabulary''s terms are read from the element
  the entry sits on, and none of these three rows carries a value list: each names other types instead.
  So each is declared in `types:` with its terms or its arms, where the format can hold them, and each
  row that names it takes an entry on this record, which is the mechanism''s own rule that a decision
  covers what no rule decides.

  The eight rows: `field:5.1:status` takes `LineItemStatus`; `key:5.5:FrequencyCap.period` and `key:5.7.1:ReportingOption.cadence`
  take `TimeUnit`; and `key:5.6.4:ProofOfPerformance.logged_by`, `key:5.6.5:CostParameters.rating_source`,
  `key:5.6.5:CostParameters.action_source`, `key:5.7.1:MeasurementOption.measured_by` and `key:5.7.1:ControllingMeasurementOption.counted_by`
  take `Measurer`. Each keeps the presence its own cell states, which is what the location gate holds
  it to.'
evidence:
- '`D-053` declares a § 2.2 vocabulary on the value list that carries its terms; these three rows have
  no value list, which is why they need a declaration with explicit terms instead.'
- '`D-058` added `RegistrableDomain` under the `registrable-domain` concept, which is `Measurer`''s second
  arm.'
feedback: § 2.2 states `LineItemStatus` and `TimeUnit` as one type plus one more term, which reads as
  a union and is an enumeration. List the terms where the type is defined, because a reader has to open
  two rows to learn what a line item's status can be.
challenge:
- type: Measurer
  value: ratings.example
  verdict: accept
  context: >-
    A rating source on a `CPP` entry, named by the measurement house's own
    domain rather than by a side of the deal.
  reason: >-
    `by-what-the-arms-are` reads `Measurer` as a union over its two arms, a
    `Side` and a `RegistrableDomain`, so a business's domain matches the
    second.
- type: Measurer
  value: ratings.example:nielsen
  verdict: reject
  context: >-
    A sender that writes the measurement house and the product it uses in one
    value, as an extension term of an open vocabulary is written.
  reason: >-
    `all-three-vocabularies`, the option not taken, declares `Measurer` an
    open vocabulary whose extension half is a namespaced term, and it takes
    this value. The union takes a domain or a side and neither is namespaced,
    so the value is refused -- which is what makes the two readings tell
    apart on a payload rather than only on a published form.
