question: 'Three § 2.2 spellings are stated as one thing or another: `LineItemStatus` is "A `ProposalStatus`,
  or `sold_out`", `TimeUnit` is "A `CalendarUnit`, or `flight`", and `Measurer` is "A `Side`, or a `RegistrableDomain`".
  None enumerates terms of its own, so none has a value list `D-053` could rest a declaration on. What
  type does each become?'
