  # § 5.6's `pricing[].price_type` row: REQUIRED when the entry prices a
  # deal mechanism. The value is the Deals API 1.0 `terms.pricetype`,
  # which says how `agreed_rate` clears, and a `Deal` carries it, so an
  # entry that prices a mechanism landing in a `Deal` and states no
  # `price_type` leaves the handoff of § 1.1 with no value to send.
  #
  # Which mechanisms an entry prices is its own
  # `transaction_mechanisms[]`, or every option the line item offers
  # where it names none, and § 5.9's table says which of those are deal
  # mechanisms. The line item's offer is not on the entry, so the vector
  # gives it as context and the check reads it from there.
  #
  # Derived from examples/proposal-agreed.yaml at
  # `/line_items/0/pricing/0`: the entry names no
  # `transaction_mechanisms[]`, so it prices every option the line item
  # offers, which is `programmatic_guaranteed`, a deal mechanism; and it
  # carries `price_type`. D-037's id form is applied to every id the
  # document mints and to every reference to one, each the UUID version 5
  # of the document's own readable id in the DNS namespace. Every other
  # value is that file's own bytes, the context value included.
  #
  # The invalid half is that entry with `price_type` removed, and nothing
  # else.
  - rule: rule:5.6:8288302a
    digest: 14845c24a6584a33e2511f328e76d63744a32697970793ff90942fffd2a9da7c
    type: PricingEntry
    valid:
      - value:
          pricing_id: 781b2e4a-fa07-5ca2-be24-61bdf2d595d2
          cost_method: CPM
          list_rate: 24
