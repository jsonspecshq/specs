  # absent -- and § 4.1.1 makes the committed entry's `agreed_rate` the
  # derived value the binding record covers, so a commitment whose entry
  # states no transacted rate records a commitment to no rate.
  #
  # The commitment is the line item's, not the entry's, so the vector
  # gives it as context and the check reads it from there. It decides the
  # entry only where the commitment names a `pricing_id`: how many
  # entries the line item holds is not on an entry either, so the row's
  # second reading, the only entry, is left undecided.
