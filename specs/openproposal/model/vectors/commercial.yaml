# Rule vectors for the statements of section 5.6.5 that a payload decides.
# Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: commercial
rules:
  # § 5.6.6's `fees[]` row ends "MUST be non-empty": a cancellation option
  # whose schedule is empty states no fee for any notice, so the option
  # promises a cancellation right and prices none of it (D-139).
  #
  # Derived from examples/line-item-audio.yaml's `cancellation_policy`, whose
  # first option is the stepped fee schedule the specification writes, taken
  # whole. The invalid half is that option with `fees` emptied, and nothing
  # else.
  - rule: rule:5.6.6:527c9881
    digest: fcf876f2537f5dcb83010a55d2b04cec414c4375695b86d12607a8a6257c3f21
    decision: D-139
    type: CancellationOption
    valid:
      - value:
          id: stepped-fee
          notice_duration: P0D
          max_share: 1
          fees:
            - before_reference: P60D
              calculation: none
            - before_reference: P30D
              calculation: cancelled
              share: 0.25
            - before_reference: P7D
              calculation: cancelled
              share: 0.5
            - before_reference: P0D
              calculation: cancelled
              share: 1.0
    invalid:
      - value:
          id: stepped-fee
          notice_duration: P0D
          max_share: 1
          fees: []
