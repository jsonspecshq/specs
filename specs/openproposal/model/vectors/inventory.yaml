# Rule vectors for the statements of sections 5.2 to 5.2.9 that a payload
# decides. Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: inventory
rules:
  # Each environment the line item offers holds an impression of its
  # `channel`: § 5.2.1 gives each environment its (distribution channel,
  # device type) pairs and § 5.1.1 gives each channel the first row an
  # impression matches, so crossing the two tables decides it (D-086).
  #
  # Derived from examples/line-item-ctv-bonus.yaml, the one line item the
  # specification ships whose `pricing` entry carries no key the model
  # publishes nowhere. It is projected to what the rule reads, `channel` and
  # `environments`, and what `LineItem` requires, and D-037's id form is
  # applied to `line_item_id` and `pricing_id`. Every other value is that
  # file's own.
  - rule: rule:5.2.1:cc42a1f8
    digest: e997800cb64e5db5c061617420685bd24d85ac97cc51c170f34d36526154e37d
    type: LineItem
    valid:
      - value:
          line_item_id: bfbe62b2-573a-559a-8fef-6d8d2ccf75af
          status: published
          channel: ctv
          environments: { available: [ ctv ], included: [ ctv ] }
          pricing:
            - pricing_id: 727ef8f4-d1b9-5ef5-9093-7e7466aef383
              cost_method: FLAT
              list_rate: 0
              price_valid_until: "2026-12-01T23:59:59Z"
              currency: USD
          visibility: public
          transaction_mechanism:
            available: [ { id: direct_io, delivery_type: non_guaranteed } ]
            included: [ direct_io ]
            max_select: 1
    # The one mutation the rule forbids: the environment offered. A `ctv`
    # environment is a TV device type on a site or an app, which § 5.1.1 gives
    # `ctv`; `web_desktop` is a personal computer, which it gives `display`,
    # `native`, `video` or `audio` and never `ctv`. The option is named in
    # `available[]` and in `included[]`, so both carry it: a payload that
    # offered one and included another would break § 3.1 as well, and then two
    # rules would decide the vector instead of one.
    invalid:
      - value:
          line_item_id: bfbe62b2-573a-559a-8fef-6d8d2ccf75af
          status: published
          channel: ctv
          environments: { available: [ web_desktop ], included: [ web_desktop ] }
          pricing:
            - pricing_id: 727ef8f4-d1b9-5ef5-9093-7e7466aef383
              cost_method: FLAT
              list_rate: 0
              price_valid_until: "2026-12-01T23:59:59Z"
              currency: USD
          visibility: public
          transaction_mechanism:
            available: [ { id: direct_io, delivery_type: non_guaranteed } ]
            included: [ direct_io ]
            max_select: 1
  # § 5.2.4's `seller_accounts[]` row: REQUIRED when
  # `seller_relationship` is `reseller`, or the line item offers a deal
  # mechanism (§ 5.9). The accounts are what an ads.txt or sellers.json
  # check reads, and both clauses are a case where the buyer cannot take
  # the seller's own word for the property: a reseller does not own it,
  # and a deal mechanism serves the impression through an exchange that
  # declares its sellers.
  #
  # The second clause is the line item's offer, which a property option
  # does not hold, so the vector gives it as context and the check reads
  # it from there. Every property option the examples ship has
  # `seller_relationship: owner` and none has `reseller`, so the source
  # grades the second clause only.
  #
  # Derived from examples/proposal-agreed.yaml at
  # `/line_items/0/properties/available/0`, whose line item offers
  # `programmatic_guaranteed`, a deal mechanism by § 5.9's table: the
  # option carries `seller_accounts`. D-037's id form is applied to every
  # id the document mints and to every reference to one, each the UUID
  # version 5 of the document's own readable id in the DNS namespace.
  # Every other value is that file's own bytes, the context value
  # included.
  #
  # The invalid half is that option with `seller_accounts` removed, and
  # nothing else.
  - rule: rule:5.2.4:45d0b1fa
    digest: f6a772d5267d5c7610684eb86d845891ff8dc8e319afac9f68ced6f9887db120
    type: PropertyOption
    valid:
      - value:
          id: 20d41300-2fbb-579b-bc61-5b334a26a30a
          domains:
            - business-daily.example
          child_audience: general
          seller_relationship: owner
          seller_accounts:
            - asi: ssp-a.example
              sid: pub-1001
        context:
          LineItem.transaction_mechanism:
            available:
              - id: programmatic_guaranteed
                delivery_type: guaranteed
            included:
              - programmatic_guaranteed
            max_select: 1
    invalid:
      - value:
          id: 20d41300-2fbb-579b-bc61-5b334a26a30a
          domains:
            - business-daily.example
          child_audience: general
          seller_relationship: owner
        context:
          LineItem.transaction_mechanism:
            available:
              - id: programmatic_guaranteed
                delivery_type: guaranteed
            included:
              - programmatic_guaranteed
            max_select: 1
  # § 5.2.9: a tentative event may not air, so an option in effect would
  # promise content the seller cannot serve into, and a charge for one is owed
