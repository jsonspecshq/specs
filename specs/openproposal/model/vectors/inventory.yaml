  # keys a `LineItem` requires plus the three fields the rule reads, with the
  # audience option its own `included[]` names. The invalid half reads the
  # property's `child_audience` as `directed`, the first value that key's own row
  # lists, and all three requirements then fail. SHOULD, so each finding is a
  # warning (D-153).
