  # § 5.2.2: without OMID 1.0 (7), viewability in an app or on CTV is measured
  # by the seller only. `line-item-rewarded-video.yaml` commits a
  # `viewable_rate`, runs on `app_mobile` and offers two vendor measurement
  # options, and its `placement.api` carries OMID 1.0, which is the sentence's
  # "Unless" -- the file says so in its own comment. The valid half is that
  # line item trimmed to the keys a `LineItem` requires plus the four fields the
  # rule reads. The invalid half removes `7` from `api[]`, so the vendors are
  # offered without OMID. SHOULD NOT, so a finding is a warning (D-153).
  - rule: rule:5.2.2:871e9967
    digest: dc17c8c4801d7dd95aa299f8d41b1de10459f40d46501daaa75759cee3f1c0b1
    decision: D-153
    type: LineItem
    valid:
      - value:
          line_item_id: puzzle-games-rewarded
          status: published
          channel: video
          visibility: public
          environments:
            available:
            - app_mobile
            included:
            - app_mobile
          placement:
            reward: 1
            instl: 1
            plcmt: 3
            ssai: 1
            skip: 0
            playmethod:
            - 3
            api:
            - 6
            - 7
          committed_metrics:
          - metric: completion_rate
            level: 0.95
            direction: at_least
          - metric: viewable_rate
            level: 0.9
            direction: at_least
          measurement_source:
            available:
            - id: ias
              measured_by: integralads.com
            - id: dv
              measured_by: doubleverify.com
            included:
            - ias
            max_select: 1
          pricing:
          - pricing_id: rewarded-cpm-usd
            cost_method: CPM
            list_rate: 22.0
            min_rate: 19.5
            price_type: 3
            price_valid_until: '2026-12-01T23:59:59Z'
            currency: USD
          transaction_mechanism:
            available:
            - id: preferred_deal
              delivery_type: non_guaranteed
            included:
