  # reference (§ 5.10). The value is "the id in the `order` entry", so an
  # entry against a line item that has one and names no order leaves the
  # change with no Order to apply to.
  #
  # The references are the line item's, which a change request does not
  # hold, so the vector gives them as context and the check reads them
  # from there.
  #
  # Derived from examples/proposal-agreed.yaml at `/change_requests/0`,
  # whose `baseline.line_item_id` is `/line_items/0`, whose
  # `external_references[]` holds a `reference_type` of `order`: the
  # entry carries `orderid`. The file states the other side too --
  # `/change_requests/1` is against a line item holding only a `deal`
  # reference and carries no `orderid`. D-037's id form is applied to
  # every id the document mints and to every reference to one, each the
  # UUID version 5 of the document's own readable id in the DNS
  # namespace. Every other value is that file's own bytes, the context
  # value included.
