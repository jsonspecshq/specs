  # change to a frozen version's offered terms appends exactly one entry
  # carrying the version it creates, and `published` is appended no later than
  # the moment version 1 freezes. No § 8 keyword states it, because "frozen" is
  # the earliest of three events and one of them is outside the payload
  # (D-116).
