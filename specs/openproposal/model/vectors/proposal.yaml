  # is frozen two ways over. D-037's id form is applied to every id the
  # document mints and to every reference to one, each the UUID version 5 of
  # the document's own readable id in the DNS namespace, so one entity keeps
  # one id wherever it appears. Every other value is that file's own bytes.
