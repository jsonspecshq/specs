                name: Show X
                domains:
                  - show-x.example
                child_audience: general
                seller_relationship: owner
            included:
              - adc9124b-94e4-5447-8f9c-c5d8c3cb38e6
          placement:
            feed: 3
          episodes: new
          formats:
            available:
              - audio/host-read-30s
            included:
              - audio/host-read-30s
          format_specs:
            audio/host-read-30s:
              spec:
                asset: script
                read_length_s: 30
                language: en
          pricing:
            - pricing_id: b3964738-cef8-5853-ae6d-92d893d7997d
              cost_method: CPM
              list_rate: 30
              agreed_rate: 30
              price_valid_until: 2026-10-30T23:59:59Z
              currency: USD
              unit_bounds:
                min: 100000
          controlling_measurement:
            available:
              - id: 3ff26d37-03d0-54d5-a154-62235a9a75f8
                counted_by: seller
                discrepancy_threshold: 0.1
                final_after: P30D
            included:
              - 3ff26d37-03d0-54d5-a154-62235a9a75f8
            max_select: 1
          commitment:
            basis: units
            amount: 400000
            flight:
              start: 2026-11-02T00:00:00Z
              end: 2026-11-30T23:59:59Z
            advertisers:
              - domain: brand-a.example
          visibility: named
          eligible_buyers:
            - agency-a.example
          transaction_mechanism:
            available:
              - id: direct_io
                delivery_type: guaranteed
            included:
              - direct_io
            max_select: 1
          serving_mode: embedded
          retention:
            min: P90D
            max: P1Y
    invalid:
      - value:
          line_item_id: 9a4cb687-15e5-5f3d-8d56-1acd5d2d5c88
          status: published
          channel: audio
          properties:
            available:
              - id: adc9124b-94e4-5447-8f9c-c5d8c3cb38e6
                name: Show X
                domains:
                  - show-x.example
                child_audience: general
                seller_relationship: owner
            included:
              - adc9124b-94e4-5447-8f9c-c5d8c3cb38e6
          placement:
            feed: 3
          episodes: new
          formats:
            available:
              - audio/host-read-30s
            included:
              - audio/host-read-30s
          format_specs:
            audio/host-read-30s:
              spec:
                asset: script
                read_length_s: 30
                language: en
          pricing:
            - pricing_id: b3964738-cef8-5853-ae6d-92d893d7997d
              cost_method: CPM
              list_rate: 30
              agreed_rate: 30
              price_valid_until: 2026-10-30T23:59:59Z
              currency: USD
              unit_bounds:
                min: 100000
          commitment:
            basis: units
            amount: 400000
            flight:
              start: 2026-11-02T00:00:00Z
              end: 2026-11-30T23:59:59Z
            advertisers:
              - domain: brand-a.example
          visibility: named
          eligible_buyers:
            - agency-a.example
          transaction_mechanism:
            available:
              - id: direct_io
                delivery_type: guaranteed
            included:
              - direct_io
            max_select: 1
          serving_mode: embedded
          retention:
            min: P90D
            max: P1Y
  # § 5.7.1's `counted_by` row states three conditions and orders them; this is
  # the third, which the cell's "Otherwise" binds only where the committed
  # entry is neither `CPP` nor `CPA`. `line-item-dooh.yaml` commits under a
  # `CPM` entry, so the clause is in force; it counts impressions, and its one
  # option is counted by the vendor its multiplier comes from. The valid half
  # is that line item trimmed to the keys it requires plus the three fields the
  # rule reads, with the proposal's `seller` as context, since § 5.6.4 reads
  # the multiplier's source against it. The invalid half is that payload
  # counted by `seller`, the value `line-item-display.yaml` gives the same
  # member. No shipped payload prices a line item at `CPP` or `CPA`, so the
  # case where the clause stands aside has no pair (D-151).
  - rule: rule:5.7.1:d9939d8b
    digest: 43183329b1994ca4030c14cff27b1b5ca451dc81b3cecf4d804bfa35cf2f60a3
    decision: D-151
    type: LineItem
    valid:
      - value:
          line_item_id: metro-platforms-dooh
          status: published
          channel: dooh
          visibility: named
          delivery_counting:
            play_tolerance_ms: 500
            proof_of_performance:
              logged_by: seller
              evidence: [ play_log, photo ]
            impression_multiplier:
              impression_type: viewable
              source_type: 1
              vendor: audience-vendor.example
              accreditation: industry_currency
              dataset: 2026-R2
              settles_on: declared
          pricing:
            - { pricing_id: metro-cpm-usd, cost_method: CPM, list_rate: 8.00, agreed_rate: 8.00,
                currency: USD, price_type: 3, price_valid_until: "2026-12-15T23:59:59Z" }
          controlling_measurement:
            available:
              - { id: vendor-count, counted_by: audience-vendor.example,
                  discrepancy_threshold: 0.10, final_after: P30D }
            included: [ vendor-count ]
            max_select: 1
          transaction_mechanism:
            available: [ { id: direct_io, delivery_type: guaranteed } ]
            included: [ direct_io ]
            max_select: 1
        context:
          Proposal.seller:
            domain: examplepub.example
            legal_name: Example Publisher US
            registry_id: reg:examplepub-digital
    invalid:
      - value:
          line_item_id: metro-platforms-dooh
          status: published
          channel: dooh
          visibility: named
          delivery_counting:
            play_tolerance_ms: 500
            proof_of_performance:
              logged_by: seller
              evidence: [ play_log, photo ]
            impression_multiplier:
              impression_type: viewable
              source_type: 1
              vendor: audience-vendor.example
              accreditation: industry_currency
              dataset: 2026-R2
              settles_on: declared
          pricing:
            - { pricing_id: metro-cpm-usd, cost_method: CPM, list_rate: 8.00, agreed_rate: 8.00,
                currency: USD, price_type: 3, price_valid_until: "2026-12-15T23:59:59Z" }
          controlling_measurement:
            available:
              - { id: vendor-count, counted_by: seller,
                  discrepancy_threshold: 0.10, final_after: P30D }
            included: [ vendor-count ]
            max_select: 1
          transaction_mechanism:
            available: [ { id: direct_io, delivery_type: guaranteed } ]
            included: [ direct_io ]
            max_select: 1
        context:
          Proposal.seller:
            domain: examplepub.example
            legal_name: Example Publisher US
