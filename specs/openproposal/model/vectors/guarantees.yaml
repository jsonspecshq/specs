# Rule vectors for the statements of section 5.7 that a payload decides.
# Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: guarantees
rules:
  # § 5.7's `controlling_measurement` row ends "`included[]` MUST name exactly
  # one option": one party's count is invoiced, so naming two says whose count
  # is billed twice over (D-142).
  #
  # Derived from the same trimmed line item: its
  # `controlling_measurement.included` names one of the two options its
  # `available[]` offers.
  #
  # The invalid half is that line item with `buyer-3pas` added to
  # `controlling_measurement.included`, which that field's `available[]`
  # already offers, so the one thing the mutation changes is how many options
  # are named.
  - rule: rule:5.7:dfffe633
    digest: 884efa85c4476ee29c35e44f1a224350101c375f12366ebf4e1905ae80d6fcf4
    decision: D-142
    type: LineItem
    valid:
      - value:
          channel: display
          controlling_measurement:
            available:
            - counted_by: seller
              discrepancy_threshold: 0.1
              final_after: P10D
              id: seller-count
            - counted_by: buyer
              discrepancy_threshold: 0.1
              final_after: P15D
              id: buyer-3pas
              qualifier: Buyer ad server A
            included:
            - seller-count
            max_select: 1
          geo:
            allowed:
            - US-NY
            - US-CA
            - US-IL
            - US-TX
            default:
              include:
              - US-NY
              - US-CA
              - US-IL
              - US-TX
          line_item_id: business-daily-display
          pricing:
          - cost_method: CPM
            currency: USD
            list_rate: 24.0
            min_rate: 21.0
            price_type: 3
            price_valid_until: '2026-11-15T23:59:59Z'
            pricing_id: bd-cpm-usd
          - cost_method: CPM
            currency: EUR
            list_rate: 22.0
            price_type: 3
            price_valid_until: '2026-11-15T23:59:59Z'
            pricing_id: bd-cpm-eur
          status: published
          transaction_mechanism:
            available:
            - delivery_type: guaranteed
              id: programmatic_guaranteed
            - delivery_type: non_guaranteed
              id: preferred_deal
            included:
            - programmatic_guaranteed
            max_select: 1
          visibility: registry_gated
    invalid:
      - value:
          channel: display
          controlling_measurement:
            available:
            - counted_by: seller
              discrepancy_threshold: 0.1
              final_after: P10D
              id: seller-count
            - counted_by: buyer
              discrepancy_threshold: 0.1
              final_after: P15D
              id: buyer-3pas
              qualifier: Buyer ad server A
            included:
            - seller-count
            - buyer-3pas
            max_select: 1
          geo:
            allowed:
            - US-NY
            - US-CA
            - US-IL
            - US-TX
            default:
              include:
              - US-NY
              - US-CA
              - US-IL
              - US-TX
          line_item_id: business-daily-display
          pricing:
          - cost_method: CPM
            currency: USD
            list_rate: 24.0
            min_rate: 21.0
            price_type: 3
            price_valid_until: '2026-11-15T23:59:59Z'
            pricing_id: bd-cpm-usd
          - cost_method: CPM
            currency: EUR
            list_rate: 22.0
            price_type: 3
            price_valid_until: '2026-11-15T23:59:59Z'
            pricing_id: bd-cpm-eur
          status: published
          transaction_mechanism:
            available:
            - delivery_type: guaranteed
              id: programmatic_guaranteed
            - delivery_type: non_guaranteed
              id: preferred_deal
            included:
            - programmatic_guaranteed
            max_select: 1
          visibility: registry_gated
  # § 5.7's `controlling_measurement` row: REQUIRED when `serving_mode`
  # is `embedded` or the line item has `committed_metrics[]`,
  # `commitment_bounds.spend`, or a `pricing[].unit_bounds`. Each of the
  # four is a figure that only a count settles, and § 5.7 gives
  # `controlling_measurement` the count the invoice reads, so a line item
  # that carries any of them and no option says whose count that is.
  #
  # Derived from examples/line-item-podcast-embedded.yaml, whole: its
  # `serving_mode` is `embedded` and its one pricing entry carries
  # `unit_bounds`, so two of the four clauses hold. D-037's id form is
  # applied to every id the document mints and to every reference to one,
  # each the UUID version 5 of the document's own readable id in the DNS
  # namespace. Every other value is that file's own bytes.
  #
  # The invalid half is that payload with `controlling_measurement`
  # removed, and nothing else.
  - rule: rule:5.7:76df804b
    digest: c1ad8c132d41a5f46d02fe035f5895f7c0314505c6ead3321c0ae5ddd9c025df
    type: LineItem
    valid:
      - value:
          line_item_id: 9a4cb687-15e5-5f3d-8d56-1acd5d2d5c88
          status: published
          channel: audio
          properties:
            available:
