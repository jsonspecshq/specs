  # § 5.7's `committed_metrics[]` row, marked `requestable`, states what a
  # request may do to a tuple and what it may not in the same breath: "A buyer
  # MAY request a stricter `level`, one further in `direction`. A request MUST
  # NOT change a tuple's `direction`". No one payload decides it, so the
  # vectors are a pair of versions under the party that made the second, and
  # the party is the buyer. Both halves are
  # `line-item-rewarded-video.yaml`'s own `viewable_rate` tuple. The valid half
  # moves its `level` to `0.95`, the level the sibling tuple of the same file
  # states and a stricter one in its direction; the invalid half changes
  # `direction` to `at_most`, the value `line-item-display.yaml` states for its
  # `ivt_rate` tuple (D-164).
  - rule: rule:5.7:13d06c59
    digest: 686a127369ca4eb013f05a21cfc1522d1a7cf6ba8c570186881f61719ddee709
    decision: D-164
    type: CommittedMetric
    valid:
      - party: buyer
        before: { metric: viewable_rate, level: 0.90, direction: at_least }
        after: { metric: viewable_rate, level: 0.95, direction: at_least }
    invalid:
      - party: buyer
        before: { metric: viewable_rate, level: 0.90, direction: at_least }
        after: { metric: viewable_rate, level: 0.90, direction: at_most }
