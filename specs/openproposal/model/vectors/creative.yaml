  # § 5.4: once the proposal leaves `draft`, every id in `formats.available[]`
  # has a `format_specs` entry. The valid half is `proposal-issued.yaml`'s
  # first line item, which is `agreed` and states an entry for each of the two
  # ids it offers, trimmed to the keys a `LineItem` requires plus the two
  # fields the rule reads. The invalid half is that payload with the
  # `display/970x250` entry removed, which leaves an offered id with no entry
  # (D-144).
  - rule: rule:5.4:c07c0dd1
    digest: c0931f38e0359ee1670e6d952b88e4f3e1361d9b44425e8d5250115357f37fab
    decision: D-144
    type: LineItem
    valid:
      - value:
          line_item_id: business-daily-display
          status: agreed
          channel: display
          visibility: named
          formats:
            available: [ display/300x250, display/970x250 ]
            included: [ display/300x250 ]
            deltas: { display/970x250: { delta_cpm: 3.00 } }
            selected: [ display/300x250, display/970x250 ]
          format_specs:
            display/300x250:
              spec_ref: registry.example/display/300x250@1
              spec: { w: 300, h: 250 }
            display/970x250:
              spec_ref: registry.example/display/970x250@1
              spec: { w: 970, h: 250 }
          pricing:
            - { pricing_id: bd-cpm-usd, cost_method: CPM, list_rate: 24.00, agreed_rate: 27.54,
                price_valid_until: "2026-11-15T23:59:59Z", currency: USD, price_type: 3 }
          transaction_mechanism:
            available: [ { id: programmatic_guaranteed, delivery_type: guaranteed } ]
            included: [ programmatic_guaranteed ]
            max_select: 1
    invalid:
