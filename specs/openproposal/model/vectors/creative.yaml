# Rule vectors for the statements of section 5.4 that a payload decides.
# Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: creative
rules:
  # § 5.4's `format_specs` row: REQUIRED when the proposal has left
  # `draft` and `formats` is present. The map is keyed by format id, so a
  # line item that offers formats and states no spec for them offers a
  # creative requirement no buyer can build to; while the proposal is
  # still `draft` the seller is still writing it.
  #
  # One clause is the proposal's `status`, which a line item does not
  # hold, so the vector gives it as context and the check reads it from
  # there. § 2.2 lists the values of a `ProposalStatus`, and `draft` is
  # the one the condition excludes.
  #
  # Derived from examples/proposal-agreed.yaml at `/line_items/0`, whose
  # proposal's `status` is `agreed`: the line item carries `formats` and
  # `format_specs`. D-037's id form is applied to every id the document
  # mints and to every reference to one, each the UUID version 5 of the
  # document's own readable id in the DNS namespace. Every other value is
  # that file's own bytes, the context value included.
  #
  # The invalid half is that payload with `format_specs` removed, and
  # nothing else.
  - rule: rule:5.4:3a677601
    digest: 179391013b3fe6067fdac2f2d7dabe2586a3a9b7b4045826d22f0eb5f446d904
    type: LineItem
