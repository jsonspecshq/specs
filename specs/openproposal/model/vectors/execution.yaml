          line_item_id: 5b2f1c84-91ae-4d33-8c7e-6a0b2d9e4f71
          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          pricing:
            - pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15
              cost_method: CPM
              currency: USD
              list_rate: 12000
    invalid:
      - value:
          channel: audio
          placement: { feed: 3 }
          episodes: new
          transaction_mechanism:
            available:
              - { id: direct_io, delivery_type: guaranteed }
              - { id: programmatic_guaranteed, delivery_type: guaranteed }
            included: [ direct_io ]
          line_item_id: 5b2f1c84-91ae-4d33-8c7e-6a0b2d9e4f71
          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          pricing:
            - pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15
              cost_method: CPM
              currency: USD
              list_rate: 12000
  # § 5.9's `deal_origin` row: REQUIRED when the line item offers a deal
  # mechanism. § 5.9's mechanism table names which mechanisms those are
  # in its own Deal mechanism column -- `No` for `direct_io`, `Yes` for
  # `programmatic_guaranteed`, `preferred_deal` and `private_auction` --
  # and § 1.1 says a deal mechanism lands in a Deals API `Deal`, whose
  # id lives in the namespace of the system `deal_origin` names. So an
  # offer of one with no `deal_origin` names no namespace for the id.
  #
  # Derived from examples/proposal-agreed.yaml at `/line_items/0`: it
  # offers `programmatic_guaranteed`, a deal mechanism, and carries
  # `deal_origin`. D-037's id form is applied to every id the document
  # mints and to every reference to one, each the UUID version 5 of the
  # document's own readable id in the DNS namespace. Every other value is
  # that file's own bytes.
  #
  # The invalid half is that payload with `deal_origin` removed, and
  # nothing else.
