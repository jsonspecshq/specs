          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          time_zone: America/New_York
          pricing: [ { pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15, cost_method: CPM, currency: USD, list_rate: 12000 } ]
    invalid:
      - value:
          channel: audio
          placement: { feed: 3 }
          episodes: new
          transaction_mechanism:
            available:
            - id: direct_io
              delivery_type: guaranteed
            included:
            - direct_io
          line_item_id: 5b2f1c84-91ae-4d33-8c7e-6a0b2d9e4f71
          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          time_zone: viewer_local
          pricing: [ { pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15, cost_method: CPM, currency: USD, list_rate: 12000 } ]
  # The § 5.9 table gives each mechanism the delivery types it allows: any for
  # `direct_io`, `guaranteed` or `share_of_voice` for `programmatic_guaranteed`,
  # and `non_guaranteed` for the two auction mechanisms. An option outside its
  # row promises what the mechanism cannot carry (D-102).
  - rule: rule:5.9:395d178a
    digest: 51db8748811b5568ecf7a953d431fdc85427b96b1fce3c620ad2d15b9608eea6
    decision: D-102
    type: MechanismOption
    valid:
      - value: { id: programmatic_guaranteed, delivery_type: guaranteed }
      - value: { id: programmatic_guaranteed, delivery_type: share_of_voice }
      # `direct_io`'s row reads "Any", so every delivery type is in it.
      - value: { id: direct_io, delivery_type: non_guaranteed }
      - value: { id: private_auction, delivery_type: non_guaranteed }
    invalid:
      - value: { id: private_auction, delivery_type: guaranteed }
      - value: { id: programmatic_guaranteed, delivery_type: non_guaranteed }
      - value: { id: preferred_deal, delivery_type: share_of_voice }
  # On an embedded line item the ad is baked into the content the seller
  # distributes, which only an insertion order sells: a deal mechanism lands in
  # a Deals API `Deal`, and no bid reaches a copy already distributed (D-102).
  - rule: rule:5.9:01b1b76d
    digest: d48ca108f96d5e2be948893a78afb9695911088a512987932f6802b25b5b74e3
    decision: D-102
    type: LineItem
    valid:
