# Rule vectors for the statements of section 5.9 that a payload decides.
# Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: execution
rules:
  # On an embedded line item, `episodes` is `new`: the ad is baked into the
  # content, so it reaches whoever receives that content and a catalogue
  # selection would promise copies already distributed (D-088).
  - rule: rule:5.9:ed367af9
    digest: 58ed8baf9c411cd155db2f060a3792996f3037942635e3499d96bc9126e6bd9f
    decision: D-088
    type: LineItem
    valid:
      - value:
          channel: audio
          placement: { feed: 3 }
          transaction_mechanism:
            available:
            - id: direct_io
              delivery_type: guaranteed
            included:
            - direct_io
          line_item_id: 5b2f1c84-91ae-4d33-8c7e-6a0b2d9e4f71
          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          episodes: new
          pricing: [ { pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15, cost_method: CPM, currency: USD, list_rate: 12000 } ]
    invalid:
      - value:
          channel: audio
          placement: { feed: 3 }
          transaction_mechanism:
            available:
            - id: direct_io
              delivery_type: guaranteed
            included:
            - direct_io
          line_item_id: 5b2f1c84-91ae-4d33-8c7e-6a0b2d9e4f71
          status: published
          visibility: public
          serving_mode: embedded
          retention: { min: "P90D", max: "P1Y" }
          episodes: catalog
          pricing: [ { pricing_id: 9c2f5b70-1d4a-4e3c-8f21-6b0d7a9e4c15, cost_method: CPM, currency: USD, list_rate: 12000 } ]
  # On an embedded line item, `time_zone` is a real clock: `daypart` bounds
  # air time, and `viewer_local` resolves only where an ad rendered, which a
  # baked-in read has no single answer for (D-088).
