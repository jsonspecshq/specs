# Rule vectors for the statements of section 5.3 that a payload decides.
# Regenerate a digest with `npm run cite -- --lock
# specs/openproposal/input/with-open-prs.lock.yaml <rule ID>`.
format: 1
module: audience
rules:
  # § 5.3's `combine` row: REQUIRED when more than one seller audience
  # can be in effect. § 3.1 states what can be in effect -- `selected[]`
  # where the buyer writes one and `included[]` otherwise, bounded by
  # `max_select` -- so more than one audience can be in effect when
  # `available[]` offers more than one and `max_select` allows more than
  # one. Without the operator the line item's first targeting condition
  # has no reading: § 5.3 gives `any` and `all` opposite meanings over
  # the set in effect.
  #
  # Derived from examples/line-item-display.yaml at `/audiences`: it
  # offers three seller audiences and a `max_select` of 2, and carries
  # `combine`. D-037's id form is applied to each option's id and to
  # every reference to one, each the UUID version 5 of the document's own
  # readable id in the DNS namespace. Every other value is that file's
  # own bytes.
  #
  # The invalid half is that value with `combine` removed, and nothing
  # else.
