# Change pairs for the § 3 marker rules and for the rules of § 2.2. A marker
# rule is about two versions of a document and the party that produced the
# second, so each vector is a pair. Regenerate a digest with `npm run cite
# --lock specs/openproposal/input/with-open-prs.lock.yaml <marker row ID>`.
format: 1
module: kernel
rules:
# A `VersionRef` outside its proposal carries `seller_domain`. The condition is
# settled by the object that carries the reference, so the pair is at the
# carrier: § 3.3's `AvailabilityRead`, which a buyer sends to read a line
# item's figures and which is no proposal (D-134).
#
# Every value is a byte of examples/proposal-agreed.yaml and every key a row of
# § 3.3's table:
#   offer                 <- /change_requests/0/baseline, a shipped `VersionRef`
#                            carrying the `line_item_id` § 3.3's `offer` row
#                            makes REQUIRED there
#   offer.seller_domain   <- /seller/domain, which § 2.2's row states the member
#                            is ("The proposal's `seller.domain`"); the offer
#                            names /proposal_id, whose seller that is
#   flight                <- /line_items/0/commitment/flight, which § 3.3's
#                            `flight` row states the value is ("as
#                            `commitment.flight`"), on the line item the offer
#                            names
#   pricing_id            <- /line_items/0/pricing/0/pricing_id, which § 3.3's
#                            `pricing_id` row states the value is ("as
#                            `commitment.pricing_id`"), on the same line item
#
# The invalid half is the one mutation the row forbids: the same message with
# `seller_domain` absent from the `offer` it carries.
- rule: rule:2.2:e46f15c4
  digest: 842f144cbb538352e229fb3aafe5bbb71a204f09e1aeb96e1c3d14aa72935dae
  decision: D-134
  type: AvailabilityRead
  valid:
  - value:
      offer:
        proposal_id: examplepub-agencya-custom-q4-2026
        version: 2
        line_item_id: business-daily-display
        seller_domain: examplepub.example
      flight: { start: '2026-10-06T00:00:00Z', end: '2026-12-21T23:59:59Z' }
      pricing_id: bd-cpm-usd
  invalid:
  - value:
      offer:
        proposal_id: examplepub-agencya-custom-q4-2026
        version: 2
        line_item_id: business-daily-display
      flight: { start: '2026-10-06T00:00:00Z', end: '2026-12-21T23:59:59Z' }
      pricing_id: bd-cpm-usd
