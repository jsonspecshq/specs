    source: { decision: D-113 }
    any_of:
      - { kind: named, name: ShortCountryCode }
      - { kind: named, name: SubdivisionCode }
      - { kind: named, name: NamespacedTerm }
  - name: FrequencyCap
    kind: object
    ir: key:5.5:FrequencyCap.count
    source: { rule: key-table-object }
    open: false
