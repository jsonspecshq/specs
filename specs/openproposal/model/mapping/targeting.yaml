# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: targeting
sections: [ "5.5" ]
depends: [ audience, inventory ]
types:
  - name: DeviceType
    kind: vocabulary
    ir: field:5.5:device
    source: { decision: D-112 }
    open: false
    terms: [ "1", "2", "3", "4", "5", "6", "7", "8" ]
    list: { name: "List: Device Types" }
  - name: ExclusionEntry
    kind: union
    ir: def:5.5:ExclusionList
    source: { decision: D-125 }
    any_of:
      - { kind: named, name: Domain }
      - { kind: named, name: AppId }
      - { kind: apply, constructor: TaxonomyCodes, arguments: { T: { kind: named, name: CategoryTaxonomy } } }
      - { kind: named, name: Text }
  - name: ExclusionList
    kind: union
    ir: def:5.5:ExclusionList
    source: { decision: D-125 }
