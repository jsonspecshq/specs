# Written by `npm run map`. `depends`, and the entries and types that cite a decision record,
# are kept as they are; every other entry and type is derived by a mapping rule (src/mapping-rules.ts).
format: 1
module: commercial
sections: [ "3.4", 4.1.2, "5.6", 5.6.1, 5.6.2, 5.6.3, 5.6.4, 5.6.5, 5.6.6, 5.6.7 ]
depends: [ audience, execution, guarantees, inventory, targeting ]
types:
  - name: LineItemWrites
    kind: object
    ir: key:3.4:LineItemWrites.commitment
    source: { decision: D-128 }
    open: false
    includes: BuyerWrites
  - name: AssentEntry
    kind: object
    ir: key:4.1.2:AssentEntry.role
    source: { rule: key-table-object }
    open: false
  - name: PricingEntry
    kind: object
    ir: "field:5.6:pricing[]"
    source: { rule: sub-field-object }
    open: false
  - name: PriceType
    kind: vocabulary
    ir: "field:5.6:pricing[].price_type"
    source: { decision: D-111 }
    open: true
    terms: [ "0", "1", "2", "3" ]
    list: { name: Terms.pricetype }
  - name: RenewalRight
    kind: vocabulary
    ir: field:5.6:renewal_right
    source: { decision: D-140 }
    open: true
    terms: [ first_refusal ]
  - name: Availability
    kind: object
    ir: key:5.6:Availability.unit
    source: { rule: key-table-object }
    open: false
  - name: AvailabilityUnit
    kind: union
    ir: key:5.6:Availability.unit
    source: { decision: D-100 }
    any_of: [ { kind: named, name: ChargeableUnit }, { kind: named, name: CapacityUnit } ]
  - name: CommitmentAmount
    kind: object
    ir: key:5.6.1:CommitmentAmount.basis
    source: { rule: key-table-object }
    open: false
  - name: Commitment
    kind: object
    ir: key:5.6.1:Commitment.pricing_id
    source: { rule: key-table-object }
    open: false
    includes: CommitmentAmount
  - name: CommitmentBounds
    kind: object
    ir: key:5.6.1:CommitmentBounds.spend
    source: { rule: key-table-object }
    open: false
  - name: Commit
    kind: object
    ir: key:5.6.1:Commit.entry
    source: { rule: key-table-object }
    open: false
  - name: CommitResult
    kind: object
    ir: "key:5.6.1:CommitResult.entries[]"
    source: { rule: key-table-object }
    open: false
  - name: HoldTerms
    kind: object
    ir: key:5.6.2:HoldTerms.available
    source: { rule: key-table-object }
    open: false
  - name: Hold
    kind: object
    ir: key:5.6.2:Hold.status
    source: { rule: key-table-object }
    open: false
  - name: DeliveryCounting
    kind: object
    ir: key:5.6.4:DeliveryCounting.play_tolerance_ms
    source: { rule: key-table-object }
    open: false
  - name: ProofOfPerformance
    kind: object
    ir: key:5.6.4:ProofOfPerformance.logged_by
    source: { rule: key-table-object }
    open: false
  - name: ImpressionMultiplier
    kind: object
    ir: key:5.6.4:ImpressionMultiplier.impression_type
    source: { rule: key-table-object }
    open: false
  - name: DoohMultiplierMeasurementSourceType
    kind: vocabulary
    ir: key:5.6.4:ImpressionMultiplier.source_type
    source: { decisions: [ D-071, D-152 ] }
    open: false
    terms: [ "1", "2", "3" ]
    list: { name: "List: DOOH Multiplier Measurement Source Types", excludes: [ "0" ] }
  - name: CostParameters
    kind: object
    ir: key:5.6.5:CostParameters.viewability_standard
    source: { decision: D-106 }
    open: true
  - name: ViewabilityStandard
    kind: vocabulary
    ir: key:5.6.5:CostParameters.viewability_standard
    source: { decision: D-140 }
    open: true
    terms: [ mrc ]
  - name: Demographic
    kind: vocabulary
    ir: key:5.6.5:CostParameters.demographic
    source: { decision: D-140 }
    open: true
    description: "The demographic a `CPP` entry is rated against, such as `ratings.example:adults_25_54`. This version of the specification lists no core terms, so every term is a namespaced one a party defines, whose definition states whether co-viewers and impressions of unknown age count."
  - name: ActionType
    kind: vocabulary
    ir: key:5.6.5:CostParameters.action_type
    source: { decision: D-140 }
    open: true
    description: "The kind of action a `CPA` entry counts. § 5.6.5 states its core terms as the `event_type` values of IAB Tech Lab ECAPI 1.0, from its Standard Events and Additional Events tables both, other than `custom`; this repository does not pin that list, so the published type carries none of them and every term is a namespaced one a party defines, such as `shop.example:store_visit`."
  - name: CancellationOption
    kind: object
    ir: key:5.6.6:CancellationOption.id
    source: { rule: key-table-object }
    open: false
  - name: Fee
    kind: object
