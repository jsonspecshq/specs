    open: false
  - name: CancellationNotice
    kind: object
    ir: key:5.6.6:CancellationNotice.option_id
    source: { rule: key-table-object }
    open: false
  - name: ExclusivityOption
    kind: object
    ir: key:5.6.7:ExclusivityOption.id
    source: { rule: key-table-object }
    open: false
  - name: Preemption
    kind: object
    ir: key:5.6.7:Preemption.reason
    source: { rule: key-table-object }
    open: false
  - name: PreemptionReason
    kind: vocabulary
    ir: key:5.6.7:Preemption.reason
    source: { decision: D-140 }
    open: true
    terms: [ exclusivity ]
