# The values this target has published, frozen. No run writes this file: `npm run proto` replaces
# the generated tree beside it and leaves this alone, because a lock a generator rewrites agrees
# with the output by construction and proves nothing. A value here changes in a reviewed commit,
# which the lock-held gate's fingerprint makes reviewed: rewriting this file moves it, and a
# record under gates/decisions/ has to accept the new one. An identity the text drops keeps its
# entry, marked `reserved`, so its value is never given to another. See src/value-lock.ts and
# pipeline-architecture.md § 3.1(c), with the amendment of 2026-10-30 that says which of its six
# rules this implements and which it cannot.
