options:
  - id: one-party-per-word
    summary: >-
      "Implementers" names both sides of the deal, so every statement whose
      actor is that word is an obligation on `implementation`, whatever the
      act is and whichever section it sits in.
  - id: party-per-act
    summary: >-
      "Implementers" names whoever performs the act in that sentence, so
      the same word gives `implementation` where the act is a conversation
      between the sides and `buyer` where the act is validating a bid
      request.
  - id: keyword-decides-the-role
    summary: >-
      The conformance keyword decides the role before the party does: a
      SHOULD or a RECOMMENDED on implementers is an obligation, and a MAY
      is a permission the model carries as informative.
chosen: one-party-per-word
rationale: >-
  Measured on both locks, `main` and `tag-1.0-202602`, by taking every
  mapping claim whose statement text contains "implementer" and reading
  what the pipeline made of it: 9 claims, carried three ways —
  5 as `obligation` with `party: implementation`
  (`rule:matching-bid-requests-to-deals:c25bb816`, `:a48a0c62`,
  `:30bd062c`, `:8cd01d0a`, and `rule:dynamic-inventory:0af8b640`),
  2 as `obligation` with `party: buyer` (`rule:what-it-isnt:6dd81df9` and
  `rule:authorization:bb5fb360`), and 2 as `informative`
  (`rule:sending-and-receiving-information:a8824341` and
  `rule:included-inventory:c5adb5e0`). One word, nine sentences, three
  dispositions.

  The document itself says which the word means. "Conversations between
  implementers should be had" and "a conversation should be had between the
  buyer and seller" are the same instruction written twice, in two
  sections, and the second names the two sides; so "implementers" is both
  sides. D-032 already wrote that rule — "where both are meant, each
  implementation" — and then departed from it twice without saying so,
  which is the whole defect here: the record states the rule and two of
  the claims it covers do not follow it.

  `party-per-act` is what the tree carries today. It costs the only
  machine-checkable thing the word gives: if the party is read off the act
  rather than the subject, no two readers get the same answer for "proceed
  with extreme caution", and the two claims that went to `buyer` are
  exactly the two whose act happens to involve a bid request. The act is
  not the subject. Reading the subject is reproducible; reading the act is
  not.

  `keyword-decides-the-role` would move the two `informative` claims to
  obligations and is right that a MAY addressed to a party is still
  addressed to a party. It is rejected here only because the role boundary
  is a second question with a wider class than this record's nine, and it
  is D-036 and D-037's. This record says what "implementers" names and
  stops.

  What the choice costs: `rule:included-inventory:c5adb5e0` tells
  implementers to expect `imp.banner` or `imp.video` in bid requests, which
  is as much a statement about OpenRTB as an obligation under this
  specification, and binding it to both sides asserts a duty about a
  document this specification does not define. That is the reading of the
  nine this record is least sure of.

  This record settles the reading and settles nothing about the value. An
  obligation's party and a statement's role are not derived by any mapping
  rule and are not among the attributes a `name` record may set, so they
  live in the hand-written `as` of `specs/dealsapi/model/mapping/`, which
  `npm run map` preserves for every entry citing a decision. The two
  claims reading `party: buyer` keep it until the authority that owns those
  fields rewrites them.
