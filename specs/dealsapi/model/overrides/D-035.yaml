feedback: >-
  Nine statements address "implementers", and the word does not say which
  side is meant. In one place the same instruction is written both ways —
  "Conversations between implementers should be had" in Matching Bid
  Requests to Deals, and "a conversation should be had between the buyer
  and seller" in Considerations. Define the term once, or replace it in
  each sentence with the side it binds: the deal's buyer, its seller, or
  both.
