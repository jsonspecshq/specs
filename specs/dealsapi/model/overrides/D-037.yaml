options:
  - id: same-words-same-claim
    summary: >-
      A sentence the document repeats states one requirement, so every copy
      carries the same role; the copies differ only in which row or section
      quotes them, which is provenance and not content.
  - id: role-from-the-host
    summary: >-
      Each copy is read from the block that hosts it, so the same words may
      be a rule where a table row quotes them and guidance where a prose
      section does.
  - id: one-claim-per-sentence
    summary: >-
      Only the first copy carries a claim and the rest are suppressed, so
      no requirement is counted twice.
chosen: same-words-same-claim
rationale: >-
  Measured on both locks, `main` and `tag-1.0-202602`, by grouping every
  mapping claim on a statement or a sentence by that element's exact text:
  4 texts the document states more than once, 8 claims among them, and 2 of
  the 4 texts carry two different roles for the same words.

  "At most, only one of `wseat` and `bseat` should be used in the same
  request" sits in the `wseat` row at line 92 and in the `bseat` row at
  line 93. The first copy is a `rule` on `Deal`; the second is
  `informative`. "This object should only be included when the deal is for
  a static set of sites or applications (`dinventory=1`)" sits in the
  `inventory` row at line 99 and again in the Inventory Object guidance at
  line 241. The first is a `rule` on `Deal`; the second is `informative`.
  The other two texts agree with themselves: both copies of the seat-ID
  coordination sentence are obligations on `implementation`, and both
  copies of "If the deal is not guaranteed this may be omitted" are
  `informative`.

  So the specification states two requirements twice and the pipeline
  counts each of them once as a requirement and once as not one. Whichever
  role is right, the pair cannot both be: a consumer reading the model's
  rules sees the mutual exclusion of `wseat` and `bseat` as a rule, and a
  consumer reading the model's informative statements sees the same
  sentence as carrying no requirement, from the same build.

  `role-from-the-host` is what the tree carries today and it has a real
  argument: a sentence in a guidance section is doing a different job from
  the same sentence in a type cell, and that is why the extractor keeps
  both. It is rejected because the role in this model is a property of
  what the sentence *requires*, not of where it is printed, and the two
  split texts are the proof: nothing about the `bseat` row makes the
  mutual-exclusion sentence require less than the `wseat` row does. Where
  the host genuinely matters — which object a rule constrains — it is
  already carried in `as.object`, which is where the host belongs.

  `one-claim-per-sentence` costs the coverage the forward pass rests on. An
  element the extractor finds and the mapping suppresses is an element with
  no claim, so the residue stops being zero and the only thing a clean
  extraction tells you is lost. It also loses the fact that the document
  says a thing twice, which is a property of the document worth keeping.

  What `same-words-same-claim` costs: it makes two claims change, and both
  the ones that change are the copies currently read as `informative`, so
  the model gains two rules on `Deal` that restate rules it already
  carries. Any count of distinct requirements over the model has to
  de-duplicate by text, and nothing does that today. The reading this
  record is least sure of is the `eb7dd0c3` pair — both copies are
  `informative` and agree, but "If the deal is not guaranteed this may be
  omitted" states a presence condition on `units` and on `totalcost`, which
  is the kind of sentence `rule-on-the-object` would take, so the pair may
  be consistently wrong rather than consistently right. That question is
  D-036's and not this record's.

  This record settles the reading and settles nothing about the value. A
  statement's role is not derived by any mapping rule and is not among the
  attributes a `name` record may set, so it lives in the hand-written `as`
  of `specs/dealsapi/model/mapping/`, which `npm run map` preserves for
  every entry that cites a decision. The two divergent copies keep
  `role: informative` until the authority that owns those fields rewrites
  them. A check that every group of claims sharing one statement text
  agrees on its role is what would hold this reading, and registering a
  check is a gate decision under `gates/decisions/`, which cites this
  record and is not this record's to make.
