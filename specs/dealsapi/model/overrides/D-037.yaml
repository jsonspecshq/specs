feedback: >-
  Four sentences are written out twice, once in each row or section they
  govern: the mutual exclusion of `wseat` and `bseat`, the seat-ID
  coordination requirement, the condition on including the Inventory
  object, and the omission of `units` and `totalcost` on a deal that is not
  guaranteed. A reader cannot tell whether the second copy restates the
  first or adds to it. Write each requirement once and have the other row
  point at it.
