# The Deals API profile (formats/spec.schema.json): how the pipeline reads the
# IAB Tech Lab Deals API 1.0 (the Deal Sync API) and what it produces from it.
# The readers are in src/specs/dealsapi/. Its text cites AdCOM's Device Types
# and Category Taxonomies lists, which it takes from the AdCOM registry in
# this repository.
format: 1
id: dealsapi
title: Deals API 1.0
upstream: https://github.com/IABTechLab/deal-api
front_end: text
plugin: dealsapi
statements: any-case
# No `through`: this specification has reached every stage. It arrived at
# `schemas` in one slice and was taken to the end in the next -- the
# verification outputs, the release and its comparison, the proto target, the
# reports and the site pages -- so its folder holds a file of each and every
# stage's gates run over it. `through` can name only `input`, `extract`,
# `model` or `schemas` (src/profile.ts's `STAGES`), so its absence is what
# says "every stage" and there is no value between `schemas` and the end.
# The documents: the push body, `Object: Deal`, and the status response,
# `Object: BuyerSeat`. Every other object's rows are an object a document's
# attribute holds, as `terms` holds `Object: Terms`.
documents:
  - { owner: deal, document: Deal, section: object-deal }
  - { owner: buyer_seat, document: BuyerSeat, section: object-buyerseat }
# The registry whose code lists the text cites, at the lock its profile pins:
# AdCOM's Device Types and Category Taxonomies at main, 26c59ba (src/imports.ts).
imports:
  - spec: adcom
    lock: main
    # The text cites AdCOM's List: Device Types as "List: Device Type" and
    # links both lists at AdCOM's main, which D-027 reads as the registry's
    # lists at the pinned commit.
    allowances:
      - { decision: D-027, cites: "List: Device Type", means: "List: Device Types" }
      - { decision: D-027, links_at: main }
# The names the outputs carry. The Deals API has no SDK types yet (schemas
# first), and its schemas' $ids are on the multi-spec hub's host, which is
# where every spec's $ids sit.
names:
  short: Deals API
  edition: "1.0"
  release: main of 2026-05-26
  schema_base: "https://jsonspecs.com/dealsapi/"
  # The proto target's package (docs/design/target-rules.md), on the same host
  # and in the same shape as AdCOM's: the specification's folder name, then the
  # edition's major version.
  proto: { package: com.jsonspecshq.dealsapi.v1 }
# Its pages on the public site (src/site/; specs/site.yaml gives the site).
site:
  # The type map opens at the push body, which is the document every other
  # object of this specification hangs off.
  default_type: Deal
  # The Deals API keeps no code lists other specifications cite -- it cites
  # AdCOM's -- so it gets no registry page.
  registry: false
  # The attribute the How it's built page follows: `sellerstatus`, whose Type
  # cell states a base type, a default and a presence and whose Description
  # cell writes a code list, so one row shows a vocabulary, a `default` and an
  # optional property. It is also the row the two locks differ on.
  example:
    document: Deal
    field: sellerstatus
    element: field:object-deal:sellerstatus
    lock: main
    variant: as-written
  locks:
    main: { label: main, short: main, where: on main, aliases: [ upstream ] }
    tag-1.0-202602: { label: Tag 1.0-202602, short: tag 1.0-202602, where: at the tag 1.0-202602, aliases: [ tag ] }
