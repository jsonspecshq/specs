# The AdCOM profile (specs/spec.schema.json): how the pipeline reads AdCOM 1.0
# and what it produces from it. The readers are in src/specs/adcom/. This
# phase reads AdCOM's lists as a registry of vocabularies, which OpenProposal
# and the Deals API reference, and its objects as the types whose attribute
# rows cite those vocabularies.
format: 1
id: adcom
title: AdCOM 1.0
upstream: https://github.com/InteractiveAdvertisingBureau/AdCOM
front_end: text
plugin: adcom
statements: any-case
# The names the outputs carry. AdCOM has no SDK types yet, and its schemas'
# $ids are on the multi-spec hub's host, which is where every spec's $ids sit.
names:
  short: AdCOM
  edition: "1.0"
  release: main of 2026-07-23
  schema_base: "https://jsonspecs.com/adcom/"
  # The proto target's package (docs/design/target-rules.md): its lists as proto3 enums under proto/.
  proto: { package: com.jsonspecshq.adcom.v1 }
# Its pages on the public site (src/site/; specs/site.yaml gives the site).
site:
  # The type map opens at the device types, a list other specs cite.
  default_type: DeviceType
  registry: true
  locks:
    main: { label: main, short: main, where: on main, aliases: [ upstream ] }
    tag-202607: { label: Tag AdCOM1.0-202607, short: tag 202607, where: at the tag AdCOM1.0-202607, aliases: [ tag ] }
# What AdCOM itself says may change without breaking an implementation
# (formats/spec.schema.json's `compatibility`). The policy is quoted from the
# text and keyed by the IR element that states it, with that element's digest,
# so it goes stale when the text does; a policy nobody can trace to the
# specification is a rule this repository invented. Both locks state it
# identically, which is why one digest covers them.
compatibility:
  states:
    ir: rule:adcomprinciples:0f8c9ced
    digest: 2cfa49df8af66463d660f62096bee94fb358d5a352444eed2680e5ba37da4d45
    text: >-
      New objects and attributes may be added and enumerated lists may be
      extended at any time and thus implementers must accept these types of
      changes without breakage within a version number.
  scopes:
    # `main` against the tag is two versions of the specification, not a
    # release of anything this repository publishes, so the comparison
    # classifies every change and fails on none.
    - { between: locks, report: true }
    # Two releases of this repository's artifacts for one lock is what an
    # implementer upgrades across, so a breaking change fails -- except the
    # three AdCOM's own statement obliges an implementer to accept.
    - between: releases
      forbid: [breaking]
      allow_codes: [added-term, added-type, added-property]
