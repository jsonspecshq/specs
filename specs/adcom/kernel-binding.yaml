# The AdCOM kernel binding (src/binding.ts): what AdCOM adds to the shared
# kernel's definitions in kernel/primitives.yaml, constructors.yaml, and
# domains.yaml. Each item is named as the kernel names it. A spec source is
# quoted and digested; regenerate a quote and a digest with
# `npm run cite -- --all-locks <IR element ID>`.
format: 1
spec: adcom
# AdCOM's lists use one kernel primitive, the vendor's code its `500+` rows
# reserve, and one more, the media offset its Start Delay Modes list writes.
# The objects use ten others: the 411 attribute rows state strings, integers,
# and numbers, and D-055 reads which concept each row's value is of. The tenth
# is `EpochMilliseconds`, which `D-063` adds for the four rows that write a
# point in time as milliseconds since the Unix epoch; `D-055` read those four
# as counts and named them the four it was least sure of. Every other kernel
# item rests on a text AdCOM doesn't write, so it is absent from AdCOM's
# kernel until a later phase maps text that uses it.
primitives:
  - name: ExternalId
    sources:
      spec:
        - ir: key:object_ad:Ad.id
          digest: c91212e637bf4a9042b519fb7a02592147d4222d58f6a4d20ab052b0f540a60d
          quote: "`id` | ID of the creative; unique at least throughout the scope of a vendor (e.g., an exchange or buying platform). Note that multiple instances of the same ad when used in transactions must have the same ID."
  - name: Text
    sources:
      spec:
        - ir: key:object_titleasset:TitleAsset.text
          digest: 6bcfdf00df9965c3ef80d506a1732072684292505c929e6504902c2a24142ca7
          quote: "`text` | The text content of the text element."
  - name: Domain
    sources:
      spec:
        - ir: key:object_ad:Ad.adomain
          digest: 37f86ea90c1b17021ac578859cc9cba64cd065978d9e2d5aa2f4be4616bb6a44
          quote: "`adomain` | Advertiser domain; top two levels only (e.g., “ford.com”). This can be an array for the case of rotating creatives."
  - name: Count
    sources:
      spec:
        - ir: key:object_display:Display.w
          digest: 6c0ff9e6133bc5bc5f640ff02c6caf29c2e8a6372b031dbb6a07c9caf2ca7789
          quote: "`w` | Absolute width of the creative in device independent pixels (DIPS), typically for non-native ads. Note that mixing absolute and relative sizes is not recommended."
  - name: Measure
    sources:
      spec:
        - ir: key:object_device:Device.pxratio
          digest: ae0db2cf6bb9662b332b186468f64d9cf5e2389003583c47e1a336475cf34047
          quote: "`pxratio` | The ratio of physical pixels to device independent pixels."
  - name: IntegerFlag
    sources:
      spec:
        - ir: key:object_displayplacement:DisplayPlacement.instl
          digest: 501331cae23b6eef0670063359fb7c8fdce19fed89fb21e50f736d8ab387f56d
          quote: "`instl` | Indicates if this is an interstitial placement, where 0 = no, 1 = yes."
  - name: Degrees
    sources:
      spec:
        - ir: key:object_geo:Geo.lat
          digest: d357a6c70250003b5587a0655321b96d4ee4c746530a9ee7529c2340d5440f01
          quote: "`lat` | Latitude from -90.0 to +90.0, where negative is south."
  - name: MinuteOffset
    sources:
      spec:
        - ir: key:object_geo:Geo.utcoffset
          digest: e55cd0b7227c584a94b60ad4b427a3ef32cd313df26f5eaa8300fb683cf475af
          quote: "`utcoffset` | Local time as the number +/- of minutes from UTC."
  - name: ExtendedDuration
    sources:
      spec:
        - ir: key:object_videoplacement:VideoPlacement.maxext
          digest: cd19f77abdf31ac4b5e1e72c91160e7d2aca303f974dcd1816c4d0f7462d45c4
          quote: "`maxext` | Maximum extended creative duration if extension is allowed. If 0, extension is not allowed. If -1, extension is allowed and there is no time limit imposed. If greater than 0, then the value represents the number of seconds of extended play supported beyond the `maxdur` value."
  - name: EpochMilliseconds
    sources:
      spec:
        - ir: key:object_ad:Ad.init
          digest: 10848abff390e3678c5b540d0374e1e94fdbc6ced1e75fa7742ded3c6c1929ef
          quote: "`init` | Timestamp of the original instantiation of this ad (i.e., this object or any of its children) in Unix format (i.e., milliseconds since the epoch)."
  - { name: Uuid, absent: true }
  - { name: Url, absent: true }
  - { name: FormatId, absent: true }
  - { name: CurrencyCode, absent: true }
  - { name: CountryCode, absent: true }
  - { name: Amount, absent: true }
  - { name: PriceAdjustment, absent: true }
  - { name: PercentChange, absent: true }
  - { name: Fraction, absent: true }
  - { name: Timestamp, absent: true }
  - { name: UtcTimestamp, absent: true }
  - { name: Duration, absent: true }
  - { name: TimeOfDay, absent: true }
  - { name: DayName, absent: true }
  - { name: TimeZone, absent: true }
  - { name: NamespacedTerm, absent: true }
  - { name: CatalogRef, absent: true }
  - { name: Digest, absent: true }
