            - ir: key:object_site:Site.pagecat
              digest: 46ac8a77646d127ea9debdbb2254ea5745dc851a3812041cc88b1354bd72e171
              quote: "`pagecat` | Array of content categories describing the current page or view of the site using IDs from the taxonomy indicated in `cattax`."
            - ir: key:object_site:Site.sectcat
              digest: 52111760d23f2f0e67620dd25dac3d084cab7deed35bc599352b05cc2daeb582
              quote: "`sectcat` | Array of content categories describing the current section of the site using IDs from the taxonomy indicated in `cattax`."
            - ir: key:object_user:User.buyeruid
              digest: c5ae824437e7a6b6658e567b4bb542cc1f064961af3cc7e3c9a4a361efdcf752
              quote: "`buyeruid` | Buyer-specific ID for the user as mapped by an exchange for the buyer. At least one of `id` or `buyeruid` is strongly recommended. Unless prior arrangements have been made between the buyer and the seller directly, the value in this field is expected to be derived from an ID sync. (see [Appendix: Cookie Based ID Syncing)](https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#appendixc)"
            - ir: key:object_user:User.consent
              digest: 84291015c80b920e50eff181b02b9e7347f59a9124ee143cee88662dd759e4f6
              quote: "`consent` | GDPR consent string if applicable, complying with the comply with the IAB standard Consent String Format in the Transparency and Consent Framework technical specifications."
            - ir: key:object_user:User.id
              digest: a3cf1bd24db4581144a1972ae2d65082aaf0e47c633007305e76b84ea2002169
              quote: "`id` | Exchange-specific ID for the user At least one of `id` or `buyeruid` is strongly recommended. Unless prior arrangements have been made between the buyer and the seller directly, the value in this field is expected to be derived from an ID sync. (see [Appendix: Cookie Based ID Syncing)](https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#appendixc)"
            - ir: key:object_useragent:UserAgent.architecture
              digest: 1123704462637e5eb1601e0fcd4e5016d9efaaa8332e871412672a602c267e6a
              quote: "`architecture` | Device’s major binary architecture, e.g. “x86” or “arm”. Implementers should retrieve this value from the Sec-CH-UA-Arch header*."
            - ir: key:object_useragent:UserAgent.bitness
              digest: aa1ba2b07b849e91dec2d93f1f520e65df32eaaf374eee81220daff2f2f3459a
              quote: "`bitness` | Device’s bitness, e.g. “64” for 64-bit architecture. Implementers should retrieve this value from the Sec-CH-UA-Bitness header *."
            - ir: key:object_video:Video.mime
              digest: b8fb6c4ad7012811fa80998890e06db758d47fb1ef7d79a4edf4dd35fe1520b9
              quote: "`mime` | Mime type(s) of the ad creative(s) (e.g., “video/mp4”)."
            - ir: key:object_videoplacement:VideoPlacement.mime
              digest: b14743c48f99311f3a1ecf2eac08bb27c25bc635768e3429822c907131e440fc
              quote: "`mime` | Array of supported mime types (e.g., “video/mp4”). If omitted, all types are assumed."
      - { name: format-id, absent: true }
  - { name: reference, absent: true }
  - name: text
    concepts:
      - name: text
        sources:
          spec:
            - ir: key:object_ad:Ad.iurl
              digest: 00d118af4209ccf6f72ca7cd87cd41b1bb73ac74e77a99d782661ba85c644080
              quote: "`iurl` | URL without cache-busting to an image that is representative of the ad content for cursory level ad quality checking."
            - ir: key:object_app:App.keywords
              digest: 70c2b88d4d1ca1ca60463575ef7c4781c66abc567aa1bc34ca884c8330b3c936
              quote: "`keywords` | This field is deprecated, use 'kwarray' instead."
            - ir: key:object_app:App.kwarray
              digest: c4e47986c2d9abfe5577b71c14bb482d472ccdc0a246870436111725c11e82da
              quote: "`kwarray` | Array of keywords about the app. Only one of 'keywords' or 'kwarray' may be present."
            - ir: key:object_app:App.storeurl
              digest: 28cdc4f6032875a15adc0bac17d2beffd9b0a6fcc46f916011525021586726a3
              quote: "`storeurl` | App store URL for an installed app; for IQG 2.1 compliance."
            - ir: key:object_audio:Audio.adm
              digest: 2b0ce51808303f047cd615325221be8b4af214531e9244b268aa776728d39b78
              quote: "`adm` | Audio markup (e.g., DAAST). Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_audio:Audio.curl
              digest: 0074324e0ad277e0c9e4121621747b623c427cb7ff38d00ca09eabe6446224ee
              quote: "`curl` | Optional means of retrieving markup by reference; a URL that returns audio markup (e.g., DAAST). If this ad is matched to a Placement specification, the `Placement.curlx` attribute indicates if this markup retrieval option is supported. Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_audit:Audit.feedback
              digest: 419c3a6183c238c408987f700a6b20645bac0e852d7fca5f2b38d100ada7854e
              quote: "`feedback` | One or more human-readable explanations as to reasons for rejection or any changes to fields for ad quality reasons (e.g., `adomain`, `cat`, `attr`, etc.)."
            - ir: key:object_banner:Banner.img
              digest: 00a5f2f9dbc1c8fd5d95d06b930f9df8eedbf82834e1fcc84cd497e4156fbbd7
              quote: "`img` | A URL that will return the image."
            - ir: key:object_brandversion:BrandVersion.brand
              digest: 697d401fd6b89fda9adf8f71ac9fc707cbbc88cd318824cd27b84a1e4e7b102c
              quote: "`brand` | A brand identifier, for example, “Chrome” or “Windows”. The value may be sourced from the User-Agent Client Hints headers, representing either the user agent brand (from the Sec-CH-UA-Full-Version header) or the platform brand (from the Sec-CH-UA-Platform header)."
            - ir: key:object_channel:Channel.name
              digest: dead0f0ce60489a63a31dd01803722b94e4868bd8ab8db44bf36f088a7b3d08b
              quote: '`name` | Channel the content is on (e.g., a local channel like "WABC-TV").'
            - ir: key:object_content:Content.album
              digest: 83be133a7c35ee3dca347521d6b18c2546957b7b878ec5624c238d3caf49cf08
              quote: "`album` | Album to which the content belongs; typically for audio."
            - ir: key:object_content:Content.artist
              digest: e3875475ee763e08d821d4fe05772825e99e0f683b20262ad70be19f233049a7
              quote: "`artist` | Artist credited with the content."
            - ir: key:object_content:Content.contentrating
              digest: d2b61afe7bc5f2de431a2d5a2c9fb3127cd10c162dcc0a3ea5c81ce93ee6a0f0
              quote: "`contentrating` | Content rating (e.g., MPAA)."
              locks:
                - tag-202607
            - ir: key:object_content:Content.genre
              digest: 8ee13f7d591581c6aecf6583cd701ce12bab8bb72aba9cc646d4c21513f0230f
              quote: "`genre` | Genre that best describes the content (e.g., rock, pop, etc)."
            - ir: key:object_content:Content.keywords
              digest: b877c1ee8e2c2dfbbb785e2851c713a81851ff72b5cfdc333c264f5105075325
              quote: "`keywords` | Comma separated list of keywords describing the content. Only one of `keywords` or `kwarray` may be present."
            - ir: key:object_content:Content.kwarray
              digest: 2e7bc965dd3bd6eb1c8891a91709afd57770e33b6732b9f88c8f8b1b5584fc51
              quote: "`kwarray` | Array of keywords about the site. Only one of `keywords` or `kwarray` may be present."
            - ir: key:object_content:Content.rating
              digest: 55b28046c71712661a3cb7aa4edd03cdff8b615fcc8a82772fa13473b9b91a0a
              quote: "`rating` | Content rating (e.g., MPAA)."
              locks:
                - main
            - ir: key:object_content:Content.season
              digest: d78ad4139775752504a7def2e8b9956f3ffbb75eb3cf1a4e0714434cce90eb51
              quote: "`season` | Content season (e.g., “Season 3”)."
            - ir: key:object_content:Content.series
              digest: a7aa122f52021a3ba45dcfa5936ac1f664f1cc4247524f083421419cb18d9f48
              quote: "`series` | Content series. Video Examples: “The Office” (television), “Star Wars” (movie), or “Arby ‘N’ The Chief” (made for web). Non-Video Example: “Ecocentric” (Time Magazine blog)."
            - ir: key:object_content:Content.title
              digest: 55b23ee410b077243f663a6dfcd243ee169934efd0c87328acd38d3d9ff85926
              quote: "`title` | Content title. Video Examples: “Search Committee” (television), “A New Hope” (movie), or “Endgame” (made for web). Non-Video Example: “Why an Antarctic Glacier Is Melting So Quickly” (Time magazine article)."
            - ir: key:object_content:Content.urating
              digest: e1523d8c3f4ffa5ac9f79057776d6f2c15760b6301f867a027a74a4565524f4c
              quote: "`urating` | User rating of the content (e.g., number of stars, likes, etc.)."
              locks:
                - main
            - ir: key:object_content:Content.url
              digest: 9a480921c7eb6370ba906b448d2d0e87934717736bb33c1a5cd63464ca28043d
              quote: "`url` | URL of the content, for buy-side contextualization or review."
            - ir: key:object_content:Content.userrating
              digest: 32e6c6fa70af9f3f67a49de6e23be4fbac50292e0c2e4b1a4e6a7148b75b1303
              quote: "`userrating` | User rating of the content (e.g., number of stars, likes, etc.)."
              locks:
                - tag-202607
            - ir: key:object_data:Data.name
              digest: 83faf94a8fb6e3da0933f59efc788cdddb058fcb02dbded82d1ca645486d5604
              quote: "`name` | Vendor-specific displayable name for the data provider."
            - ir: key:object_dataasset:DataAsset.value
              digest: e95d260f64538bf2a053ca46f9f8d0edbe0a7a5c5fad2a7237697e01f392a2b9
              quote: "`value` | A formatted string of data to be displayed (e.g., “5 stars”, “3.4 stars out of 5”, “$10”, etc.)."
            - ir: key:object_device:Device.carrier
              digest: ca541652c54771e2ebdc0c950d4cbed81210c1908ea3392f818c49319e065f6e
              quote: "`carrier` | Carrier or ISP (e.g., “VERIZON”) using exchange curated string names which should be published to bidders beforehand."
            - ir: key:object_device:Device.make
              digest: e5efc3e34b30b12fa4c6bd20dfbbb1065489214855b82e665ec2101d74204781
              quote: '`make` | Device make (e.g., "Apple").'
            - ir: key:object_device:Device.model
              digest: 71e2a0031d601c8586c5f51f2e4516cd237bb82b78f1f852c2bd3faf0ea1d47a
              quote: "`model` | Device model (e.g., “iPhone10,1” when the specific device model is known, “iPhone” otherwise). The value obtained from the device O/S should be used when available."
            - ir: key:object_device:Device.ua
              digest: c29af8d8d23c34628c59117c3ad6c99406fdd25abf5bebed1ce910c5561895e2
              quote: "`ua` | Browser user agent string. This field represents a raw user agent string from the browser. For backwards compatibility, exchanges are recommended to always populate `ua` with the User-Agent string, when available from the end user’s device, even if an alternative representation, such as the User-Agent Client-Hints, is available and gets used to populate `sua`. No inferred or approximated user agents are expected in this field. If both `ua` and `sua` are present in the bid request, `sua` should be considered the more accurate representation of the device attributes. This is because the `ua` may contain a frozen or reduced UserAgent string."
            - ir: key:object_display:Display.adm
              digest: e0789ae21c6e6753ab7efa4a2c94d8d630af4546d6aa959da960ff6f2a191ae3
              quote: "`adm` | General display markup (e.g., HTML, AMPHTML) if not using a structured alternative (e.g., `banner`, `native`). Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_display:Display.curl
              digest: 5f830a1488d42e1f0a3cb738cfbdf5b0b267937828ec5658b7fa0af4cdfd3ed1
              quote: "`curl` | Optional means of retrieving display markup by reference; a URL that can return HTML, AMPHTML, or a collection native `Asset` object and their subordinates). If this ad is matched to a Placement specification, the `Placement.curlx` attribute indicates if this markup retrieval option is supported. Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_display:Display.priv
              digest: bcbc4b27efe2000d43e261678588169d7ee8fde059d7f1e3600a325d19b9213b
              quote: "`priv` | URL of a page informing the user about a buyer's targeting activity."
            - ir: key:object_eids:ExtendedIdentifiers.matcher
              digest: 4bc5bafe0fbad45afcf6ccdb986f1f5acb32aaf19d3827c0f04addad5cbaa82c
              quote: "`matcher` | Technology providing the match method as defined in `mm`. In some cases, this may be the same value as inserter. When blank, it is assumed that the `matcher` is equal to the `source` May be omitted when mm=0, 1, or 2."
            - ir: key:object_event:Event.url
              digest: c61ad5a1e4d5649a68ad897827929ea5cab5bbafc03af87cf7f7f10f49e4cb0f
              quote: "`url` | The URL of the tracking pixel or JavaScript tag, respectively. * Required for Image-Pixel or JavaScript methods."
            - ir: key:object_imageasset:ImageAsset.url
              digest: c7284eb68fb81cedf3620ee223caa58bca23540c00966886c4bbf1547ff06180
              quote: "`url` | A URL that returns the image for the asset."
            - ir: key:object_linkasset:LinkAsset.trkr
              digest: 4e8f0c17ff51095ea8946967c1c6e6b23d953d06943f568bd6f5cefcba5d2ad9
              quote: "`trkr` | List of third-party tracker URLs to be fired on click."
            - ir: key:object_linkasset:LinkAsset.url
              digest: 8328b2a97c4dcdcc7664c60f39cc84fe14a7afedef73488c56ff843927a4d9a9
              quote: "`url` | Landing URL of the clickable link."
            - ir: key:object_linkasset:LinkAsset.urlfb
              digest: 898c3ac5272fe92fd16d9a591cc6733f4ab31e65e1eb3e7a664747b39087a705
              quote: "`urlfb` | Fallback URL for deep-link to be used if the URL specified in `url` is not supported by the device."
            - ir: key:object_network:Network.name
              digest: 5b73b270c6274cec215ead0938e75c631faec683538222385d5b88c13815ec30
              quote: '`name` | Network the content is on (e.g., a TV network like "ABC").'
            - ir: key:object_placement:Placement.sdk
              digest: 10c9bc3086c40a5413d70da30e3130e393ecf5c2cb517bda689aec0263c43229
              quote: "`sdk` | Name of ad mediation partner, SDK technology, or player responsible for rendering ad (typically video, audio, or mobile); used by some ad servers to customize ad code by partner."
            - ir: key:object_producer:Producer.name
              digest: bc970476ed9181bd20354a272936977a632e2ac2860eb1be9d1d306e08f3b178
              quote: "`name` | Displayable name of the producer."
            - ir: key:object_publisher:Publisher.name
              digest: 05e79f419e0f07fcc318d2d2c237985a175d8df906fe21896c3ff532a63d3855
              quote: "`name` | Displayable name of the publisher."
            - ir: key:object_segment:Segment.name
              digest: 8598f68f13a0cd4a908c989e06cf0bd0e699dea3bfa14bfc260317c97933f41c
              quote: "`name` | Displayable name of the data segment specific to the data provider."
            - ir: key:object_segment:Segment.value
              digest: a9e3e826d72b91ccd56c7575aa688f04e6775fe3fba309a994d8977dab314198
              quote: "`value` | String representation of the data segment value."
            - ir: key:object_site:Site.keywords
              digest: 70c2b88d4d1ca1ca60463575ef7c4781c66abc567aa1bc34ca884c8330b3c936
              quote: "`keywords` | This field is deprecated, use 'kwarray' instead."
            - ir: key:object_site:Site.kwarray
              digest: 2ee5ac92c410b543d95cd05ebd0381d8088e95f162205d11e9dded7f13b1efbe
              quote: "`kwarray` | Array of keywords about the site. Only one of 'keywords' or 'kwarray' may be present."
            - ir: key:object_site:Site.page
              digest: 32c3e4d33e2b1d7456d8ed3dc960ea9061ed77d10442f7a43ef6d2a37bb94757
              quote: "`page` | URL of the page within the site."
            - ir: key:object_site:Site.ref
              digest: 19e8709824ab4a99f3dbab3ad0198da89f51d0cad556280ffa505cf6f3db2586
              quote: "`ref` | Referrer URL that caused navigation to the current page."
            - ir: key:object_site:Site.search
              digest: bfab263268dba4e141ac146352a74983bdf363d93edfa57277b72302f12ae3a8
              quote: "`search` | Search string that caused navigation to the current page."
            - ir: key:object_titleasset:TitleAsset.text
              digest: 6bcfdf00df9965c3ef80d506a1732072684292505c929e6504902c2a24142ca7
              quote: "`text` | The text content of the text element."
            - ir: key:object_user:User.gender
              digest: b2dfca0409024a797685e171c6f41c4e13edbcaf7f9add153fd367f9212feb37
              quote: "`gender` | Deprecated as of OpenRTB 2.6"
            - ir: key:object_user:User.keywords
              digest: 70c2b88d4d1ca1ca60463575ef7c4781c66abc567aa1bc34ca884c8330b3c936
              quote: "`keywords` | This field is deprecated, use 'kwarray' instead."
            - ir: key:object_user:User.kwarray
              digest: 462dfe77513f6ae05f545bce22b6300688071c152bcd1713f1bd0af4feca1d12
              quote: "`kwarray` | Array of keywords describing the content. Only one of 'keywords' or 'kwarray' may be present."
            - ir: key:object_useragent:UserAgent.model
              digest: 585eb59f173a3e2edafda4cdb87a35bdb333571938920e0bfde966bf65f41f39
              quote: "`model` | Device model. Implementers should retrieve this value from the Sec-CH-UA-Model header *."
            - ir: key:object_video:Video.adm
              digest: 72c2bad70b6ea9ba76049838d5939ef911adc9c545f4e29f76707793f3d7641a
              quote: "`adm` | Video markup (e.g., VAST). Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_video:Video.curl
              digest: 8baabf2a3f6329c4bde31f3e61b73cd57eee161053c672d653e4862b536e810f
              quote: "`curl` | Optional means of retrieving markup by reference; a URL that returns video markup (e.g., VAST). If this ad is matched to a Placement specification, the `Placement.curlx` attribute indicates if this markup retrieval option is supported. Note that including both `adm` and `curl` is not recommended."
            - ir: key:object_videoasset:VideoAsset.adm
              digest: add81e208b45f046549f141da1b7f11c0322587fe19a662cf5993a5dd1ad0709
              quote: "`adm` | Video markup (e.g., VAST document) for the asset. * Exactly one of `adm` and `curl` is required. Including both is not recommended."
            - ir: key:object_videoasset:VideoAsset.curl
              digest: d62eddcf9ab327e04a0c5de8f2b9132420cb0d52e0cd05762239a992c162342d
              quote: "`curl` | A URL that returns the video markup (e.g., VAST document) for the asset. If this ad is matched to a placement specification, the `Placement.curlx` attribute indicates if this markup retrieval option is supported. * Exactly one of `adm` and `curl` is required. Including both is not recommended."
  - name: network
    concepts:
      - { name: url, absent: true }
      - name: domain-name
        sources:
          spec:
            - ir: key:object_ad:Ad.adomain
              digest: 37f86ea90c1b17021ac578859cc9cba64cd065978d9e2d5aa2f4be4616bb6a44
              quote: "`adomain` | Advertiser domain; top two levels only (e.g., “ford.com”). This can be an array for the case of rotating creatives."
            - ir: key:object_app:App.domain
              digest: 96576a5581821e42e5fc1819a82d8334efd109aa54a8e2a4aea270dd5cd98ed0
              quote: "`domain` | Domain of the app (e.g., “mygame.foo.com”)."
            - ir: key:object_channel:Channel.domain
              digest: c2f5304080a22163a66e81ff3ddee9b2000226df595f03ecb4aff15a16e599f1
              quote: "`domain` | The primary domain of the channel (e.g., “abc7ny.com” in the case of the local channel WABC-TV). It is recommended to include the top private domain (PSL+1) for DSP targeting normalization purposes."
            - ir: key:object_eids:ExtendedIdentifiers.inserter
              digest: ecae8748b680a5f921853464ac2200918f28394f4312898f14c653f7b7be9441
              quote: "`inserter` | The canonical domain name of the entity (publisher, publisher monetization company, SSP, Exchange, Header Wrapper, etc.) that caused the ID array element to be added. This may be the operational domain of the system, if that is different from the parent corporate domain, to facilitate WHOIS and reverse IP lookups to establish clear ownership of the delegate system. This should be the same value as used to identify sellers in an ads.txt file if one exists. For ad tech intermediaries, this would be the domain as used in ads.txt. For publishers, this would match the domain in the `site` or `app` object."
            - ir: key:object_eids:ExtendedIdentifiers.source
              digest: 3bfff530d8d2b6604d38aa4c2e80b927397a44f7791c5fc89aff9ec284f5c2ba
              quote: '`source` | Source domain of the UID provider. Should be the root domain name of the provider, not the URL. For example, "liveramp.com" not "https://liveramp.com/connect"'
            - ir: key:object_eventspec:EventSpec.jstrk
              digest: bcde160d89cea7d18eaa655123c2ddd9dd908a82df7a6d3f97e3ccf1b1797abd
              quote: "`jstrk` | Array of domains, top two levels only (e.g., “tracker.com”), that constitute a restriction list of JavaScript trackers. The sense of the restrictions is determined by `wjs`."
            - ir: key:object_eventspec:EventSpec.pxtrk
              digest: 91c0097e660d4a6905afa7f2142e4746a3bb4e129b60f9bf6a166976dd653cd9
              quote: "`pxtrk` | Array of domains, top two levels only (e.g., “tracker.com”), that constitute a restriction list of pixel image trackers. The sense of the restrictions is determined by `wpx`."
            - ir: key:object_network:Network.domain
              digest: 22f84b6e439a535fe158a80e1b027dcd86c2acdd3485ffcd8b982f0a4df12282
              quote: "`domain` | The primary domain of the network (e.g., “abc.com” in the case of the network ABC). It is recommended to include the top private domain (PSL+1) for DSP targeting normalization purposes."
            - ir: key:object_producer:Producer.domain
              digest: d8736a6720264f82553f9e5f4bdf45460ce649b6484b0be644c8679dc83c7030
              quote: "`domain` | Highest level domain of the producer (e.g., “producer.com”)."
            - ir: key:object_publisher:Publisher.domain
              digest: 950d7bc31beac50133faebd1bee41be2fd3410c8e2c39d68ddac5d0c7b0d02ac
              quote: "`domain` | Highest level domain of the publisher (e.g., “publisher.com”)."
            - ir: key:object_restrictions:Restrictions.badv
              digest: 700eac91e66f0de2792406e879ee2ab53ec2626efac296ddb19f37e9b24617ca
              quote: "`badv` | Block list of advertisers by their domains (e.g., “ford.com”)."
            - ir: key:object_site:Site.domain
              digest: acc4bd733706974dc906dccc91b292764abb9e7057df0905b2b455f8ab324ef0
              quote: "`domain` | Domain of the site (e.g., “mysite.foo.com”)."
  - { name: money, absent: true }
  - name: place
    concepts:
      - name: geo-degrees
        sources:
          spec:
            - ir: key:object_geo:Geo.lat
              digest: d357a6c70250003b5587a0655321b96d4ee4c746530a9ee7529c2340d5440f01
              quote: "`lat` | Latitude from -90.0 to +90.0, where negative is south."
            - ir: key:object_geo:Geo.lon
