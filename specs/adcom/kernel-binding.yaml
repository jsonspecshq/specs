# The eight member names the 46 objects spell alike and mean differently
# (D-059). Each row's own words and its own citation say which thing it is;
# the recurring-name check therefore stops asking the two to agree, and fails
# any entry whose name resolves to one concept again.
homonyms:
  - member: context
    decision: D-059
    reason: "A kind of content on a Content, by List: Content Contexts, and a kind of placement on a DisplayPlacement, by List: Display Context Types."
  - member: ctype
    decision: D-059
    reason: "A creative subtype by List: Creative Subtypes - Audio/Video on the audio and video objects, and by List: Creative Subtypes - Display on the display ones."
  - member: id
    decision: D-059
    reason: "An identifier a vendor assigns on fifteen objects, and the number of an AssetFormat on Asset and AssetFormat, whose rows say \"the value of `AssetFormat.id`\"."
  - member: len
    decision: D-059
    reason: "A count of seconds on a Content and of characters on the title rows, and a code of List: Native Data Asset Types on a DataAsset."
  - member: priv
    decision: D-059
    reason: "The address of a buyer's targeting page on a Display, and the flag saying whether such a page is supported on a DisplayPlacement."
  - member: ptype
    decision: D-059
    reason: "A placement type by List: Display Placement Types on a DisplayPlacement, and by List: Plcmt Subtypes - Video on a VideoPlacement."
  - member: source
    decision: D-059
    reason: "The provider's domain name on ExtendedIdentifiers, and a code of List: User-Agent Source on a UserAgent."
  - member: type
    decision: D-059
    reason: "Five lists over five objects -- Device Types, Event Types, Location Types, Native Data Asset Types and Native Image Asset Types -- each cited by the row that writes it."
