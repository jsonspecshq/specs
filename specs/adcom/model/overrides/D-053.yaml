feedback: >-
  State the attributes of `Site`, `App`, and `Dooh` in full, or say where in
  each object's attribute order the inherited four sit. Today "inherits all
  `DistributionChannel` attributes and adds those defined below" is the whole
  of the instruction, so an implementation that reads the attribute tables
  builds a `Site` with no `id`, `name`, `pub`, or `content`, while a real
  payload of a `Site` carries three of those four. Say also whether an
  abstract class may ever be sent: the note says it is never instantiated,
  and nothing in the attribute tables marks the one section that is abstract,
  so a generator that reads the tables cannot tell it from the 45 objects.
