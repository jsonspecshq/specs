format: 2
id: D-053
status: proposed
kind: reading
basis: gap
author: agent
question: "The specification heads 45 sections Object: and one Abstract Class:, whose four attributes `Site`, `App`, and `Dooh` inherit. What do those four attributes become, and what does the abstract class itself become?"
