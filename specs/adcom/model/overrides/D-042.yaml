    quote: "`2` | On Leaving Viewport or when Terminated by User"
reason: >-
  "Or when Terminated by User" ends every mode of List: Playback Cessation
  Modes and tells no code of the list from another, so D-037 drops it and
  the mode is left at 19 characters: playback ceases on leaving the
  viewport. Code 3 begins with the same words and goes on
  CONTINUES_FLOATING, which is the one thing that tells the two apart, so
  neither name can be read for the other.
