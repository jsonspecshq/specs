format: 2
id: D-056
status: proposed
kind: reading
basis: gap
author: agent
question: "Four attribute rows cite a code list and the citation yields no vocabulary: three link a heading slug the published document never anchors, and one links a section whose table AdCOM removed. What do their codes become?"
