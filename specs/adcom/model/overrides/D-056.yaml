feedback: >-
  Correct three links in the Content attribute table: `prodq`, `context` and
  `mrating` point at `#list--production-qualities-`,
  `#list--content-contexts-` and `#list--media-ratings-`, and the document
  anchors `#list_productionqualities`, `#list_contentcontexts` and
  `#list_mediaratings`. Then decide `Dooh.venue`: the row refers to List:
  DOOH Venue Types, the section is kept and its table is gone, so the row
  refers to nothing. Either restore the codes, or deprecate the attribute
  with the list and say that `venuetax` and `venuetype` replace it. The row's
  definition cell also prints the link's words twice, "List: DOOH Venue
  TypesList: DOOH Venue Types".
