feedback: >-
  Say whether a placement may be nested in a placement without bound.
  `Companion.display` refers to DisplayPlacement, `DisplayPlacement.nativefmt`
  to NativeFormat, `NativeFormat.asset` to AssetFormat, `AssetFormat.video` to
  VideoPlacement, and `VideoPlacement.comp` back to Companion, so a reader who
  follows the links returns to where they started and nothing in the document
  says how deep a sender may go or how deep a receiver must read. Either state
  a maximum depth, or say that the nesting is unbounded and that a receiver
  must handle a payload of any depth. It is the only closed chain among the 39
  references between the 46 objects, so a reader meets it once and has nothing
  to compare it with.
