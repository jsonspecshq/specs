reason: >-
  The code is a key to deduplicate on, and the key is the content taxonomy;
  IAB Tech Lab is who publishes it, which the other four keys of List: Pod
  Deduplication Settings — an adomain, a creative ID, a mediafile URL, no
  deduplication at all — never need, so D-037 drops the publisher and leaves
  the key at 32 characters. "IAB Tech Lab" is not shortened to "IAB",
  which names a different body; it is dropped, and the row keeps it in full.
