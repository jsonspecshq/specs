options:
  - id: constructs-naming-their-members
    summary: Each of the four shapes takes the construct type rules § 2a tabulates
      for it, and every branch names the member it requires beside requiring it.
  - id: constructs-with-bare-required
    summary: The same four constructs, each branch a bare `required` clause, as § 2a
      and § 8 write them in their examples.
  - id: leave-them-in-the-rules
    summary: Leave all eighteen in the rules output, which is what D-057 chose and
      D-064 superseded.
chosen: constructs-naming-their-members
rationale: >-
  The construct per shape is § 2a's table and is not chosen here:
  at-least-one-of-a-set takes an `anyOf` of one `required` clause per member,
  exactly-one-of-two a `oneOf` of the same, and required-when-a-code-is-one-of-N
  an `if` on the sibling's `const` with `then` `required`, the two codes chained
  through `else`. Fifteen of the eighteen are at-least-one-of-a-set over four
  objects, two are exactly-one-of-two on `VideoAsset`, and one is
  required-when-a-code-is-one-of-N on `Event`.


  What is chosen is the branch's form, and it is forced by measurement rather
  than preferred. A bare `required` clause inside an applicator does not
  compile: the compiler `src/schema.ts` builds -- Ajv 2020 in strict mode, which
  is the compiler every gate over a published document uses -- refuses all four
  shapes with *strict mode: required property "display" is not defined at
  "#/anyOf/0" (strictRequired)*, and refuses the `not` and the `then` forms the
  same way. So `constructs-with-bare-required` is unpublishable, and the
  examples in § 2a and § 8 that write it are examples of a document this
  repository cannot emit. Each branch therefore names the member it requires, as
  the empty schema, and the member's own type stays stated once in the owner's
  `properties`.


  What the schema refuses now, measured over the emitted bytes on both locks:
  `$defs/Ad` refuses `{"id": "ad-1"}`, `$defs/Asset` refuses `{}`,
  `$defs/AssetFormat` refuses `{"id": 1}`, `$defs/Placement` refuses `{}`,
  `$defs/VideoAsset` refuses `{}` and refuses `adm` and `curl` together, and
  `$defs/Event` refuses a payload whose `method` is 1 or 2 and that carries no
  `url`. Nineteen verdicts were sent at the published types and all nineteen are
  the verdict the rules' own vectors state, nothing this record means to keep is
  refused, and the nineteen include the one payload D-064 could not write a
  challenge entry for.


  The vectors are this record's challenge entries. A rule the schema carries is
  not restated in the rules output (§ 5, and § 2a clause 1), so the eighteen
  leave `rules.json` and their reviewed valid and invalid payloads would
  otherwise be graded by nothing: § 9's rule that the schema accepts every
  vector is exactly what an expressed requirement inverts, since the invalid
  payload is now refused. Twenty-seven distinct entries carry them, every one
  taken from the vectors rather than written again, and the `override-challenge`
  gate holds each to its verdict against the emitted schemas.
