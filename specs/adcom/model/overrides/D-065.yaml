format: 2
id: D-065
status: proposed
kind: reading
basis: gap
author: agent
question: "Sixteen attribute rows state a value the kernel's domain model has no type for: fourteen state a length of time in whole seconds, and two state an identifier an integer spells. All sixteen are published as `Count`, \"a whole number of things\". Which value domain is each of them of, and does the kernel gain the types or do the rows keep a type that names the wrong concept?"
