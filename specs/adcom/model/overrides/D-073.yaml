feedback: >-
  Five rows are deprecated and no longer say what they hold.

  `Site.keywords`, `App.keywords` and `User.keywords` have "This field is
  deprecated, use 'kwarray' instead" for their entire definition, and
  `User.gender` and `User.yob` have "Deprecated as of OpenRTB 2.6". A sender
  with one of these fields already populated, and a receiver that still accepts
  it, have nothing in AdCOM to agree on: whether `keywords` is a
  comma-separated list, a space-separated one or free text; whether `yob` is a
  four-digit year; whether `gender` takes the one-letter codes OpenRTB used.
  One sentence per row saying what the value is, kept beside the deprecation
  note, would let an implementation read a field it is still receiving. The
  other AdCOM row that holds keywords shows how little it takes: Content's
  `keywords` is defined as "Comma separated list of keywords describing the
  content" and is not deprecated.

  The specification's own example cannot state the facts its prose states.
  Appendix C introduces the bid request with "The user is a female born in
  1990", and the `user` object in the payload below carries only `id` and
  `buyeruid` — the two members that would have carried a gender and a year of
  birth are the two deprecated ones, and no other member holds either fact. If
  the intent is that this information no longer travels in AdCOM, the prose
  describing the example is now describing something the format cannot express.

  Two smaller points in the same rows. `User.kwarray` is defined as "Array of
  keywords describing the content", which is Content's wording rather than
  User's — the keywords are about the user. And a deprecation note that cites
  another specification's version number, as `gender` and `yob` do, leaves the
  reader to guess whether AdCOM intends OpenRTB's definition of the member to
  carry over; saying so either way would settle it.
