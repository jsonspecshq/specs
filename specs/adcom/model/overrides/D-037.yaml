options:
  - id: long-names
    summary: >-
      Every code's identifier is its row's name, word for word, however long it
      runs; the eleven stay at 42 to 46 characters.
  - id: drop-by-rule
    summary: >-
      A rule drops words from any identifier past a length, from a list of the
      words that may go, so no code is named one at a time.
  - id: name-per-code
    summary: >-
      A code whose identifier runs too long is named once, in review, with the
      reason beside the name, and no word-dropping rule is written.
chosen: name-per-code
rationale: >-
  Nesting each enum in a message drops the prefix every value name carried,
  and that is a rule doing nearly all of the work: over AdCOM's 287 code
  names the median falls from 32 characters to 14, the names over 40 from 99
  to 11, and the longest from 71 to 46. What is left is eleven names, and
  each is long for a reason of this one text — a taxonomy's publisher that
  every code of its list names, a clause that every mode of its list ends
  with, a parenthesis that repeats the words it glosses.

  Leaving them long costs no machinery and ships
  ON_VIDEO_COMPLETION_OR_WHEN_TERMINATED_BY_USER to every language a target
  emits, where the words that tell the code from its neighbour are the first
  nineteen characters of forty-six and the rest is the same in both. A
  word-dropping rule would buy eight of the eleven and cost a reviewed table
  of words that may go; it would also answer a question about AdCOM's prose
  rather than about every text, which is the test a rule has to pass. One
  rule with eleven exceptions is honest; eleven records standing in for a
  rule is the table of names the target rules refuse. So the rule names 276
  of the 287 and a record names 11, each with its reason beside the value.

  What the eleven follow, so that a reader can predict them: drop a word that
  tells no code of its list from another, keep every word that tells one code
  from another, and nominalise only where nothing is left to drop. Forty
  characters is the trigger for review and not a target — the eleven names
  run from 19 to 40 characters, and none was cut to reach a number. No name
  may collide with another of its own list, suffixed or not: the suffix rule
  resolves none of AdCOM's 287 names today, and a record that set it working
  would hide a collision inside a name.
