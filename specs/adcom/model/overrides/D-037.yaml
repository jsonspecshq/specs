format: 2
id: D-037
status: proposed
kind: reading
basis: gap
author: agent
question: "AdCOM names no constant: a code is a number and a row of prose, so an implementation that generates code has to make an identifier out of the row. Eleven of the 287 codes make one of 42 to 46 characters that way. What identifier does such a code get?"
