feedback: >-
  Give every code of every list a short name beside its number and its
  definition, so that each implementation names the code alike. Today a code
  has a number and a sentence, an implementation that generates constants has
  to make a name out of the sentence, and eleven of the 287 come out over
  forty characters with the words that tell one code from the next buried at
  the end.
