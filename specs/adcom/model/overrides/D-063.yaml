feedback: >-
  Four rows of the object tables — `Ad`'s `init` and `lastmod` and `Audit`'s
  `init` and `lastmod` — give their Type as an integer and describe the value
  as "Timestamp of ... in Unix format (i.e., milliseconds since the epoch)".
  Two things a machine-readable form has to decide are not in the rows. The
  first is the sign: "milliseconds since the epoch" is a signed quantity in
  the systems that produce it, and nothing says whether a sender may write an
  instant before 1970-01-01, which matters for an ad record imported from an
  older system with a zeroed or defaulted date. The second is the unit, which
  the rows do state and which the surrounding tables do not state for any
  other time value: `Geo`'s `utcoffset` is in minutes, several durations are
  in seconds, and these four are in milliseconds, so a reader has to check the
  unit per row. Stating the permitted range beside these four, and saying in
  the same place that every other time-valued attribute is in seconds or
  minutes, would settle both.
challenge:
  - type: EpochMilliseconds
    value: -86400000
    verdict: accept
    context: An ad server importing a creative library from a legacy system that recorded no creation date and exported the day before the epoch, so the ad's `init` is one day before 1970-01-01.
    reason: Taken, because the type states no lower bound of 0. This is the value the whole record is about — the published `Count` refused it by `minimum`, and the rows say "milliseconds since the epoch" without putting a sign on it.
  - type: EpochMilliseconds
    value: 1793664000000
    verdict: accept
    context: An ad server stamping `init` with the ordinary wall clock, 2026-11-03T00:00:00Z in milliseconds, which is what every sender in the wild writes.
    reason: Taken, because a positive whole number within the range satisfies `type`, `minimum` and `maximum` alike, so the retyping keeps every payload anyone sends today.
  - type: EpochMilliseconds
    value: 9007199254740992
    verdict: reject
    context: A publisher's pipeline that stamps `lastmod` in microseconds instead of milliseconds, which pushes a present-day instant past the integers a JSON reader holding numbers as doubles can read exactly.
    reason: Refused by `maximum`, which this record states and the row does not. It is the one value the chosen reading refuses that the `bare-integer` option would have taken, and it is published for the reason `Count`'s own maximum is.
  - type: EpochMilliseconds
    value: "1793664000000"
    verdict: reject
    context: A tag server that serialises every field as a string, so the timestamp arrives quoted, which is how a JavaScript sender that has been through a URL query usually writes it.
    reason: Refused by `type`, and this refusal is AdCOM's own rather than this record's, since the row states its Type as an integer and the string is out whichever concept the value belongs to.
