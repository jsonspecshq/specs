question: "Four attribute rows open their definition cell with \"Timestamp of\" and state a bare `integer`, and the mapping types them `Count`, which publishes a lower bound of 0, an ordering and a maximum. Which value domain is a point in time written as milliseconds since the Unix epoch a value of?"
