    quote: "`2` | IAB Tech Lab Content Category Taxonomy 2.0: Deprecated, and recommend NOT be used since it does not have SCD flags."
reason: >-
  All nine of List: Category Taxonomies' codes name IAB Tech Lab as the
  taxonomy's publisher, so the publisher tells no code of the list from
  another and D-037 drops it, leaving the taxonomy's own name and version
  whole at 29 characters. Nothing shorter would do: "Content Category
  Taxonomy" is what codes 1 and 2 are called, and codes 5 to 9 are a
  "Content Taxonomy", so dropping "Category" instead would name two
  documents alike.
