question: >-
  Three attribute rows enumerate codes in their own prose that are not a flag's `0` and `1`.
  What is each one's code list called?
covers:
- ir: key:object_placement:Placement.ssai#meaning/values:1
  digest: 7838f17028d0e38f6dc01fa085bc461b6df4ec109734fbf8b764cdaa6fd20074
  quote: "`0` (status unknown) | `1` (all client-side (i.e., not server-side)) | `2` (assets stitched server-side but tracking pixels fired client-side) | `3` (all server-side)"
- ir: key:object_displayplacement:DisplayPlacement.ampren#meaning/values:1
  digest: 79fd887cbb80c0b7dd271ce7dedf5e3aabe7458adbde81012eaf7b9de4c876fa
