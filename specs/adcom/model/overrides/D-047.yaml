    quote: "`9` | Initiated by user pausing content, Sound off"
reason: >-
  Codes 10 and 11 of List: Playback Methods are INITIATED_BY_IDLING, so what
  follows "initiated by" in this list is the event, and D-037 names code 9's
  event as one: the content pauses, at 36 characters. What is paused stays,
  because the ad is what plays and the content is what stopped; who paused
  it goes, since nothing but a user pauses content and the row says so where
  a reader can read it.
