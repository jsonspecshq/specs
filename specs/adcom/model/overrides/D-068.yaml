format: 2
id: D-068
status: proposed
kind: reading
basis: departure
author: agent
question: "Four rows state what omitting the member means, and two of those four also declare the member `required` in their type cell. A member cannot both be required and have a defined meaning when absent. Which witness states the presence?"
covers:
  - ir: key:object_videoplacement:VideoPlacement.mime
    digest: b14743c48f99311f3a1ecf2eac08bb27c25bc635768e3429822c907131e440fc
    quote: "`mime` | Array of supported mime types (e.g., “video/mp4”). If omitted, all types are assumed."
    departs: [required]
  - ir: key:object_audioplacement:AudioPlacement.mime
    digest: 44971266fd90b09a17bffaf98a5fb5ec56691128db4dfb72c42de9c267873a95
    quote: "`mime` | Array of supported mime types (e.g., “audio/mp4”). If omitted, all types are assumed."
    departs: [required]
  - ir: key:object_displayplacement:DisplayPlacement.mime
