options:
  - id: two-types-as-written
    summary: >-
      Each pair stays two named types, as the text writes two sections, and
      the record states that the two share one structure so that the
      duplication gate reads the pair as one definition in two sections
      rather than as one type under two names.
  - id: merge-each-pair
    summary: >-
      Each pair becomes one named type, named after one of the two, and every
      attribute row that references either references that one type.
  - id: narrow-one-of-each-pair
    summary: >-
      Each pair stays two types and one of the two takes a constraint the
      other lacks, so the two structures differ and the gate is satisfied by
      the schemas rather than by a record.
chosen: two-types-as-written
rationale: >-
  The text writes six sections, each headed `Object:` with a name of its own,
  and every attribute row that references one of the six names it and not its
  twin: `Ad.audio` refers to Object: Audio and `Ad.video` to Object: Video;
  `Content.channel` refers to Object: Channel and `Content.network` to Object:
  Network; `Content.producer` refers to Object: Producer and
  `DistributionChannel.pub` to Object: Publisher. Merging a pair would make
  those references name a type the text does not write, and would make the
  round-trip render one section's table under the other's name, so
  `merge-each-pair` is a reading the text contradicts.

  `narrow-one-of-each-pair` would satisfy the gate by adding a constraint no
  row states, which is the one thing a generated schema may not do: the
  attribute rows of Audio and Video are the same seven rows -- `mime`, `api`,
  `ctype`, `dur`, `adm`, `curl`, `ext` -- with the same types and the same
  presence, and the only difference the text writes is in the definition
  cells' prose, which is an annotation and no constraint.

  So each pair is two types with one structure, and the structures are equal
  because the specification says the same thing twice, not because this
  pipeline said it twice. That is what a receiver sees too: it reads an
  `Audio` where the `Ad` carried `audio` and a `Video` where it carried
  `video`, and nothing in either payload tells the two apart. The record
  therefore states the pairs under `twins`, and the duplication gate fails any
  entry whose two types stop sharing one structure, so the listing cannot
  outlive the text that justifies it.

  What this rejects: nothing a payload can hold. Two schemas that accept the
  same payloads accept the same payloads whether they are one definition or
  two, so the reading changes no verdict. What it costs is that a reader of
  the published tree sees six definitions where four would do, and a consumer
  generating types from the tree gets six.
twins:
  - types: [Audio, Video]
    reason: >-
      Object: Audio and Object: Video state the same seven attribute rows.
      `Ad.audio` refers to the first and `Ad.video` to the second, so the two
      names are two sections of the text and not one type named twice.
  - types: [Channel, Network]
    reason: >-
      Object: Channel and Object: Network state the same three attribute rows
      and the same `ext`. `Content.channel` refers to the first and
      `Content.network` to the second.
  - types: [Producer, Publisher]
    reason: >-
      Object: Producer and Object: Publisher state the same five attribute
      rows and the same `ext`. `Content.producer` refers to the first and
      `DistributionChannel.pub` to the second.
