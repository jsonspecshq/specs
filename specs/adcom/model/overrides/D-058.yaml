feedback: >-
  Say what distinguishes an Audio from a Video, a Channel from a Network, and
  a Producer from a Publisher, in the attributes rather than in the prose. As
  the tables stand, a receiver handed one of a pair cannot tell which it was
  sent except by the attribute it arrived on, so the three pairs are six names
  for three shapes. Either give each of a pair an attribute the other lacks,
  or state that the two are one object used in two positions.
