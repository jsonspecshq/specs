feedback: >-
  Link `Content.producer`, `Content.network`, `Content.channel`, and
  `Content.data` to the objects they hold, the way the other 37 object-valued
  rows do, and drop the section numbers "3.2.17", "3.2.21", "3.2.23", and
  "3.2.24": the document numbers no heading, so a reader has nothing to look
  them up by, and two of the four rows name no object at all, so the
  attribute's name is the only clue left. Then state what `corr` holds. Its
  definition calls it a "sparse `Ad`", and an `Ad` requires `id` and one
  media subtype object, so the example that row gives -- an `Ad` carrying
  only `cat` -- is not an `Ad`. Either define a correction object with its
  own attributes, or say that in `corr` every attribute of `Ad` is optional.
