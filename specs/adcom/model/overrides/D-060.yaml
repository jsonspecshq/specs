roots:
  - type: Ad
    reason: >-
      The root of the Media group, which the text states in those words:
      "This object is the root of a structure that defines in instance of
      advertising media". A transaction specification carries it as the media
      of a response; `media-response.json` writes it at `ad`.
  - type: App
    reason: >-
      A derived class of the abstract distribution channel (`D-053`), carried
      at the position a transaction specification gives the channel, beside
      `Site` and `Dooh`.
  - type: Device
    reason: >-
      A Context object a transaction specification carries beside the channel;
      `request-context.json` writes it at `device`.
  - type: Dooh
    reason: >-
      A derived class of the abstract distribution channel (`D-053`), carried
      at the position a transaction specification gives the channel, beside
      `Site` and `App`.
  - type: Placement
    reason: >-
      The root of the Placement group, which the text states in those words:
      "Placements of all types begin with this object as their root".
      `item-specifications.json` writes it at `placement`.
  - type: Regs
    reason: >-
      A Context object a transaction specification carries beside the channel;
      `request-context.json` writes it at `regs`.
  - type: Restrictions
    reason: >-
      A Context object a transaction specification carries beside the channel;
      `request-context.json` writes it at `restrictions`.
  - type: Site
    reason: >-
      A derived class of the abstract distribution channel (`D-053`), carried
      at the position a transaction specification gives the channel;
      `request-context.json` writes it at `site`.
  - type: User
    reason: >-
      A Context object a transaction specification carries beside the channel;
      `request-context.json` writes it at `user`.
feedback: >-
  Say which objects a transaction specification may enter AdCOM at, and at
  which position. Today the text says a transaction specification "must
  indicate the version of AdCOM in use and specify where and how it interfaces
  with AdCOM objects", which leaves the set to each transaction
  specification's own prose: a generator that reads AdCOM alone cannot tell an
  entry point from an object that lost its last reference. Naming the entry
  points in AdCOM -- or stating one container per group -- would let a
  consumer walk the published schemas from a stated root.
