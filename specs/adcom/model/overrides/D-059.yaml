options:
  - id: homonyms-as-written
    summary: >-
      Each of the eight names is a homonym: the objects that write it mean
      different things by it, each row's own words and its own citation say
      which, and the eight are listed as homonyms so that the recurring-name
      check stops asking them to agree.
  - id: one-concept-each
    summary: >-
      Each of the eight names is one thing, so the values it carries are
      widened to the one type that accepts all of them -- a bare integer for
      `context`, `ctype`, `ptype` and `type`, a bare string for `priv`, and a
      whole number for `id` and `len`.
  - id: rename-by-object
    summary: >-
      Each member is renamed so that no two objects spell two things alike,
      as `contentContext` and `displayContext`, and the published schemas
      stop carrying the names the specification writes.
chosen: homonyms-as-written
rationale: >-
  Measured on both locks over the 419 properties the 46 objects hold. Eight
  member names carry values of more than one kind, and each one is a different
  reading of the same spelling by two different objects:

  `context` is List: Content Contexts on a `Content` and List: Display Context
  Types on a `DisplayPlacement` -- a kind of content against a kind of
  placement. `ctype` is List: Creative Subtypes - Audio/Video on an `Audio`,
  an `AudioPlacement`, a `Video` and a `VideoPlacement`, and List: Creative
  Subtypes - Display on a `Display` and a `DisplayPlacement`. `ptype` is List:
  Display Placement Types on a `DisplayPlacement` and List: Plcmt Subtypes -
  Video on a `VideoPlacement`. `type` is five lists over five objects: Device
  Types, Event Types, Location Types, Native Data Asset Types and Native Image
  Asset Types. In each of those four the two rows cite two different code
  lists by name, so the text states the difference and no reading is needed to
  find it.

  The remaining four are the kind the check exists for, because the
  difference is in what the value is and not in which list it comes from.
  `id` is an identifier a vendor assigns on fifteen objects and the number of
  an `AssetFormat` on `Asset` and `AssetFormat` themselves -- the row says so:
  "the value of `AssetFormat.id`". `len` is a count of seconds on a `Content`
  and of characters on the three asset-format rows, and on `DataAsset` it is a
  code of List: Native Data Asset Types. `priv` is a URL on a `Display` and
  the 0 | 1 flag on a `DisplayPlacement`, which is the sharpest of the eight:
  one carries a page's address and the other says whether such a page is
  supported. `source` is a domain name on `ExtendedIdentifiers` and a code of
  List: User-Agent Source on a `UserAgent`.

  `one-concept-each` is refused because it widens eight members to accept
  values the text rules out: a `DisplayPlacement.priv` of `"https://..."` and
  a `Display.priv` of `1` would both validate, and the schemas would stop
  saying what the rows say. `rename-by-object` is refused because a member
  name is the specification's own and a receiver reads the name the
  specification writes; renaming would make every published schema reject a
  real payload.

  What this rejects: nothing a payload can hold, since the reading changes no
  member's type. What it costs is that a reader of the published tree meets
  eight names that mean different things in different objects, which is the
  specification's own shape and is why each is listed with its reason rather
  than silently allowed.
