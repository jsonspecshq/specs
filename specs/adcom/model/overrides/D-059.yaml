format: 2
id: D-059
status: proposed
kind: reading
basis: gap
author: agent
question: "Eight member names recur across the objects with values of more than one kind: `context`, `ctype`, `id`, `len`, `priv`, `ptype`, `source`, and `type`. Is each name one thing the objects spell alike, or several things that happen to share a spelling?"
