feedback: >-
  Four member names carry values of different kinds in different objects, and
  a reader has to read each definition cell to find out which: `priv` is a URL
  on a `Display` and a 0 | 1 flag on a `DisplayPlacement`; `id` is a
  vendor-assigned identifier on fifteen objects and an `AssetFormat.id`
  reference on two; `len` is seconds on a `Content`, characters on the
  asset-format rows and a code of List: Native Data Asset Types on a
  `DataAsset`; `source` is a domain name on `ExtendedIdentifiers` and a code
  of List: User-Agent Source on a `UserAgent`. Consider giving the narrower
  use of each a name of its own -- `privsupport`, `fmtid`, `lentype` -- so
  that one name means one thing across the specification.
