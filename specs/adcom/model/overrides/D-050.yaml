feedback: >-
  Say whether a receiver must reject, or must ignore, an attribute that no
  table names, and whether a sender may write a vendor's attribute anywhere
  but `ext`. Say also what `ext` itself holds: today two vendors that both
  extend one object may pick one member name, and nothing in the text keeps
  them apart, so a namespace per vendor would be worth stating. Two small
  things, both in the markup rather than the content: `Content.ext` is
  defined as a "Placeholder for vendor-specific extensions" where the other
  44 read "Optional vendor-specific extensions", which reads as a difference
  and is not one; and the `ext` row of the VideoPlacement table, at line
  1543, has no opening `<tr>` tag, so a parser that reads the tables as HTML
  may fold it into the row above it.
