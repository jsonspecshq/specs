  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L671"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L1222"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L617"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#L1169"
feedback: >-
  Four `len` rows state a length and never say what it counts.

  `TitleAsset.len`, `TitleAssetFormat.len`, `DataAsset.len` and
  `DataAssetFormat.len` each bound the length of a string and name no unit for
  it. A sender counting characters and a receiver counting UTF-8 bytes
  disagree about whether a 90-character title with an emoji in it fits a
  `TitleAssetFormat.len` of 90, and both are reading the specification
  correctly. Naming the unit — characters, Unicode code points, or bytes in a
  stated encoding — would settle it in one sentence per row.

  `DataAsset.len` has a second point. Its definition sends the reader to List:
  Native Data Asset Types for recommended lengths, which is a statement about
  what the number should be. The same link on another row would be a statement
  about which values the field may take, and a reader cannot tell the two uses
  apart from the link. Writing the recommendation as a sentence that does not
  cite the list as the field's own values would remove the ambiguity.
