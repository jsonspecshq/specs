options:
  - id: count-of-characters
    summary: >-
      The value is a count. A string's length is the number of the things the
      string is made of, so the kernel's count concept states it exactly and
      the four rows keep the type the domain rule already gives them. The
      record chooses the kind of value and not the primitive: which type
      expresses a count of things is the kernel's to say, and the rows at it
      are the rule's.
  - id: measure-in-characters
    summary: >-
      The value is an extent whose unit is the character, which the kernel has
      no concept for. The four rows wait on one, and a reading that calls a
      length a count puts an extent at a cardinality.
  - id: unclear-until-the-document-names-a-unit
    summary: >-
      Neither reading is the document's: a length with no unit settles nothing,
      so the rows publish no concept until AdCOM says whether it counts
      characters, bytes, or code points.
chosen: count-of-characters
rationale: >-
  A length in characters is a count of the things a string holds, and the
  kernel's count concept is a whole number of things. Nothing is added to a
  character and nothing is measured in one: the arithmetic a unit exists to
  license — adding two extents, converting one unit to another — is meaningless
  here, and the arithmetic that is meaningful on this value is the arithmetic of
  a cardinality. That is the distinction the value vocabulary is built on, so
  the two readings are not equally defensible and the second loses on it.

  The same argument settles a row these four are often confused with and which
  is not in this class. A length in **seconds** is an extent: seconds add,
  convert and subtract, and `Content.len`, `VideoPlacement.poddur` and
  `AudioPlacement.poddur` each say "in seconds" and are published at the
  seconds-duration concept. Three rows say "length" and mean an extent; these
  four say "length" and mean a cardinality. The word is the same and the value
  is not, which is why a rule reading the word would get one of the two groups
  wrong whichever way it read it.

  `unclear-until-the-document-names-a-unit` is the honest answer to a different
  question. Which unit a length counts in — characters, bytes, UTF-16 code
  units — is genuinely unstated, and two implementations can disagree about
  whether an emoji is one or two. But that is a question about the **bound** on
  the value and not about what kind of value it is, and publishing no concept
  withholds the part the document does settle in order to protest the part it
  does not. The feedback below carries the protest instead.

  What this record is for, since it moves no published byte. The four rows are
  derived by the domain rule and stay there; `DataAsset.len` reaches it because
  its citation of List: Native Data Asset Types is led in with no reference cue,
  so the list is not its vocabulary. Two independent readers of these rows split
  between a count and a measure in characters, and a reading two readers can
  each defend is a reading that moves every time the loop runs until it is
  written down. This writes it down.
