format: 2
id: D-072
status: proposed
kind: reading
basis: gap
author: agent
question: "Four rows state a length of a string's contents and name no unit for it. A length is an extent, and an extent is a measure in a unit the text names; these name none. Is the value a measure whose unit the document failed to write, or a count of things?"
