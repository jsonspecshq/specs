options:
  - id: conditions-as-rules
    summary: >-
      The statements that state the condition of a conditional attribute are
      rules, with vectors, because the schema cannot express them and the
      attribute's presence depends on them; every other statement is
      informative, and its words stay on the attribute as its description.
  - id: every-statement-a-rule
    summary: >-
      All 208 are rules, each with its own valid and invalid vectors, so
      every RFC 2119 sentence of the object sections is graded.
  - id: all-informative
    summary: >-
      All 208 are informative, so the schemas state no condition and the
      eighteen conditional attributes are published as plain optional ones.
  - id: levelled
    summary: >-
      The statements whose level is REQUIRED or MUST are rules and the rest
      are informative.
chosen: conditions-as-rules
rationale: >-
  Measured on both locks. The 46 object sections hold 208 body statements:
  206 on the `main` lock and 2 more the `tag-202607` lock writes, every one
  of them inside an attribute row's definition cell or the section's own
  prose. 23 of the 208 sit in the rows of the eighteen attributes whose
  presence the text makes conditional, and the schema emitter lists exactly
  those eighteen in `conditions.left` with the reason "the condition is
  unstated" -- it can write an `if` / `then` for a condition that names a
  sibling and a value, and these name neither. 18 of the 23 are the
  statements that state the condition; the other 5 are a second sentence in
  the same row.

  So the eighteen are the statements the published artifacts need, and this
  record maps those eighteen as rules, each with a vectors entry in
  `specs/adcom/model/vectors/objects.yaml`. Each rule's own sources carry the
  row it sits in, which is what `src/rules.ts` reads to match a rule to the
  condition it answers, so the condition the schema leaves open is answered
  by a graded rule and not by a sentence.

  The eighteen, in four groups of one sentence each, repeated per attribute:
  "At least one placement subtype object is required" (`Placement.display`,
  `.video`, `.audio`); "Required if no other media subtype object is
  specified" (`Ad.display`, `.video`, `.audio`); "Required if no other asset
  subtype object is specified" (`Asset.title`, `.image`, `.video`, `.data`,
  `.link`) and its asset-format twin (`AssetFormat.title`, `.img`, `.video`,
  `.data`); "Exactly one of `adm` and `curl` is required"
  (`VideoAsset.adm`, `.curl`); and "Required for Image-Pixel or JavaScript
  methods" (`Event.url`).

  Why not every statement. `every-statement-a-rule` is the reading this
  record would prefer and cannot afford to assert: type rules § 9 gives a
  rule no standing without valid and invalid vectors, so 208 rules means 208
  pairs of payloads, each of which has to be accepted by its type's schema
  and rejected by that rule alone. The 190 that are not conditions are of two
  further kinds -- a statement about a value's content that a payload cannot
  decide ("Note that multiple instances of the same ad when used in
  transactions must have the same ID", which is about two payloads in two
  transactions), and a recommendation that rejects nothing ("This should NOT
  be an app store ID") -- and a rule that rejects nothing has no invalid
  vector to give. Writing them as rules with invented vectors would publish
  grading that is not grading. They are informative here, with their words
  kept on the attribute as its description, and the work of reading them
  properly is named in the feedback below rather than pretended at.

  `levelled` is refused because the level is not the question: `Event.url`'s
  condition is REQUIRED and so is "all material aspects of this
  specification are to be considered REQUIRED", and the second is a sentence
  about the document. `all-informative` is refused by the emitter's own
  output: with no rule naming their rows, the eighteen conditions are
  reported by `rules-emit` as conditions the schema left to nobody, which is
  the gate working.

  What this costs a consumer, stated plainly. Of the 208 statements in
  AdCOM's object sections, 18 are graded and 190 are published as prose on
  the attribute they sit in. A reader of the schemas gets the eighteen
  conditions as rules with vectors, and gets the other 190 as descriptions,
  which no validator reads.
evidence:
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#object_ad"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#object_asset"
  - "https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/26c59ba1b235cd8d938c9877409e506f1b8d3f0c/AdCOM%20v1.0%20FINAL.md#object_placement"
feedback: >-
  Eighteen attributes are marked "required *" and the condition is a footnote
  under the table rather than a statement in the row, so nothing says which
  sibling and which value decide it. State each condition in the row, naming
  the attributes it depends on: "required if `display`, `video` and `audio`
  are all absent" is readable by a validator, and "Required if no other media
  subtype object is specified" is not. `Event.url`'s condition names two
  terms of List: Event Tracking Methods and no attribute, so a reader has to
  know that `method` is the attribute those terms belong to.
