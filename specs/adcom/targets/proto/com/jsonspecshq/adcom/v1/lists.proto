// List: Native Data Asset Types
//
// The codes of List: Native Data Asset Types
//
// Not a value: Vendor-specific, an integer of at least 500: Vendor-specific
// codes. A proto3 enum is open, so a field of this enum keeps such a number,
// within int32.
//
// From https://jsonspecs.com/adcom/schemas/modules/lists/1/lists.json#/$defs/NativeDataAssetType
message NativeDataAssetType {
  enum Enum {
    // Not a code: proto3's zero value, which an unset field holds.
    UNSPECIFIED = 0;
    // sponsored
    //
    // sponsored: "Sponsored By" message which should contain the brand name of
    // the sponsor. Recommended maximum length of at least 25 characters.
    SPONSORED = 1;
    // desc
    //
    // desc: Descriptive text associated with the product or service being
    // advertised. Long text lengths may be truncated or ellipsed when rendered.
    // Recommended maximum length of at least 140 characters.
    DESC = 2;
    // rating
    //
    // rating: Numeric rating of the product (e.g., an app's rating).
    // Recommended integer range of 0-5.
    RATING = 3;
    // likes
    //
    // likes: Number of social ratings or "likes" of the product.
    LIKES = 4;
    // downloads
    //
    // downloads: Number downloads and/or installs of the product.
    DOWNLOADS = 5;
    // price
    //
    // price: Price of the product, app, or in-app purchase. Value should
    // include currency symbol in localized format (e.g., "$10").
    PRICE = 6;
    // saleprice
    //
    // saleprice: Sale price that can be used together with "price" to indicate
    // a comparative discounted price. Value should include currency symbol in
    // localized format (e.g., "$8.50").
    SALEPRICE = 7;
    // phone
    //
    // phone: A formatted phone number.
    PHONE = 8;
    // address
    //
    // address: A formatted address.
    ADDRESS = 9;
    // desc2
    //
    // desc2: Additional descriptive text associated with the product.
    DESC2 = 10;
    // displayurl
    //
    // displayurl: Display URL for the ad. To be used when sponsoring entity
    // doesn't own the content (e.g., "Sponsored by Brand on Site", where Site
    // is specified in this data asset).
    DISPLAYURL = 11;
    // ctatext
    //
    // ctatext: Description of the call to action (CTA) button for the
    // destination URL. Recommended maximum length of at least 15 characters.
    CTATEXT = 12;
  }
}

