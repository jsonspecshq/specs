// List: ID Match Methods
//
// The codes of List: ID Match Methods
//
// Not a value: Vendor-specific, an integer of at least 500: Vendor Specific A
// proto3 enum is open, so a field of this enum keeps such a number, within
// int32.
//
// From https://jsonspecs.com/adcom/schemas/modules/lists/1/lists.json#/$defs/IdMatchMethod
message IdMatchMethod {
  enum Enum {
    // Unknown
    UNKNOWN = 0;
    // No Match
    //
    // No Match: No matching has occurred. The associated ID came directly from
    // a 3rd-party cookie or OS-provided resettable device ID for advertising
    // (IFA).
    NO_MATCH = 1;
    // Browser Cookie Sync
    //
    // Browser Cookie Sync: Real time cookie sync as described in Appendix:
    // Cookie Based ID Syncing of OpenRTB 2.x
    BROWSER_COOKIE_SYNC = 2;
    // Authenticated
    //
    // Authenticated: ID match was based on user authentication such as an email
    // login or hashed PII
    AUTHENTICATED = 3;
    // Observed
    //
    // Observed: ID match was based on a 1st party observation, but without user
    // authentication (e.g. GUID, SharedID, Session IDs, CHIPS or other 1st
    // party cookies contained in localStorage)
    OBSERVED = 4;
    // Inference
    //
    // Inference: ID match was inferred from linkage based on non-authenticated
    // features across multiple browsers or devices (e.g. IP address and/or
    // UserAgent)
    INFERENCE = 5;
  }
}

